<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6c5ce7" />
  <title>Deutsch A2 — Dein Prüfungs-Bootcamp 🚀</title>
  <style>
/* ============================================================
   Deutsch A2 Bootcamp — Styles
   ADHD-friendly: calm base, clear hierarchy, big tap targets,
   instant visual feedback, optional reduced motion ("Ruhe-Modus")
   ============================================================ */

:root {
  --bg: #f4f6fb;
  --bg-soft: #ffffff;
  --card: #ffffff;
  --ink: #1f2438;
  --ink-soft: #5b6374;
  --line: #e6e9f2;
  --brand: #6c5ce7;
  --brand-2: #8e7bff;
  --accent: #00b894;
  --accent-2: #00cec9;
  --warn: #fdcb6e;
  --bad: #ff6b6b;
  --good: #21c08b;
  --shadow: 0 8px 24px rgba(31, 36, 56, 0.08);
  --shadow-lg: 0 16px 40px rgba(31, 36, 56, 0.14);
  --radius: 18px;
  --radius-sm: 12px;
  --maxw: 980px;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
}

[data-theme="dark"] {
  --bg: #14161f;
  --bg-soft: #1c1f2b;
  --card: #1f2330;
  --ink: #eef1f8;
  --ink-soft: #a4adc2;
  --line: #2c3142;
  --brand: #8e7bff;
  --brand-2: #a594ff;
  --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.5);
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 60px;
}

/* Ruhe-Modus: kill animations */
body.calm *,
body.calm *::before,
body.calm *::after {
  animation: none !important;
  transition: none !important;
}

h1, h2, h3 { line-height: 1.2; margin: 0 0 .4em; }
p { margin: 0 0 .8em; }
small { color: var(--ink-soft); }

/* ===== Confetti ===== */
#confetti {
  position: fixed; inset: 0; pointer-events: none; z-index: 9999;
}

/* ===== Topbar ===== */
.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 12px;
  padding: 10px clamp(12px, 4vw, 28px);
  background: linear-gradient(120deg, var(--brand), var(--brand-2));
  color: #fff;
  box-shadow: var(--shadow);
}
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.brand .logo { font-size: 26px; }
.brand-text { font-weight: 800; font-size: 18px; letter-spacing: .3px; }
.brand-text small { display: block; font-weight: 600; font-size: 11px; opacity: .85; letter-spacing: 2px; text-transform: uppercase; color:#fff;}

.stats { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.stat {
  background: rgba(255, 255, 255, .16);
  padding: 5px 11px; border-radius: 999px; font-weight: 700; font-size: 14px;
  display: flex; align-items: center; gap: 5px; white-space: nowrap;
}
.stat-ico { font-size: 14px; }

.top-actions { display: flex; gap: 6px; }
.icon-btn {
  background: rgba(255, 255, 255, .16); color: #fff; border: none;
  padding: 7px 11px; border-radius: 999px; cursor: pointer; font-size: 14px;
  font-weight: 700; transition: transform .12s, background .2s;
}
.icon-btn:hover { background: rgba(255, 255, 255, .3); transform: translateY(-1px); }

/* level progress */
.levelbar { height: 6px; background: var(--line); position: sticky; top: 56px; z-index: 49; }
.levelbar-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width .5s cubic-bezier(.2,.8,.2,1);
}

/* ===== Tabs ===== */
.tabs {
  display: flex; gap: 6px; overflow-x: auto; padding: 12px clamp(12px, 4vw, 28px);
  position: sticky; top: 62px; z-index: 40; background: var(--bg);
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft);
  padding: 9px 15px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 14px;
  transition: all .15s; white-space: nowrap;
}
.tab:hover { color: var(--ink); border-color: var(--brand); }
.tab.active { background: var(--brand); color: #fff; border-color: var(--brand); box-shadow: var(--shadow); }

/* ===== Layout ===== */
.app { max-width: var(--maxw); margin: 0 auto; padding: 8px clamp(12px, 4vw, 28px) 80px; }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: clamp(16px, 3vw, 26px); box-shadow: var(--shadow); margin-bottom: 18px;
}
.card.tight { padding: 16px; }

.hero {
  background: linear-gradient(135deg, var(--brand), var(--accent-2));
  color: #fff; border: none;
}
.hero h1 { font-size: clamp(24px, 5vw, 34px); margin-bottom: .2em; }
.hero p { opacity: .95; max-width: 60ch; }

.grid { display: grid; gap: 14px; }
.grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }

/* Buttons */
.btn {
  border: 1px solid var(--line); background: var(--bg-soft); color: var(--ink);
  padding: 11px 18px; border-radius: var(--radius-sm); cursor: pointer;
  font-weight: 700; font-size: 15px; transition: all .15s; font-family: inherit;
}
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.btn:active { transform: translateY(0); }
.btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
.btn.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.big { padding: 15px 26px; font-size: 17px; border-radius: 14px; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }

/* ===== Module / Lesson cards ===== */
.module-block { margin-bottom: 26px; }
.module-title { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.module-title .badge { background: var(--brand); color: #fff; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; }
.module-sub { color: var(--ink-soft); margin-bottom: 14px; }

.lesson-card {
  position: relative; cursor: pointer; overflow: hidden;
  border-left: 6px solid var(--brand); transition: transform .15s, box-shadow .15s;
}
.lesson-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.lesson-card .emoji { font-size: 30px; }
.lesson-card h3 { font-size: 17px; margin: 8px 0 4px; }
.lesson-card .theme { color: var(--ink-soft); font-size: 14px; }
.lesson-card .gram { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--brand); background: color-mix(in srgb, var(--brand) 12%, transparent); padding: 3px 9px; border-radius: 999px; }
.lesson-card .done-flag { position: absolute; top: 12px; right: 12px; font-size: 20px; opacity: 0; transition: opacity .2s; }
.lesson-card.done .done-flag { opacity: 1; }
.lesson-card.done { border-left-color: var(--good); }

.mini-progress { height: 6px; background: var(--line); border-radius: 999px; margin-top: 12px; overflow: hidden; }
.mini-progress > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); width: 0; transition: width .4s; }

/* ===== Lesson detail ===== */
.lesson-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.lesson-head .big-emoji { font-size: 44px; }
.breadcrumb { color: var(--ink-soft); font-size: 13px; font-weight: 700; margin-bottom: 6px; }

.section-tag {
  display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px;
  text-transform: uppercase; letter-spacing: 1px; color: var(--brand); margin: 6px 0 12px;
}

/* Grammar blocks */
.gram-intro { font-size: 16px; }
.rulebox {
  background: color-mix(in srgb, var(--brand) 8%, var(--card));
  border: 1px solid color-mix(in srgb, var(--brand) 25%, var(--line));
  border-left: 5px solid var(--brand); border-radius: var(--radius-sm);
  padding: 14px 16px; margin: 12px 0;
}
.rulebox h4 { margin: 0 0 6px; color: var(--brand); }
.tipbox {
  background: color-mix(in srgb, var(--warn) 18%, var(--card));
  border: 1px dashed color-mix(in srgb, var(--warn) 60%, var(--line));
  border-radius: var(--radius-sm); padding: 12px 14px; margin: 12px 0;
}
.tipbox::before { content: "💡 Eselsbrücke "; font-weight: 800; }

.examples { margin: 12px 0; display: grid; gap: 8px; }
.example {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
  background: var(--bg-soft); border: 1px solid var(--line); border-radius: var(--radius-sm);
}
.example .de { font-weight: 700; }
.example .en { color: var(--ink-soft); font-size: 14px; }
.example .txt { flex: 1; }
.speak {
  flex: 0 0 auto; border: none; background: color-mix(in srgb, var(--brand) 14%, transparent);
  color: var(--brand); width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 15px;
  transition: background .15s, transform .1s;
}
.speak:hover { background: color-mix(in srgb, var(--brand) 26%, transparent); transform: scale(1.08); }

/* Tables */
.gram-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 14px; overflow: hidden; border-radius: var(--radius-sm); }
.gram-table th, .gram-table td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; }
.gram-table th { background: color-mix(in srgb, var(--brand) 12%, var(--card)); color: var(--ink); font-weight: 800; }
.gram-table tr:nth-child(even) td { background: var(--bg-soft); }
.table-wrap { overflow-x: auto; }

/* ===== Exercises ===== */
.exercise {
  background: var(--bg-soft); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; margin: 14px 0;
}
.ex-q { font-weight: 700; font-size: 16px; margin-bottom: 12px; }
.ex-q .blank-num { color: var(--brand); }
.ex-num { font-size: 12px; font-weight: 800; color: var(--ink-soft); letter-spacing: 1px; }

.options { display: grid; gap: 8px; }
.option {
  text-align: left; border: 2px solid var(--line); background: var(--card); color: var(--ink);
  padding: 12px 14px; border-radius: var(--radius-sm); cursor: pointer; font-size: 15px; font-weight: 600;
  transition: all .12s; font-family: inherit;
}
.option:hover { border-color: var(--brand); }
.option.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 16%, var(--card)); }
.option.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--card)); }
.option:disabled { cursor: default; }

.fill-input {
  border: 2px solid var(--line); background: var(--card); color: var(--ink);
  padding: 8px 10px; border-radius: 10px; font-size: 15px; font-weight: 600; min-width: 120px;
  font-family: inherit; margin: 0 2px;
}
.fill-input:focus { outline: none; border-color: var(--brand); }
.fill-input.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--card)); }
.fill-input.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--card)); }

/* word-order chips */
.chips-build { min-height: 48px; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; border: 2px dashed var(--line); border-radius: var(--radius-sm); margin-bottom: 10px; }
.chips-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.chip {
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
  padding: 8px 13px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 14px;
  transition: all .12s; font-family: inherit;
}
.chip:hover { border-color: var(--brand); transform: translateY(-1px); }
.chip.used { opacity: .35; pointer-events: none; }
.chips-build .chip { background: color-mix(in srgb, var(--brand) 12%, var(--card)); border-color: var(--brand); }

/* matching */
.match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.match-col { display: grid; gap: 8px; }
.match-item {
  border: 2px solid var(--line); background: var(--card); color: var(--ink); padding: 11px 12px;
  border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; transition: all .12s; font-family: inherit; font-size:14px;
}
.match-item:hover { border-color: var(--brand); }
.match-item.selected { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 14%, var(--card)); }
.match-item.matched { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--card)); opacity: .7; pointer-events: none; }
.match-item.shake { animation: shake .35s; }

.feedback { margin-top: 12px; padding: 11px 14px; border-radius: var(--radius-sm); font-weight: 600; display: none; }
.feedback.show { display: block; animation: pop .25s; }
.feedback.ok { background: color-mix(in srgb, var(--good) 16%, var(--card)); color: var(--good); border: 1px solid var(--good); }
.feedback.no { background: color-mix(in srgb, var(--bad) 14%, var(--card)); color: var(--bad); border: 1px solid var(--bad); }
.feedback .sol { color: var(--ink); font-weight: 700; }

.ex-actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }

/* lesson completion */
.complete-banner {
  text-align: center; padding: 26px; background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; border-radius: var(--radius); margin-top: 16px;
}
.complete-banner h2 { font-size: 26px; }

/* ===== Vocabulary / Flashcards ===== */
.vocab-themes { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.vocab-theme-card { cursor: pointer; border-left: 6px solid var(--accent); }
.vocab-theme-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }

.flashcard-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.flashcard {
  width: min(440px, 92vw); height: 250px; perspective: 1200px; cursor: pointer;
}
.flashcard-inner {
  position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d;
}
.flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
.flashcard-face {
  position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--radius);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  padding: 20px; text-align: center; box-shadow: var(--shadow-lg);
}
.flashcard-front { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; }
.flashcard-back { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; transform: rotateY(180deg); }
.flashcard-word { font-size: 28px; font-weight: 800; }
.flashcard-ex { font-size: 15px; opacity: .92; font-style: italic; }
.flashcard-hint { font-size: 13px; opacity: .8; }
.flashcard-counter { font-weight: 700; color: var(--ink-soft); }
.flash-controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.vocab-list { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.vocab-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: var(--radius-sm); }
.vocab-row .de { font-weight: 700; }
.vocab-row .en { color: var(--ink-soft); font-size: 14px; }
.vocab-row .txt { flex: 1; }

/* ===== Crash course ===== */
.checklist { display: grid; gap: 10px; }
.check-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: var(--radius-sm); cursor: pointer; transition: all .12s; }
.check-item:hover { border-color: var(--brand); }
.check-item.done { background: color-mix(in srgb, var(--good) 10%, var(--card)); border-color: var(--good); }
.check-box { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 900; color: #fff; transition: all .15s; }
.check-item.done .check-box { background: var(--good); border-color: var(--good); }
.check-main { flex: 1; }
.check-main .ttl { font-weight: 700; }
.check-main .meta { font-size: 13px; color: var(--ink-soft); }
.check-time { font-size: 12px; font-weight: 800; color: var(--brand); background: color-mix(in srgb, var(--brand) 12%, transparent); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }

/* ===== Plan ===== */
.day-card { border-left: 6px solid var(--brand); }
.day-card.weekend { border-left-color: var(--warn); }
.day-card .day-no { font-weight: 800; color: var(--brand); font-size: 13px; letter-spacing: 1px; }
.day-card h3 { margin: 4px 0; }
.day-card ul { margin: 6px 0 0; padding-left: 20px; }
.day-card li { margin: 2px 0; }

/* progress ring */
.ring-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.ring { --p: 0; width: 110px; height: 110px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); flex: 0 0 auto; }
.ring::before { content: ""; position: absolute; width: 84px; height: 84px; border-radius: 50%; background: var(--card); }
.ring span { position: relative; font-weight: 800; font-size: 22px; }

/* ===== Timer panel ===== */
.timer-panel {
  position: fixed; right: 18px; bottom: 18px; z-index: 200; width: min(320px, 92vw);
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); padding: 16px;
}
.timer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.timer-clock { font-size: 52px; font-weight: 900; text-align: center; letter-spacing: 2px; font-variant-numeric: tabular-nums; color: var(--brand); }
.timer-clock.break { color: var(--accent); }
.timer-mode { text-align: center; font-weight: 700; color: var(--ink-soft); margin-bottom: 12px; }
.timer-controls { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
.timer-controls .btn { padding: 9px 16px; }
.timer-presets { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.timer-tip { font-size: 12px; color: var(--ink-soft); margin: 12px 0 0; text-align: center; }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 999px;
  font-weight: 700; z-index: 300; box-shadow: var(--shadow-lg); opacity: 0; transition: all .3s;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.hidden { display: none !important; }

/* utility */
.center { text-align: center; }
.muted { color: var(--ink-soft); }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--brand); }
.stack > * + * { margin-top: 14px; }
.spacer { height: 8px; }

/* animations */
@keyframes pop { 0% { transform: scale(.96); } 60% { transform: scale(1.02); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }
@keyframes floaty { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-6px);} }
.floaty { animation: floaty 3s ease-in-out infinite; }

@media (max-width: 560px) {
  .brand-text small { display: none; }
  .stat { font-size: 12px; padding: 4px 8px; }
  .match-grid { grid-template-columns: 1fr 1fr; }
  .timer-clock { font-size: 44px; }
}

<body>
  <!-- Confetti canvas -->
  <canvas id="confetti" aria-hidden="true"></canvas>

  <!-- ===== HEADER ===== -->
  <header class="topbar">
    <div class="brand" id="homeLink" role="button" tabindex="0" title="Zur Startseite">
      <span class="logo">🇩🇪</span>
      <span class="brand-text">Deutsch&nbsp;A2 <small>Bootcamp</small></span>
    </div>

    <div class="stats">
      <div class="stat" title="Erfahrungspunkte"><span class="stat-ico">⚡</span><span id="xpVal">0</span> XP</div>
      <div class="stat" title="Level"><span class="stat-ico">🏅</span> Lvl <span id="lvlVal">1</span></div>
      <div class="stat" title="Tagesstreak"><span class="stat-ico">🔥</span><span id="streakVal">0</span></div>
    </div>

    <div class="top-actions">
      <button id="timerBtn" class="icon-btn" title="Fokus-Timer (Pomodoro)">🍅 <span id="timerMini">25:00</span></button>
      <button id="calmBtn" class="icon-btn" title="Ruhe-Modus (weniger Animationen)">🧘</button>
      <button id="themeBtn" class="icon-btn" title="Hell/Dunkel umschalten">🌙</button>
    </div>
  </header>

  <!-- XP progress to next level -->
  <div class="levelbar"><div class="levelbar-fill" id="levelFill"></div></div>

  <!-- ===== NAV TABS ===== -->
  <nav class="tabs" id="tabs">
    <button data-view="home" class="tab active">🏠 Start</button>
    <button data-view="crash" class="tab">⚡ Schnellkurs</button>
    <button data-view="modules" class="tab">📚 Module</button>
    <button data-view="grammar" class="tab">📝 Grammatik</button>

  <script>
/* ============================================================
   Deutsch A2 Bootcamp — App-Logik
   Vanilla JS, kein Build nötig. Läuft direkt im Browser.
   ============================================================ */

'use strict';

/* ---------- kleine Helfer ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
function el(tag, props = {}, kids = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (k === 'data') for (const [dk, dv] of Object.entries(v)) n.dataset[dk] = dv;
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  (Array.isArray(kids) ? kids : [kids]).forEach(c => {
    if (c == null) return;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return n;
}
const shuffle = arr => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
const norm = s => s.trim().toLowerCase().replace(/\s+/g, ' ');
const todayStr = () => new Date().toISOString().slice(0, 10);

/* ---------- State (localStorage) ---------- */
const SKEY = 'deutschA2_state_v1';
const defaultState = {
  xp: 0,
  streak: 0,
  lastActive: null,
  solved: {},      // ctxKey -> [exIndex] (richtig gelöst, für XP)
  resolved: {},    // ctxKey -> [exIndex] (gelöst ODER Lösung gezeigt)
  doneLessons: [], // lessonIds
  crashDone: [],   // crash step indices
  vocabKnown: {},  // theme -> count
  theme: 'light',
  calm: false,
};
// strukturiertes Klonen mit Fallback (alte Browser / JSON-sichere Daten)
const clone = (o) => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));

// Sicherer Speicher: fällt auf In-Memory zurück, wenn localStorage blockiert ist
// (z.B. file://, privater Modus). So bricht die App NIE wegen Storage.
const mem = {};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return k in mem ? mem[k] : null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { mem[k] = v; } },
};

let state = load();

function load() {
  try {
    const s = JSON.parse(store.get(SKEY));
    return s ? { ...clone(defaultState), ...s } : clone(defaultState);
  } catch { return clone(defaultState); }
}
function save() { store.set(SKEY, JSON.stringify(state)); }

/* streak: bei erster Aktivität an einem neuen Tag */
function touchStreak() {
  const t = todayStr();
  if (state.lastActive === t) return;
  if (state.lastActive) {
    const diff = Math.round((new Date(t) - new Date(state.lastActive)) / 86400000);
    state.streak = diff === 1 ? state.streak + 1 : 1;
  } else state.streak = 1;
  state.lastActive = t;
  save(); renderStats();
}

/* ---------- XP / Level ---------- */
const XP_PER_LEVEL = 100;
function level() { return Math.floor(state.xp / XP_PER_LEVEL) + 1; }
function addXP(n, silent) {
  const before = level();
  state.xp += n; save(); renderStats();
  if (!silent) toast(`+${n} XP ⚡`);
  if (level() > before) { toast(`🏅 Level ${level()}! Weiter so!`); confettiBurst(); }
}
function renderStats() {
  $('#xpVal').textContent = state.xp;
  $('#lvlVal').textContent = level();
  $('#streakVal').textContent = state.streak;
  $('#levelFill').style.width = (state.xp % XP_PER_LEVEL) + '%';
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.remove('hidden'); t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.classList.add('hidden'), 300); }, 1800);
}

/* ---------- Text-to-Speech (Deutsch) ---------- */
let deVoice = null;
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  deVoice = voices.find(v => /de(-|_)/i.test(v.lang)) || voices.find(v => /german|deutsch/i.test(v.name)) || null;
}
if ('speechSynthesis' in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text) {
  if (!('speechSynthesis' in window)) { toast('🔇 Sprachausgabe nicht verfügbar'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE'; u.rate = 0.92;
  if (deVoice) u.voice = deVoice;
  speechSynthesis.speak(u);
}
function speakBtn(text) {
  return el('button', { class: 'speak', title: 'Vorlesen', 'aria-label': 'Vorlesen', onclick: (e) => { e.stopPropagation(); speak(text); } }, '🔊');
}

/* ---------- Confetti ---------- */
const cvs = $('#confetti'); const ctx2d = cvs.getContext('2d');
let parts = [], confAnim = null;
function sizeCanvas() { cvs.width = innerWidth; cvs.height = innerHeight; }
addEventListener('resize', sizeCanvas); sizeCanvas();
function confettiBurst(n = 90) {
  if (state.calm) return;
  const colors = ['#6c5ce7', '#00b894', '#00cec9', '#fdcb6e', '#ff6b6b', '#8e7bff'];
  for (let i = 0; i < n; i++) {
    parts.push({
      x: innerWidth / 2, y: innerHeight / 3,
      vx: (Math.random() - 0.5) * 12, vy: Math.random() * -12 - 4,
      g: 0.3 + Math.random() * 0.2, s: 5 + Math.random() * 7,
      c: colors[(Math.random() * colors.length) | 0], rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3, life: 90,
    });
  }
  if (!confAnim) confAnim = requestAnimationFrame(stepConfetti);
}
function stepConfetti() {
  ctx2d.clearRect(0, 0, cvs.width, cvs.height);
  parts.forEach(p => {
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    ctx2d.save(); ctx2d.translate(p.x, p.y); ctx2d.rotate(p.rot);
    ctx2d.fillStyle = p.c; ctx2d.fillRect(-p.s / 2, -p.s / 2, p.s, p.s); ctx2d.restore();
  });
  parts = parts.filter(p => p.life > 0 && p.y < cvs.height + 30);
  if (parts.length) confAnim = requestAnimationFrame(stepConfetti);
  else { confAnim = null; ctx2d.clearRect(0, 0, cvs.width, cvs.height); }
}

/* ============================================================
   ÜBUNGS-ENGINE
   ============================================================ */
function ctxKey(ctx) { return ctx; }
function isSolved(ctx, i) { return (state.solved[ctx] || []).includes(i); }
function isResolved(ctx, i) { return (state.resolved[ctx] || []).includes(i); }
function markSolved(ctx, i, xp) {
  if (!isSolved(ctx, i)) {
    (state.solved[ctx] ||= []).push(i);
    addXP(xp);
  }
  markResolved(ctx, i);
}
function markResolved(ctx, i) {
  if (!isResolved(ctx, i)) { (state.resolved[ctx] ||= []).push(i); save(); }
  maybeCompleteLesson(ctx);
}
function maybeCompleteLesson(ctx) {
  const L = COURSE.lessons[ctx];
  if (!L) return;
  const total = L.exercises.length;
  if ((state.resolved[ctx] || []).length >= total && !state.doneLessons.includes(ctx)) {
    state.doneLessons.push(ctx); addXP(50, true); save();
    confettiBurst(120);
    const banner = $('#completeBanner');
    if (banner) banner.classList.remove('hidden');
    toast('🎉 Lektion geschafft! +50 XP');
  }
}

/* Baut EIN Übungselement */
function buildExercise(ex, idx, ctx, xpVal) {
  const wrap = el('div', { class: 'exercise' });
  wrap.appendChild(el('div', { class: 'ex-num', text: `ÜBUNG ${idx + 1}` }));

  const fb = el('div', { class: 'feedback' });
  const showFb = (ok, sol) => {
    fb.className = 'feedback show ' + (ok ? 'ok' : 'no');
    fb.innerHTML = ok ? '✅ Richtig! ' : '❌ Nicht ganz. ';
    if (ex.ex) fb.innerHTML += `<span class="sol">${ex.ex}</span>`;
    if (!ok && sol) fb.innerHTML += `<br><span class="sol">Lösung: ${sol}</span>`;
  };

  /* ---- Multiple Choice ---- */
  if (ex.t === 'mc') {
    wrap.appendChild(el('div', { class: 'ex-q', html: ex.q }));
    const opts = el('div', { class: 'options' });
    const buttons = ex.options.map((o, i) => el('button', {
      class: 'option', type: 'button',
      onclick: () => {
        buttons.forEach(b => b.disabled = true);
        buttons[ex.answer].classList.add('correct');
        if (i === ex.answer) { markSolved(ctx, idx, xpVal); }
        else { buttons[i].classList.add('wrong'); markResolved(ctx, idx); }
        showFb(i === ex.answer);
      }
    }, o));
    buttons.forEach(b => opts.appendChild(b));
    wrap.appendChild(opts);
  }

  /* ---- Fill in the blank ---- */
  else if (ex.t === 'fill') {
    const parts = ex.q.split('___');
    const qEl = el('div', { class: 'ex-q' });
    const inputs = [];
    parts.forEach((p, i) => {
      qEl.appendChild(document.createTextNode(p));
      if (i < parts.length - 1) {
        const inp = el('input', { class: 'fill-input', type: 'text', autocomplete: 'off', spellcheck: 'false', placeholder: '…' });
        inputs.push(inp); qEl.appendChild(inp);
      }
    });
    wrap.appendChild(qEl);
    if (ex.hint) wrap.appendChild(el('div', { class: 'muted', html: '💡 ' + ex.hint, style: 'font-size:13px;margin-bottom:6px' }));
    const check = el('button', { class: 'btn primary', type: 'button' }, 'Prüfen');
    const reveal = el('button', { class: 'btn ghost', type: 'button' }, 'Lösung zeigen');
    const sol = ex.answers.map(a => a[0]).join(' / ');
    check.onclick = () => {
      let allOk = true;
      inputs.forEach((inp, i) => {
        const accepted = ex.answers[i].map(norm);
        const ok = accepted.includes(norm(inp.value));
        inp.classList.toggle('correct', ok); inp.classList.toggle('wrong', !ok);
        if (!ok) allOk = false;
      });
      if (allOk) { markSolved(ctx, idx, xpVal); inputs.forEach(i => i.disabled = true); }
      showFb(allOk, allOk ? null : sol);
    };
    reveal.onclick = () => {
      inputs.forEach((inp, i) => { inp.value = ex.answers[i][0]; inp.classList.add('correct'); inp.disabled = true; });
      markResolved(ctx, idx); showFb(false, sol);
      fb.className = 'feedback show ok'; fb.innerHTML = '👀 Lösung: <span class="sol">' + sol + '</span>' + (ex.ex ? '<br><span class="sol">' + ex.ex + '</span>' : '');
    };
    wrap.appendChild(el('div', { class: 'ex-actions' }, [check, reveal]));
  }

  /* ---- Word order (chips) ---- */
  else if (ex.t === 'order') {
    wrap.appendChild(el('div', { class: 'ex-q', html: '🧩 ' + ex.q }));
    const build = el('div', { class: 'chips-build', 'aria-label': 'Dein Satz' });
    const pool = el('div', { class: 'chips-pool' });
    const placeholder = el('span', { class: 'muted', text: 'Klick die Wörter in der richtigen Reihenfolge…' });
    build.appendChild(placeholder);
    const refresh = () => { placeholder.style.display = build.querySelectorAll('.chip').length ? 'none' : ''; };
    shuffle(ex.words.map((w, i) => ({ w, i }))).forEach(({ w }) => {
      const chip = el('button', { class: 'chip', type: 'button' }, w);
      chip.onclick = () => {
        if (chip.parentElement === pool) build.appendChild(chip);
        else pool.appendChild(chip);
        refresh();
      };
      pool.appendChild(chip);
    });
    const check = el('button', { class: 'btn primary', type: 'button' }, 'Prüfen');
    const reset = el('button', { class: 'btn ghost', type: 'button' }, 'Reset');
    check.onclick = () => {
      const built = [...build.querySelectorAll('.chip')].map(c => c.textContent).join(' ');
      const ok = norm(built) === norm(ex.answer);
      if (ok) { markSolved(ctx, idx, xpVal); build.querySelectorAll('.chip').forEach(c => c.disabled = true); }
      else markResolved(ctx, idx);
      showFb(ok, ok ? null : ex.answer);
    };
    reset.onclick = () => { [...build.querySelectorAll('.chip')].forEach(c => pool.appendChild(c)); refresh(); fb.className = 'feedback'; };
    wrap.appendChild(build); wrap.appendChild(pool);
    wrap.appendChild(el('div', { class: 'ex-actions' }, [check, reset]));
  }

  /* ---- Matching ---- */
  else if (ex.t === 'match') {
    wrap.appendChild(el('div', { class: 'ex-q', html: '🔗 ' + ex.q }));
    const grid = el('div', { class: 'match-grid' });
    const leftCol = el('div', { class: 'match-col' });
    const rightCol = el('div', { class: 'match-col' });
    let sel = null, matched = 0;
    const total = ex.pairs.length;
    ex.pairs.forEach((p, i) => {
      leftCol.appendChild(el('button', { class: 'match-item', type: 'button', data: { row: i, side: 'L' } }, p[0]));
    });
    shuffle(ex.pairs.map((p, i) => ({ p, i }))).forEach(({ p, i }) => {
      rightCol.appendChild(el('button', { class: 'match-item', type: 'button', data: { row: i, side: 'R' } }, p[1]));
    });
    const onClick = (e) => {
      const b = e.currentTarget;
      if (b.classList.contains('matched')) return;
      if (!sel) { sel = b; b.classList.add('selected'); return; }
      if (sel === b) { sel.classList.remove('selected'); sel = null; return; }
      if (sel.dataset.side === b.dataset.side) { sel.classList.remove('selected'); sel = b; b.classList.add('selected'); return; }
      // verschiedene Seiten -> prüfen
      if (sel.dataset.row === b.dataset.row) {
        sel.classList.remove('selected'); sel.classList.add('matched'); b.classList.add('matched');
        matched++; sel = null;
        if (matched === total) { markSolved(ctx, idx, xpVal); showFb(true); }
      } else {
        const a = sel; b.classList.add('shake'); a.classList.add('shake');
        setTimeout(() => { a.classList.remove('shake', 'selected'); b.classList.remove('shake'); }, 350);
        sel = null;
      }
    };
    [...leftCol.children, ...rightCol.children].forEach(b => b.addEventListener('click', onClick));
    grid.appendChild(leftCol); grid.appendChild(rightCol);
    wrap.appendChild(grid);
  }

  wrap.appendChild(fb);
  // bereits gelöst -> Hinweis
  if (isSolved(ctx, idx)) { fb.className = 'feedback show ok'; fb.innerHTML = '✅ Schon gelöst. Mach es ruhig nochmal zum Üben!'; }
  return wrap;
}

function startFlashcards(cards, theme) {
  app.innerHTML = '';
  let i = 0, known = 0;
  const total = cards.length;
  const wrap = el('div', { class: 'card flashcard-wrap' });
  wrap.appendChild(el('button', { class: 'pill', style: 'cursor:pointer;align-self:flex-start', onclick: () => setView('vocab') }, '‹ zurück zu Themen'));
  wrap.appendChild(el('h2', { text: theme, style: 'text-align:center' }));
  const counter = el('div', { class: 'flashcard-counter' });
  wrap.appendChild(counter);

  const card = el('div', { class: 'flashcard' });
  const inner = el('div', { class: 'flashcard-inner' });
  const front = el('div', { class: 'flashcard-face flashcard-front' });
  const back = el('div', { class: 'flashcard-face flashcard-back' });
  inner.appendChild(front); inner.appendChild(back); card.appendChild(inner);
  card.onclick = (e) => { if (e.target.closest('.speak')) return; card.classList.toggle('flipped'); };
  wrap.appendChild(card);

  const controls = el('div', { class: 'flash-controls' });
  const btnHear = el('button', { class: 'btn', onclick: (e) => { e.stopPropagation(); speak(cards[i].de); } }, '🔊 Hören');
  const btnAgain = el('button', { class: 'btn ghost', onclick: () => next(false) }, '🔁 Nochmal');
  const btnKnown = el('button', { class: 'btn accent', onclick: () => next(true) }, '✅ Gewusst');
  controls.append(btnHear, btnAgain, btnKnown);
  wrap.appendChild(controls);
  app.appendChild(wrap);

  function render() {
    counter.textContent = `Karte ${i + 1} / ${total}  ·  ✅ ${known}`;
    card.classList.remove('flipped');
    front.innerHTML = '';
    front.append(el('div', { class: 'flashcard-word', text: cards[i].de }), speakBtn(cards[i].de), el('div', { class: 'flashcard-hint', text: '(antippen zum Umdrehen)' }));
    back.innerHTML = '';
    back.append(el('div', { class: 'flashcard-word', text: cards[i].en }), el('div', { class: 'flashcard-ex', text: cards[i].ex || '' }));
  }
  function next(wasKnown) {
    if (wasKnown) known++;
    if (i < total - 1) { i++; render(); }
    else {
      addXP(Math.min(known * 2, 40));
      confettiBurst();
      app.innerHTML = '';
      app.appendChild(el('div', { class: 'card complete-banner' }, [
        el('h2', { text: '🃏 Durch!' }),
        el('p', { html: `Du hast <b>${known}/${total}</b> gewusst. ${known === total ? 'Perfekt! 🌟' : 'Wiederholung macht den Meister!'}` }),
        el('div', { class: 'btn-row', style: 'justify-content:center' }, [
          el('button', { class: 'btn', style: 'background:#fff;color:#00b894', onclick: () => startFlashcards(cards, theme) }, '🔁 Nochmal'),
          el('button', { class: 'btn ghost', style: 'color:#fff;border-color:#fff', onclick: () => setView('vocab') }, '🗂️ Themen'),
        ]),
      ]));
    }
  }
  render();
}

/* ============================================================

const timer = { total: 25 * 60, left: 25 * 60, running: false, id: null, mode: 'Fokus-Sprint', isBreak: false };
function fmt(s) { const m = (s / 60 | 0).toString().padStart(2, '0'); const ss = (s % 60).toString().padStart(2, '0'); return `${m}:${ss}`; }
function renderTimer() {
  $('#timerClock').textContent = fmt(timer.left);
  $('#timerMini').textContent = fmt(timer.left);
  $('#timerMode').textContent = timer.mode;
  $('#timerClock').classList.toggle('break', timer.isBreak);
}
function tick() {
  if (timer.left > 0) { timer.left--; renderTimer(); }
  else {
    clearInterval(timer.id); timer.running = false;
    beep(); confettiBurst();
    toast(timer.isBreak ? '⏰ Pause vorbei — weiter geht\'s!' : '🎉 Sprint geschafft! Mach 5 Min Pause.');
  }
}
function startTimer() { if (timer.running) return; timer.running = true; timer.id = setInterval(tick, 1000); }
function pauseTimer() { timer.running = false; clearInterval(timer.id); }
function resetTimer() { pauseTimer(); timer.left = timer.total; renderTimer(); }
function setTimerMin(min, isBreak) {
  pauseTimer(); timer.total = min * 60; timer.left = timer.total;
  timer.isBreak = !!isBreak; timer.mode = isBreak ? '☕ Pause' : `🍅 ${min}-Min-Sprint`;
  renderTimer();
}
function openTimer() { $('#timerPanel').classList.remove('hidden'); }
function beep() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(); const g = ac.createGain();
    o.connect(g); g.connect(ac.destination); o.type = 'sine'; o.frequency.value = 660;
    g.gain.setValueAtTime(0.001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.3, ac.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.6);
    o.start(); o.stop(ac.currentTime + 0.62);
  } catch { /* ignore */ }
}

/* ============================================================
   INIT / EVENTS
   ============================================================ */
function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  $('#themeBtn').textContent = state.theme === 'dark' ? '☀️' : '🌙';
  document.body.classList.toggle('calm', state.calm);
  $('#calmBtn').style.opacity = state.calm ? '1' : '.7';
}

function init() {
  renderStats(); applyTheme(); renderTimer();
  touchStreak();

  // Tabs
  $$('.tab').forEach(t => t.addEventListener('click', () => setView(t.dataset.view)));
  $('#homeLink').addEventListener('click', () => setView('home'));
  $('#homeLink').addEventListener('keydown', e => { if (e.key === 'Enter') setView('home'); });

  // Theme + calm
  $('#themeBtn').addEventListener('click', () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); });
  $('#calmBtn').addEventListener('click', () => { state.calm = !state.calm; save(); applyTheme(); toast(state.calm ? '🧘 Ruhe-Modus an' : '✨ Animationen an'); });

  // Timer panel
  $('#timerBtn').addEventListener('click', () => $('#timerPanel').classList.toggle('hidden'));
  $('#timerClose').addEventListener('click', () => $('#timerPanel').classList.add('hidden'));
  $('#timerStart').addEventListener('click', startTimer);
  $('#timerPause').addEventListener('click', pauseTimer);
  $('#timerReset').addEventListener('click', resetTimer);
  $$('.timer-presets .chip').forEach(c => c.addEventListener('click', () => setTimerMin(+c.dataset.min, +c.dataset.min === 5)));

  setView('home');
}

document.addEventListener('DOMContentLoaded', init);

</script>
