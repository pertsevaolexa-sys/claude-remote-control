<svg xmlns="http://www.w3.org/2000/svg" width="700mm" height="700mm" viewBox="0 0 700 700">
<title>Polygood Wall Tile groove layout: herringbone_45</title>
<desc>45-degree herringbone, bricks 61.9 x 123.7 mm, as in the catalogue's shower render. Units: mm. Lines are tool centrelines; stroke width is the cutter diameter (6.35 mm, 1/4 in single-flute end mill, max 4.0 mm per pass). Groove depth to be confirmed with Polygood. Grooves on the module edge continue into the next module.</desc>
