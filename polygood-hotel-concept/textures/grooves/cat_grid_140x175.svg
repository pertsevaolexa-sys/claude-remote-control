<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700mm" height="700mm" viewBox="0 0 700 700">
<title>Polygood Wall Tile groove layout: cat_grid_140x175</title>
<desc>Catalogue (Oyster sample): grid of 140 x 175 mm. Units: mm. Lines are tool centrelines; stroke width is the cutter diameter (6.35 mm, 1/4 in single-flute end mill, max 4.0 mm per pass). Groove depth to be confirmed with Polygood. Grooves on the module edge continue into the next module.</desc>
<defs><clipPath id="module"><rect x="0" y="0" width="700" height="700"/></clipPath></defs>
<rect id="module-outline" x="0" y="0" width="700" height="700" fill="none" stroke="#999999" stroke-width="0.5"/>
<g id="grooves" clip-path="url(#module)" fill="none" stroke="#000000" stroke-width="6.35" stroke-linecap="round" stroke-linejoin="round">
<polyline points="0.000,0.000 0.000,700.000"/>
<polyline points="140.000,0.000 140.000,700.000"/>
<polyline points="280.000,0.000 280.000,700.000"/>
<polyline points="420.000,0.000 420.000,700.000"/>
<polyline points="560.000,0.000 560.000,700.000"/>
<polyline points="700.000,0.000 700.000,700.000"/>
<polyline points="0.000,0.000 700.000,0.000"/>
<polyline points="0.000,175.000 700.000,175.000"/>
<polyline points="0.000,350.000 700.000,350.000"/>
<polyline points="0.000,525.000 700.000,525.000"/>
<polyline points="0.000,700.000 700.000,700.000"/>
</g>
</svg>
