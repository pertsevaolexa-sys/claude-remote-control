<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Event Layout 3D — 91m × 33m Factory</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden;user-select:none;color:#eee}
canvas{display:block;cursor:grab}
canvas.grab{cursor:grabbing}
body.fpv canvas{cursor:crosshair}
.panel{position:fixed;background:rgba(15,20,32,.85);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:13px 16px;font-size:12.5px;line-height:1.75;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#legend{top:14px;left:14px;max-width:200px}
#legend h3{color:#ffd700;font-size:13px;letter-spacing:.6px;margin-bottom:8px}
.dot{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:8px;vertical-align:middle}
#info{top:14px;right:14px;max-width:230px}
#info h3{color:#7dd3fc;font-size:13px;margin-bottom:6px}
#info hr{border:0;border-top:1px solid rgba(255,255,255,.1);margin:6px 0}
#hint{bottom:14px;left:50%;transform:translateX(-50%);font-size:11.5px;color:#bbb;padding:8px 18px}
#modes{bottom:14px;right:14px;padding:5px;display:flex;gap:4px}
#modes button{background:transparent;border:1px solid #555;color:#ccc;padding:8px 14px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s}
#modes button:hover{background:rgba(255,255,255,.08)}
#modes button.active{background:#ffd700;color:#000;border-color:#ffd700}
#zoneTag{bottom:60px;left:50%;transform:translateX(-50%);padding:6px 16px;font-size:12.5px;color:#ffd700;letter-spacing:.5px;display:none;border:1px solid rgba(255,215,0,.3)}
body.fpv #zoneTag{display:block}
#crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;pointer-events:none;display:none;mix-blend-mode:difference}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:#fff;opacity:.7}
#crosshair::before{left:50%;top:0;width:1px;height:100%;transform:translateX(-50%)}
#crosshair::after{left:0;top:50%;height:1px;width:100%;transform:translateY(-50%)}
body.fpv #crosshair{display:block}
#tps{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px}
#tps button{background:rgba(15,20,32,.85);border:1px solid #444;color:#aaa;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:11px}
#tps button:hover{background:rgba(255,255,255,.08);color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="legend" class="panel">
  <h3>EVENT ZONES</h3>
  <div><span class="dot" style="background:#e74c3c"></span>Entrance &amp; Check-in</div>
  <div><span class="dot" style="background:#e67e22"></span>Exhibition (4 booths)</div>
  <div><span class="dot" style="background:#2ecc71"></span>Networking</div>
  <div><span class="dot" style="background:#9b59b6"></span>Catering</div>
  <div><span class="dot" style="background:#3498db"></span>Audience Seating</div>
  <div><span class="dot" style="background:#f39c12"></span>Keynote Stage</div>
</div>

<div id="info" class="panel">
  <h3>VENUE</h3>
  Old factory · 91m × 33m<br>
  Capacity: 400 guests
  <hr>
  <b>Stage:</b> 16m wide, raised<br>
  <b>Seating:</b> theatre style<br>
  <b>Booths:</b> 4 × (8m × 5m)<br>
  <b>Catering:</b> back-corner stations<br>
</div>

<div id="hint" class="panel"></div>
<div id="zoneTag" class="panel"></div>
<div id="crosshair"></div>

<div id="tps" class="panel" style="padding:0;background:transparent;border:0;box-shadow:none">
  <button onclick="teleport('entrance')">📍 Entrance</button>
  <button onclick="teleport('booths')">📍 Booths</button>
  <button onclick="teleport('networking')">📍 Networking</button>
  <button onclick="teleport('seating')">📍 Audience</button>
  <button onclick="teleport('stage')">📍 Stage</button>
</div>

<div id="modes" class="panel">
  <button id="btn-iso" class="active" onclick="setMode('iso')">🗺 Overview</button>
  <button id="btn-fpv" onclick="setMode('fpv')">🚶 Walk Inside</button>
</div>

<script>
'use strict';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize(){ W=innerWidth; H=innerHeight; canvas.width=W; canvas.height=H; }
resize(); addEventListener('resize', resize);

// === CAMERA ===
const cam = {
  mode: 'iso',
  iso: { yaw: 0.55, pitch: 0.55, zoom: 7.5, panX: 0, panY: 30 },
  fpv: { x: 38, y: 1.7, z: 0, yaw: Math.PI/2, pitch: -0.05 }
};

const hint = document.getElementById('hint');
function setMode(m) {
  cam.mode = m;
  document.getElementById('btn-iso').classList.toggle('active', m==='iso');
  document.getElementById('btn-fpv').classList.toggle('active', m==='fpv');
  document.body.classList.toggle('fpv', m==='fpv');
  hint.textContent = m==='iso'
    ? 'Drag = pan  ·  Shift+drag = rotate  ·  Scroll = zoom'
    : 'WASD = walk  ·  Mouse drag = look  ·  Shift = run  ·  Q/E = up/down';
}
setMode('iso');

const teleports = {
  entrance:   { x: 41, y: 1.7, z: 0,  yaw: Math.PI/2, pitch: -0.05 },
  booths:     { x: 23, y: 1.7, z: 0,  yaw: 0,         pitch: 0 },
  networking: { x: 5,  y: 1.7, z: 0,  yaw: Math.PI/2, pitch: 0 },
  seating:    { x: -10,y: 1.7, z: 0,  yaw: Math.PI/2, pitch: -0.1 },
  stage:      { x: -22,y: 1.7, z: 0,  yaw: Math.PI/2, pitch: 0.05 }
};
function teleport(name) {
  const t = teleports[name]; if (!t) return;
  Object.assign(cam.fpv, t);
  if (cam.mode !== 'fpv') setMode('fpv');
}

// === PROJECTION ===
function project(x, y, z) {
  if (cam.mode === 'iso') {
    const c = cam.iso;
    const cy = Math.cos(c.yaw), sy = Math.sin(c.yaw);
    const rx = cy*x + sy*z, rz = -sy*x + cy*z;
    const cp = Math.cos(c.pitch), sp = Math.sin(c.pitch);
    const py = cp*y - sp*rz, pz = sp*y + cp*rz;
    return { x: W/2 + rx*c.zoom + c.panX, y: H/2 - py*c.zoom + c.panY, d: -pz, ok: true };
  } else {
    const c = cam.fpv;
    const dx=x-c.x, dy=y-c.y, dz=z-c.z;
    const cy=Math.cos(c.yaw), sy=Math.sin(c.yaw);
    const rx = cy*dx - sy*dz, rz = sy*dx + cy*dz, ry = dy;
    const cp=Math.cos(c.pitch), sp=Math.sin(c.pitch);
    const py = cp*ry + sp*rz, pz = -sp*ry + cp*rz;
    const depth = -pz;
    if (depth < 0.15) return { ok: false };
    const f = W * 0.65;
    return { x: W/2 + (rx/depth)*f, y: H/2 - (py/depth)*f, d: depth, ok: true };
  }
}

// === LIGHTING ===
const LIGHT = (() => {
  const v = [0.35, 1.0, 0.45];
  const len = Math.hypot(...v);
  return [v[0]/len, v[1]/len, v[2]/len];
})();
function shade(hex, factor) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const f = Math.max(0, Math.min(1.6, factor));
  return `rgb(${Math.min(255,Math.round(r*f))},${Math.min(255,Math.round(g*f))},${Math.min(255,Math.round(b*f))})`;
}
function lit(color, n) {
  const dot = n[0]*LIGHT[0] + n[1]*LIGHT[1] + n[2]*LIGHT[2];
  return shade(color, 0.5 + 0.6 * Math.max(0, dot));
}

// === RENDER QUEUE ===
let queue = [];
function addPoly(pts3D, color, opts) {
  opts = opts || {};
  const proj = new Array(pts3D.length);
  let sumD = 0;
  for (let i=0; i<pts3D.length; i++) {
    const p = project(pts3D[i][0], pts3D[i][1], pts3D[i][2]);
    if (!p.ok) return;
    proj[i] = p; sumD += p.d;
  }
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for (const p of proj) {
    if (p.x<minX) minX=p.x; if (p.x>maxX) maxX=p.x;
    if (p.y<minY) minY=p.y; if (p.y>maxY) maxY=p.y;
  }
  if (maxX < -100 || minX > W+100 || maxY < -100 || minY > H+100) return;
  queue.push({ proj, color, depth: sumD/pts3D.length, opts });
}
function flush() {
  queue.sort((a,b) => b.depth - a.depth);
  for (const q of queue) {
    ctx.beginPath();
    ctx.moveTo(q.proj[0].x, q.proj[0].y);
    for (let i=1; i<q.proj.length; i++) ctx.lineTo(q.proj[i].x, q.proj[i].y);
    ctx.closePath();
    ctx.fillStyle = q.color;
    ctx.fill();
    if (q.opts.stroke !== false) {
      ctx.strokeStyle = q.opts.strokeColor || 'rgba(0,0,0,0.18)';
      ctx.lineWidth = q.opts.strokeWidth || 0.6;
      ctx.stroke();
    }
  }
  queue = [];
}

// === PRIMITIVES ===
function box(x, y, z, w, h, d, color, opts) {
  const x2=x+w, y2=y+h, z2=z+d;
  const F = [
    { p:[[x,y2,z],[x2,y2,z],[x2,y2,z2],[x,y2,z2]], n:[0,1,0] },
    { p:[[x,y,z2],[x2,y,z2],[x2,y,z],[x,y,z]],     n:[0,-1,0] },
    { p:[[x,y,z],[x2,y,z],[x2,y2,z],[x,y2,z]],     n:[0,0,-1] },
    { p:[[x2,y,z2],[x,y,z2],[x,y2,z2],[x2,y2,z2]], n:[0,0,1] },
    { p:[[x,y,z2],[x,y,z],[x,y2,z],[x,y2,z2]],     n:[-1,0,0] },
    { p:[[x2,y,z],[x2,y,z2],[x2,y2,z2],[x2,y2,z]], n:[1,0,0] }
  ];
  for (const f of F) addPoly(f.p, lit(color, f.n), opts);
}

function cylinder(cx, y, cz, r, h, color, segs) {
  segs = segs || 10;
  const base = [];
  for (let i=0; i<segs; i++) {
    const a = (i/segs) * Math.PI*2;
    base.push([cx + Math.cos(a)*r, cz + Math.sin(a)*r]);
  }
  const top = base.map(p => [p[0], y+h, p[1]]);
  addPoly(top, lit(color, [0,1,0]));
  for (let i=0; i<segs; i++) {
    const j = (i+1) % segs;
    const nx = (base[i][0]+base[j][0])/2 - cx;
    const nz = (base[i][1]+base[j][1])/2 - cz;
    const nl = Math.hypot(nx, nz) || 1;
    addPoly(
      [
        [base[i][0], y, base[i][1]],
        [base[j][0], y, base[j][1]],
        [base[j][0], y+h, base[j][1]],
        [base[i][0], y+h, base[i][1]]
      ],
      lit(color, [nx/nl, 0, nz/nl])
    );
  }
}

function quad(p1, p2, p3, p4, color, normal) {
  const c = normal ? lit(color, normal) : color;
  addPoly([p1,p2,p3,p4], c);
}

// === COMPOSITES ===
function person(x, z, shirt) {
  shirt = shirt || ['#3b6fb5','#a14b4b','#c69b3a','#5b8a47','#7e57c2','#37474f'][Math.floor(Math.random()*6)];
  cylinder(x, 0,    z, 0.20, 0.95, '#2a2f3a', 6);
  cylinder(x, 0.95, z, 0.27, 0.45, shirt,     6);
  cylinder(x, 1.40, z, 0.13, 0.24, '#dcb593', 6);
}
function chair(x, z, dir, color) {
  color = color || '#1f2d3d';
  box(x-0.25, 0.42, z-0.25, 0.5, 0.06, 0.5, color);
  box(x-0.24, 0,    z-0.24, 0.04, 0.42, 0.04, '#0e1620');
  box(x+0.20, 0,    z-0.24, 0.04, 0.42, 0.04, '#0e1620');
  box(x-0.24, 0,    z+0.20, 0.04, 0.42, 0.04, '#0e1620');
  box(x+0.20, 0,    z+0.20, 0.04, 0.42, 0.04, '#0e1620');
  if (dir === 'south') box(x-0.25, 0.48, z+0.21, 0.5, 0.55, 0.05, color);
  else                 box(x-0.25, 0.48, z-0.26, 0.5, 0.55, 0.05, color);
}
function bistroTable(x, z) {
  cylinder(x, 0,    z, 0.40, 0.04, '#1a1a1a', 12);
  cylinder(x, 0.04, z, 0.05, 1.02, '#2a2a2a', 8);
  cylinder(x, 1.02, z, 0.55, 0.06, '#f4f1ea', 16);
  cylinder(x, 1.08, z, 0.55, 0.02, '#cfc8ba', 16);
}
function barStool(x, z) {
  cylinder(x, 0,    z, 0.04, 0.7, '#444', 6);
  cylinder(x, 0.7,  z, 0.18, 0.05, '#222', 8);
}
function plant(x, z, s) {
  s = s || 1;
  cylinder(x, 0,        z, 0.28*s, 0.4*s, '#5d3a1c', 8);
  cylinder(x, 0.4*s,    z, 0.42*s, 0.45*s, '#2e6b3a', 8);
  cylinder(x, 0.85*s,   z, 0.34*s, 0.35*s, '#3d8a4a', 8);
  cylinder(x, 1.15*s,   z, 0.22*s, 0.28*s, '#4ea15c', 8);
}
function spotlight(x, y, z) {
  cylinder(x, y-0.05, z, 0.04, 0.4, '#222', 6);  // hanger
  cylinder(x, y-0.45, z, 0.18, 0.35, '#111', 8); // housing
  cylinder(x, y-0.5,  z, 0.16, 0.05, '#ffec88', 8); // lens (glowing)
}

// === SCENE: BUILDING ===
const BX = -45.5, BZ = -16.5, BL = 91, BW = 33, WH = 9;

function drawFloor() {
  // Wood-toned base
  quad(
    [BX, 0, BZ], [BX+BL, 0, BZ], [BX+BL, 0, BZ+BW], [BX, 0, BZ+BW],
    '#bca684', [0,1,0]
  );
  // Plank lines (subtle)
  for (let i = 1; i < 30; i++) {
    const z = BZ + (i / 30) * BW;
    addPoly(
      [[BX, 0.005, z-0.02],[BX+BL, 0.005, z-0.02],[BX+BL, 0.005, z+0.02],[BX, 0.005, z+0.02]],
      'rgba(80,55,30,0.25)', { stroke: false }
    );
  }
}

function drawZoneTints() {
  const tints = [
    [36.5, BZ,   9, BW,  '#e74c3c', .14],
    [16.5, BZ,  20, BW,  '#e67e22', .10],
    [-3.5, BZ,  20, BW,  '#2ecc71', .10],
    [-3.5,  4.5,10,  8,  '#9b59b6', .22],
    [-3.5, -12.5,10, 8,  '#9b59b6', .22],
    [-23.5, BZ, 15, BW,  '#3498db', .12],
    [-39.5, BZ, 16, BW,  '#f39c12', .14],
    [BX,    BZ,  6, BW,  '#1abc9c', .12]
  ];
  for (const [x, z, w, d, c, a] of tints) {
    const r=parseInt(c.slice(1,3),16), g=parseInt(c.slice(3,5),16), b=parseInt(c.slice(5,7),16);
    addPoly(
      [[x, 0.01, z],[x+w, 0.01, z],[x+w, 0.01, z+d],[x, 0.01, z+d]],
      `rgba(${r},${g},${b},${a})`,
      { stroke: false }
    );
  }
}

function drawWalls() {
  const wc = '#a89682';
  // Long walls
  box(BX,    0, BZ,        BL,  WH, 0.5, wc);
  box(BX,    0, BZ+BW-0.5, BL,  WH, 0.5, wc);
  // Short wall (stage end / west)
  box(BX,    0, BZ,        0.5, WH, BW, wc);
  // East end (entrance) — split with door gap
  box(45,    0, BZ,        0.5, WH, 13.5, wc);
  box(45,    0, 3.5,       0.5, WH, 13, wc);
  box(45,    6.5, -3.5,    0.5, 2.5, 7, wc); // lintel above door
  // Industrial steel beams along the ceiling
  for (let bx = BX+5; bx < BX+BL; bx += 8) {
    box(bx-0.15, WH-0.6, BZ+0.6, 0.3, 0.4, BW-1.2, '#3a3f48');
  }
  // Long beam down the spine
  box(BX, WH-0.3, -0.15, BL, 0.3, 0.3, '#3a3f48');
}

function drawCeilingLights() {
  for (let bx = BX+8; bx < BX+BL; bx += 7) {
    for (const cz of [-10, 0, 10]) {
      spotlight(bx, WH-0.2, cz);
    }
  }
}

// === ZONE: ENTRANCE ===
function drawEntrance() {
  // Reception desk (long counter)
  box(38, 0, -2.5, 5, 1.05, 1.4, '#7a3b35');
  box(38, 1.05, -2.5, 5, 0.06, 1.4, '#3a1f1c');
  // Monitor on desk
  box(40, 1.11, -2.0, 0.6, 0.5, 0.06, '#111');
  // Welcome sign above desk
  box(37, 4, -3, 7, 1.2, 0.15, '#2a3445');
  box(37.05, 4.05, -3.07, 6.9, 1.1, 0.05, '#fff');
  // Coat rack
  cylinder(38, 0, 5, 0.05, 2.0, '#2a2a2a', 6);
  for (let i=0; i<6; i++) {
    const cy = 5 + (i-2.5)*0.4;
    box(37.7, 1.2 + (i%2)*0.1, cy-0.15, 0.6, 0.55, 0.3, ['#7a3b35','#2a3445','#5a4a3a','#3a5a4a'][i%4]);
  }
  // People at desk
  person(39.0, -3.6, '#a14b4b');
  person(40.5, -3.6, '#3b6fb5');
  person(41.2, -1.0);
  person(40.2, 1.5);
  // Plants flanking entrance
  plant(43, -7);
  plant(43, 7);
  // Door frame (open glass doors)
  box(45, 0, -3.5, 0.1, 6.5, 0.05, '#666');
  box(45, 0, 3.5, 0.1, 6.5, 0.05, '#666');
  box(45, 0, -3.5, 0.05, 6.5, 3.5, 'rgba(160,200,230,0.35)', { stroke:false });
  box(45, 0, 0,    0.05, 6.5, 3.5, 'rgba(160,200,230,0.35)', { stroke:false });
}

// === ZONE: BOOTHS ===
function drawBooths() {
  const boothPos = [
    { x: 18, z: -13, n: 1, color: '#3498db' },
    { x: 27, z: -13, n: 2, color: '#e74c3c' },
    { x: 18, z:  8,  n: 3, color: '#2ecc71' },
    { x: 27, z:  8,  n: 4, color: '#f39c12' }
  ];
  for (const b of boothPos) {
    const inside = b.z < 0 ? 1 : -1;
    // Carpet
    addPoly(
      [[b.x, 0.01, b.z],[b.x+8, 0.01, b.z],[b.x+8, 0.01, b.z+5],[b.x, 0.01, b.z+5]],
      'rgba(60,60,80,0.35)', { stroke: false }
    );
    // Back wall
    if (b.z < 0) box(b.x, 0, b.z-0.1, 8, 3, 0.15, '#e8e2d6');
    else         box(b.x, 0, b.z+5,   8, 3, 0.15, '#e8e2d6');
    // Side walls
    box(b.x,     0, b.z, 0.15, 3, 5, '#e8e2d6');
    box(b.x+7.85, 0, b.z, 0.15, 3, 5, '#e8e2d6');
    // Banner with logo
    const bannerZ = b.z < 0 ? b.z - 0.05 : b.z + 5.05;
    box(b.x+0.5, 1.8, bannerZ, 7, 1.0, 0.05, b.color);
    box(b.x+1.0, 2.0, bannerZ - 0.06*inside, 1.0, 0.6, 0.02, '#fff');
    // Counter / display table
    const cz = b.z < 0 ? b.z + 1.0 : b.z + 3.0;
    box(b.x+1.5, 0, cz, 5, 1.0, 0.7, '#5a4a3a');
    box(b.x+1.5, 1.0, cz, 5, 0.05, 0.7, '#3a2e22');
    // Product samples on counter
    for (let k=0; k<4; k++) {
      box(b.x+2.0 + k*1.0, 1.05, cz+0.2, 0.4, 0.3, 0.4, b.color);
    }
    // Spotlight overhead
    spotlight(b.x+4, 3.2, b.z+2.5);
    // Staff
    person(b.x+1.5, b.z + (b.z<0?0.5:4.5), b.color);
    person(b.x+6.5, b.z + (b.z<0?3.5:1.5));
    // Visitors (on wide aisle side)
    person(b.x+4, b.z + (b.z<0?5.5:-0.5));
  }
  // Wide central aisle visitors
  for (const z of [-4, -2, 0, 2, 4]) {
    if (Math.random() > 0.4) person(20 + Math.random()*8, z + (Math.random()-0.5));
  }
}

// === ZONE: NETWORKING ===
function drawNetworking() {
  const tables = [
    [-1, -10],[-1, -4],[-1, 4],[-1, 10],
    [6, -7],[6, 0],[6, 7],
    [-8, -12],[-8, 0],[-8, 12]
  ];
  for (const [x,z] of tables) {
    bistroTable(x, z);
    // 3 stools around each
    barStool(x+0.85, z);
    barStool(x-0.5,  z+0.7);
    barStool(x-0.5,  z-0.7);
  }
  // Coffee station
  box(13, 0, -15.5, 4, 1.0, 1.0, '#3a2e22');
  box(13, 1.0, -15.5, 4, 0.05, 1.0, '#1f1812');
  cylinder(13.5, 1.05, -15, 0.18, 0.5, '#bbb', 8);
  cylinder(14.5, 1.05, -15, 0.18, 0.5, '#bbb', 8);
  cylinder(15.5, 1.05, -15, 0.18, 0.5, '#bbb', 8);
  cylinder(16.5, 1.05, -15, 0.16, 0.4, '#8B4513', 8);
  // String lights overhead
  for (let lx = -10; lx <= 16; lx += 1.2) {
    cylinder(lx, 5.5 + Math.sin(lx*0.5)*0.3, -8, 0.05, 0.15, '#ffe066', 4);
    cylinder(lx, 5.5 + Math.sin(lx*0.5)*0.3,  8, 0.05, 0.15, '#ffe066', 4);
  }
  // People mingling
  const minglers = [
    [0, -10.5],[ -1.7, -9.3],[1.2, -8.7],
    [-2, -3.5],[0.5, -4.5],[-0.5, 4.7],[0.7, 4.0],
    [5, 0.7],[7.5, -0.3],[6.2, 7.5],
    [-9, 0.3],[-7, 12.5],[-7.5, -12],[-9, -11],
    [12, -3],[14, 3],[3, -13],[3, 13]
  ];
  for (const [x,z] of minglers) person(x, z);
  // Plants
  plant(15, -15.5, 0.9);
  plant(15, 15.5, 0.9);
  plant(-12, -15.5, 0.9);
  plant(-12, 15.5, 0.9);
}

// === ZONE: CATERING ===
function drawCatering() {
  // Two stations on opposite sides (back corners)
  for (const sign of [1, -1]) {
    const z0 = sign > 0 ? 11 : -16;
    // Long buffet counter
    box(-8, 0, z0, 9, 1.05, 1.2, '#6a3d2a');
    box(-8, 1.05, z0, 9, 0.06, 1.2, '#3a1f12');
    // Food trays
    for (let k=0; k<5; k++) {
      box(-7.5 + k*1.7, 1.11, z0+0.15, 1.2, 0.06, 0.5, '#d4d4d4');
      box(-7.4 + k*1.7, 1.17, z0+0.20, 1.0, 0.1, 0.4, ['#c0392b','#27ae60','#f39c12','#9b59b6','#e67e22'][k]);
    }
    // Drink dispensers / glassware
    cylinder(-12, 1.05, z0+0.6, 0.18, 0.5, '#9b59b6', 8);
    cylinder(-11.4, 1.05, z0+0.6, 0.16, 0.45, '#e74c3c', 8);
    cylinder(-10.8, 1.05, z0+0.6, 0.14, 0.4, '#fff', 8);
    // Plate stack
    cylinder(0.5, 1.05, z0+0.5, 0.15, 0.3, '#fff', 8);
    // Server
    person(-7, z0 + (sign>0?1.6:-0.6), '#fff');
    // Guests
    person(-3, z0 + (sign>0?2.0:-0.8));
    person(-4.5, z0 + (sign>0?2.2:-1.0));
    person(-9, z0 + (sign>0?2.0:-0.8));
    // Sign above
    box(-9, 4.0, z0 + (sign>0?-0.5:1.7), 7, 0.8, 0.1, '#9b59b6');
  }
}

// === ZONE: SEATING ===
function drawSeating() {
  // Two banks with center aisle (16 rows × 11 cols × 2 = 352 seats ≈ 400 capacity)
  const rowStartX = -13;
  const rowStep = 0.95;
  const colStep = 0.75;
  const aisleWidth = 1.8;
  const occRate = 0.55;
  for (let row = 0; row < 16; row++) {
    const cx = rowStartX - row * rowStep;
    for (let col = 0; col < 22; col++) {
      let cz;
      if (col < 11) cz = -7 - aisleWidth/2 - (10-col)*colStep;
      else          cz =  aisleWidth/2 + (col-11)*colStep + 0.7;
      // Skip occasional chairs to vary visual density
      chair(cx, cz, 'south');
      if (Math.random() < occRate) person(cx, cz, ['#37474f','#5d4037','#455a64','#3e2723','#1976d2'][Math.floor(Math.random()*5)]);
    }
  }
  // Aisle markers (subtle)
}

// === ZONE: STAGE ===
function drawStage() {
  // Raised platform
  box(-44, 0,    -11, 16, 0.6,  22, '#8B6F47');
  // Stage skirt (front + back)
  box(-44, 0,    -11, 16, 0.05, 0.05, '#1a1a1a');
  box(-28.05, 0, -11, 0.05, 0.6, 22, '#1a1a1a');
  // Stage steps
  box(-29, 0,    -1, 1, 0.2, 2, '#7a5f3a');
  box(-30, 0.2,  -1, 1, 0.2, 2, '#7a5f3a');
  box(-31, 0.4,  -1, 1, 0.2, 2, '#7a5f3a');
  // Podium (with mic)
  box(-35, 0.6, -1.0, 1.1, 1.3, 1.0, '#2a2a2a');
  box(-34.95, 1.85, -1.0, 1.0, 0.05, 1.0, '#1a1a1a');
  cylinder(-34.5, 1.9, -0.5, 0.02, 0.45, '#222', 6);
  cylinder(-34.5, 2.35, -0.5, 0.06, 0.1, '#444', 6);
  // Speaker presenting
  person(-34.5, -0.2, '#1f2d3d');
  // LED screen on back wall
  box(-44.5, 0.6, -10, 0.1, 6.5, 20, '#0a0a0a');
  box(-44.45, 1.0, -9.5, 0.05, 5.5, 19, '#1a4d8c');
  // Subtitle band
  box(-44.43, 1.5, -8, 0.04, 1.2, 16, '#0d3868');
  // Side speakers (large)
  box(-43.5, 0.6, -10.5, 0.8, 2.8, 0.8, '#222');
  box(-43.5, 0.6,   9.7, 0.8, 2.8, 0.8, '#222');
  cylinder(-43.1, 1.6, -10.1, 0.3, 0.05, '#444', 8);
  cylinder(-43.1, 1.6,  10.1, 0.3, 0.05, '#444', 8);
  // Stage lighting truss
  box(-45, WH-1.0, -11, 17, 0.18, 0.18, '#2a2a2a');
  box(-45, WH-1.0,  10.8, 17, 0.18, 0.18, '#2a2a2a');
  for (const sx of [-43, -39, -35, -31]) {
    spotlight(sx, WH-1.0, -10);
    spotlight(sx, WH-1.0, 10);
  }
  // Backstage equipment racks
  box(-45.3, 0, -8, 0.4, 1.8, 1, '#1a1a1a');
  box(-45.3, 0,  0, 0.4, 1.8, 1, '#1a1a1a');
  box(-45.3, 0,  8, 0.4, 1.8, 1, '#1a1a1a');
}

// === LABELS (for iso view) ===
function drawLabels() {
  if (cam.mode !== 'iso') return;
  flush(); // draw scene first, then text on top
  const labels = [
    [40, 6, 0,    'ENTRANCE',     '#ff6961'],
    [22, 5, -8,   'EXHIBITION',   '#ff9f43'],
    [22, 5,  8,   '4 BOOTHS',     '#ff9f43'],
    [-1, 4.5, 0,  'NETWORKING',   '#5dd39e'],
    [-3, 4.5, 13.5, 'CATERING',   '#bb86fc'],
    [-3, 4.5, -13.5,'CATERING',   '#bb86fc'],
    [-20, 5, 0,   'AUDIENCE',     '#5fa8d3'],
    [-36, 7, 0,   'KEYNOTE STAGE','#ffd700']
  ];
  ctx.save();
  for (const [x, y, z, text, color] of labels) {
    const p = project(x, y, z);
    if (!p.ok) continue;
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = 6;
    ctx.fillStyle = color;
    ctx.fillText(text, p.x, p.y);
  }
  ctx.restore();
}

// === MAIN BUILD ===
function buildScene() {
  drawFloor();
  drawZoneTints();
  drawWalls();
  drawCeilingLights();
  drawEntrance();
  drawBooths();
  drawNetworking();
  drawCatering();
  drawSeating();
  drawStage();
}

function render() {
  // BG gradient (sky)
  const g = ctx.createLinearGradient(0, 0, 0, H);
  if (cam.mode === 'iso') {
    g.addColorStop(0, '#0a0e1a');
    g.addColorStop(1, '#1a2238');
  } else {
    g.addColorStop(0, '#1a1810');
    g.addColorStop(0.55, '#2a2418');
    g.addColorStop(1, '#1a1810');
  }
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  buildScene();
  flush();
  drawLabels();
}

// === CONTROLS ===
let dragging=false, lastX=0, lastY=0, dragShift=false;
canvas.addEventListener('mousedown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY; dragShift = e.shiftKey;
  canvas.classList.add('grab');
});
addEventListener('mouseup', () => { dragging=false; canvas.classList.remove('grab'); });
addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX-lastX, dy = e.clientY-lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (cam.mode === 'iso') {
    if (e.shiftKey || dragShift) {
      cam.iso.yaw += dx * 0.008;
      cam.iso.pitch = Math.max(0.05, Math.min(Math.PI/2 - 0.02, cam.iso.pitch + dy*0.008));
    } else {
      cam.iso.panX += dx; cam.iso.panY += dy;
    }
  } else {
    cam.fpv.yaw   -= dx * 0.005;
    cam.fpv.pitch  = Math.max(-Math.PI/2+0.1, Math.min(Math.PI/2-0.1, cam.fpv.pitch - dy*0.005));
  }
});
canvas.addEventListener('wheel', e => {
  if (cam.mode === 'iso') {
    cam.iso.zoom *= e.deltaY > 0 ? 0.92 : 1.08;
    cam.iso.zoom = Math.max(2, Math.min(25, cam.iso.zoom));
  } else {
    // FOV-ish zoom: move forward/back
    const c = cam.fpv;
    const fx = -Math.sin(c.yaw), fz = -Math.cos(c.yaw);
    const step = e.deltaY > 0 ? -1 : 1;
    c.x += fx*step; c.z += fz*step;
    clampFPV();
  }
  e.preventDefault();
}, { passive: false });

const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; });
addEventListener('keyup',   e => { keys[e.code] = false; });

const zoneTag = document.getElementById('zoneTag');
function clampFPV() {
  const c = cam.fpv;
  c.x = Math.max(-44.7, Math.min(44.7, c.x));
  c.z = Math.max(-15.7, Math.min(15.7, c.z));
  c.y = Math.max(0.3, Math.min(8.5, c.y));
}
function updateZoneTag() {
  if (cam.mode !== 'fpv') return;
  const c = cam.fpv;
  let zone = '— Open Floor —';
  if (c.x > 36)        zone = '🎟  Entrance & Check-in';
  else if (c.x > 16.5) zone = '🏢  Exhibition Booths';
  else if (c.x > -3.5 && Math.abs(c.z) > 11) zone = '🍽  Catering';
  else if (c.x > -3.5) zone = '🥂  Networking';
  else if (c.x > -28)  zone = '🪑  Audience Seating';
  else if (c.x > -45)  zone = '🎤  Keynote Stage';
  zoneTag.textContent = zone;
}
function updateMovement(dt) {
  if (cam.mode !== 'fpv') return;
  const c = cam.fpv;
  const run = keys['ShiftLeft'] || keys['ShiftRight'];
  const speed = (run ? 7 : 3) * dt;
  const fx = -Math.sin(c.yaw), fz = -Math.cos(c.yaw);
  const rx =  Math.cos(c.yaw), rz = -Math.sin(c.yaw);
  if (keys['KeyW'] || keys['ArrowUp'])    { c.x += fx*speed; c.z += fz*speed; }
  if (keys['KeyS'] || keys['ArrowDown'])  { c.x -= fx*speed; c.z -= fz*speed; }
  if (keys['KeyA'] || keys['ArrowLeft'])  { c.x -= rx*speed; c.z -= rz*speed; }
  if (keys['KeyD'] || keys['ArrowRight']) { c.x += rx*speed; c.z += rz*speed; }
  if (keys['KeyQ'] || keys['Space'])      { c.y += speed*0.6; }
  if (keys['KeyE'] || keys['ControlLeft']){ c.y -= speed*0.6; }
  clampFPV();
  updateZoneTag();
}

// === LOOP ===
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  updateMovement(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
