<script>
/* js/sections/risk.js */
/* Framework section 5: risk management (identify, assess, plan measures, implement and control). */
(function () {
  'use strict';
  const S = PM.svg;
  const U = PM.util;

  const W = 1000; // width of every drawing in this file

  const SOURCES = ['Project plans', 'Checklists', 'Content documentation', 'Expert interviews', 'Brainstorming', 'Lessons learned'];
  const CATS = ['Content and quality', 'Dates', 'Resources and costs', 'People and organisation', 'Stakeholders', 'External'];
  const STRATS = ['Avoid', 'Reduce', 'Transfer', 'Accept'];
  const STATUS = ['Open', 'Watching', 'Occurred', 'Closed'];
  const RUNNING = ['Implementation', 'Closing', 'Closed'];
  const DEF_HIGH = 5000;
  const DEF_MEDIUM = 1500;

  // =====================================================================================
  // Calculations
  // =====================================================================================
  const num = (v) => U.num(v);

  /** Priority thresholds: the fields, else High from 5,000 and Medium from 1,500. */
  function thr(q) {
    let H = num(q.f('risk.thresholdHigh'));
    let M = num(q.f('risk.thresholdMedium'));
    if (!(H > 0)) H = DEF_HIGH;
    if (!(M > 0)) M = Math.min(DEF_MEDIUM, H);
    if (M > H) M = H;
    return { H, M };
  }

  /** Risk value = risk cost × probability / 100 (probability is stored 0–100). */
  function riskValue(r) {
    const c = num(r.cost);
    const p = num(r.prob);
    return c != null && p != null ? Math.round(c * p) / 100 : null;
  }

  function priorityOf(v, q) {
    if (v == null || v === '') return '';
    const t = thr(q);
    return v >= t.H ? 'High' : v >= t.M ? 'Medium' : 'Low';
  }

  const isActive = (st) => !st || st === 'Open' || st === 'Watching';

  /** The risk table as plain items, numbered as on the page. */
  function riskList(q) {
    return q.rows('risks').map((r, i) => {
      const cost = num(r.cost);
      const prob = num(r.prob);
      const filled = !!(r.title || cost != null || prob != null || r.desc);
      const value = riskValue(r);
      return {
        r, no: i + 1, filled, ph: !filled,
        title: r.title || q.label(r, 'title') || 'Risk ' + (i + 1),
        cost, prob, value, pri: priorityOf(value, q),
        pcost: num(r.pcost), pos: !!r.positive, status: r.status || '',
      };
    });
  }
  const realRisks = (q) => riskList(q).filter((it) => it.filled);
  const threats = (q) => realRisks(q).filter((it) => !it.pos);

  const budget = (q) => U.sum(threats(q).filter((it) => isActive(it.status)), (it) => it.value);
  const valueTotal = (q) => U.sum(threats(q), (it) => it.value);
  const preventionTotal = (q) => U.sum(realRisks(q), (it) => it.pcost);
  const highOpen = (q) => threats(q).filter((it) => it.pri === 'High' && it.status !== 'Closed');

  function totalCost(q) {
    if (!PM.metrics.totalCost) return null;
    try {
      const v = PM.metrics.totalCost.fn(q);
      return typeof v === 'number' && v > 0 ? v : null;
    } catch (e) {
      return null;
    }
  }

  const names = (list) => list.map((it) => it.no + ' ' + it.title).join(', ');
  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many || one + 's');

  // =====================================================================================
  // Drawing helpers
  // =====================================================================================
  function moneyShort(q, v) {
    const c = q.cur();
    return (c.length > 1 ? c + ' ' : c) + S.compact(v);
  }

  function floor125(v) {
    const k = Math.floor(Math.log10(v));
    const base = Math.pow(10, k);
    const m = Math.round((v / base) * 1e6) / 1e6;
    return (m >= 5 ? 5 : m >= 2 ? 2 : 1) * base;
  }
  function ceil125(v) {
    const k = Math.floor(Math.log10(v));
    const base = Math.pow(10, k);
    const m = Math.round((v / base) * 1e6) / 1e6;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * base;
  }

  /** Fill, outline and number colour of a risk dot. */
  function dotStyle(it, pal) {
    if (it.status === 'Closed') return { fill: pal.box, stroke: pal.muted, sw: 1.2, dash: '2 2', ink: pal.muted };
    if (it.pos) return { fill: pal.bg, stroke: pal.good, sw: 2, ink: pal.ink };
    const fill = it.pri === 'High' ? pal.crit : it.pri === 'Medium' ? pal.warn : pal.good;
    return { fill, ink: pal.accentInk };
  }
  function dot(cx, cy, r, st) {
    return S.circle(cx, cy, r, { fill: st.fill, stroke: st.stroke, sw: st.sw, dash: st.dash });
  }

  /** Legend row with custom swatches. items: [{label, swatch(x, cy) => svg}]. Returns {svg, h}. */
  function legendRow(items, x, y, maxW, pal) {
    const size = 11;
    let cx = x;
    let cy = y;
    let out = '';
    for (const it of items) {
      const w = 14 + 6 + S.measure(it.label, size) + 18;
      if (cx + w > x + maxW && cx > x) {
        cx = x;
        cy += 18;
      }
      out += it.swatch(cx + 7, cy + 7);
      out += S.text(cx + 20, cy + 7, it.label, { size, fill: pal.ink2, v: 'middle' });
      cx += w;
    }
    return { svg: out, h: cy - y + 14 };
  }

  function priorityLegend(pal, withState) {
    const items = [
      { label: 'High', swatch: (x, y) => dot(x, y, 5.5, { fill: pal.crit }) },
      { label: 'Medium', swatch: (x, y) => dot(x, y, 5.5, { fill: pal.warn }) },
      { label: 'Low', swatch: (x, y) => dot(x, y, 5.5, { fill: pal.good }) },
    ];
    if (withState) {
      items.push({ label: 'Opportunity (positive risk)', swatch: (x, y) => dot(x, y, 5, { fill: pal.bg, stroke: pal.good, sw: 2 }) });
      items.push({ label: 'Closed', swatch: (x, y) => dot(x, y, 5.5, { fill: pal.box, stroke: pal.muted, sw: 1.2, dash: '2 2' }) });
    }
    return items;
  }

  // =====================================================================================
  // Graphic: the four steps, filled from the risk table
  // =====================================================================================
  function stepsSvg(q, pal) {
    const real = realRisks(q);
    const gap = 8;
    const pw = (W - 16 - gap * 3) / 4;
    const top = 50;
    const PH = 178;
    const titles = ['Identify risks', 'Assess risks', 'Plan measures', 'Implement and control'];
    let body = '';
    const px = (i) => 8 + i * (pw + gap);

    titles.forEach((t, i) => {
      body += S.chevron(px(i), 8, pw + (i < 3 ? gap : 0), 34, { first: i === 0, fill: pal.accent, tip: 14 });
      body += S.text(px(i) + (i ? 20 : 14), 25, String(i + 1), { size: 13, weight: 700, fill: pal.accentInk, v: 'middle' });
      body += S.text(px(i) + (i ? 36 : 30), 25, t, { size: 13, weight: 600, fill: pal.accentInk, v: 'middle' });
      body += S.rect(px(i), top, pw, PH, { fill: pal.box, stroke: pal.boxLine, rx: 8 });
    });

    // 1 Identify: the three sides of the project triangle
    {
      const cx = px(0) + pw / 2;
      const count = (cat) => real.filter((it) => it.r.cat === cat).length;
      const tp = [cx, top + 36];
      const bl = [cx - 64, top + 114];
      const br = [cx + 64, top + 114];
      body += S.poly([tp, bl, br], { fill: pal.accentSoft, stroke: pal.accent, sw: 1.5 });
      [[tp, count('Content and quality')], [bl, count('Resources and costs')], [br, count('Dates')]].forEach(([p, n]) => {
        body += S.circle(p[0], p[1], 12, { fill: pal.accent });
        body += S.text(p[0], p[1], String(n), { size: 11, weight: 700, fill: pal.accentInk, anchor: 'middle', v: 'middle' });
      });
      body += S.text(cx + 18, tp[1], 'Content, quality', { size: 11, fill: pal.ink2, v: 'middle' });
      body += S.text(bl[0], bl[1] + 24, 'Resources, costs', { size: 11, fill: pal.ink2, anchor: 'middle', v: 'middle' });
      body += S.text(br[0], br[1] + 24, 'Dates', { size: 11, fill: pal.ink2, anchor: 'middle', v: 'middle' });
      body += S.text(cx, top + 92, real.length ? plural(real.length, 'risk') : 'No risks yet', { size: 12, weight: 700, fill: real.length ? pal.ink : pal.muted, anchor: 'middle', v: 'middle', italic: !real.length });
      const other = real.length - count('Content and quality') - count('Resources and costs') - count('Dates');
      const src = (q.f('risk.sources') || []).length;
      body += S.text(cx, top + PH - 14, S.fit(other + ' other · sources used: ' + src + ' of ' + SOURCES.length, pw - 16, 10.5), { size: 10.5, fill: pal.muted, anchor: 'middle', v: 'middle' });
    }

    // 2 Assess: R = E × P and the priorities
    {
      const cx = px(1) + pw / 2;
      const parts = [['R', -70, 'risk value'], ['=', -38], ['E', -4, 'risk cost'], ['×', 34], ['P', 70, 'probability']];
      parts.forEach(([t, dx, sub]) => {
        body += S.text(cx + dx, top + 32, t, { size: 24, weight: 700, fill: sub ? pal.ink : pal.ink2, anchor: 'middle', v: 'middle' });
        if (sub) body += S.text(cx + dx, top + 56, sub, { size: 10, fill: pal.muted, anchor: 'middle', v: 'middle' });
      });
      const pr = ['High', 'Medium', 'Low'].map((p, i) => ({ p, n: real.filter((it) => it.pri === p).length, fill: [pal.crit, pal.warn, pal.good][i] }));
      const ws = pr.map((c) => 26 + S.measure(c.p + ' ' + c.n, 11));
      let x = cx - (U.sum(ws) + 12) / 2;
      pr.forEach((c, i) => {
        body += S.rect(x, top + 76, ws[i], 22, { fill: pal.bg, stroke: pal.boxLine, rx: 11 });
        body += dot(x + 12, top + 87, 4.5, { fill: c.fill });
        body += S.text(x + 21, top + 87, c.p + ' ' + c.n, { size: 11, fill: pal.ink, v: 'middle' });
        x += ws[i] + 6;
      });
      const b = budget(q);
      body += S.text(cx, top + 120, b ? 'Risk budget ' + q.money(b) : 'Risk budget not known yet', { size: 12, weight: b ? 600 : 400, fill: b ? pal.ink : pal.muted, anchor: 'middle', v: 'middle', italic: !b });
      body += S.text(cx, top + 138, 'sum of the open risk values', { size: 10.5, fill: pal.muted, anchor: 'middle', v: 'middle' });
      const na = real.filter((it) => it.value == null).length;
      body += S.text(cx, top + PH - 14, na ? plural(na, 'risk') + ' not assessed yet' : 'Usual probability: 5% to 70%', { size: 10.5, fill: pal.muted, anchor: 'middle', v: 'middle' });
    }

    // 3 Plan measures: risks per strategy
    {
      const x0 = px(2);
      const cnt = STRATS.map((s) => real.filter((it) => it.r.strategy === s).length);
      const max = Math.max(1, ...cnt);
      STRATS.forEach((s, i) => {
        const y = top + 24 + i * 26;
        body += S.text(x0 + 14, y, s, { size: 11.5, fill: pal.ink2, v: 'middle' });
        const w = (cnt[i] / max) * 110;
        if (w > 0) body += S.bar(x0 + 82, y - 6, w, 12, { fill: pal.accent, horizontal: true });
        else body += S.line(x0 + 82, y - 6, x0 + 82, y + 6, { stroke: pal.axis });
        body += S.text(x0 + 82 + w + 6, y, String(cnt[i]), { size: 11, weight: 600, fill: pal.ink, v: 'middle' });
      });
      const prev = real.filter((it) => it.r.prevent).length;
      const corr = real.filter((it) => it.r.correct).length;
      body += S.text(x0 + 14, top + 134, 'Preventive measures: ' + prev, { size: 11, fill: pal.ink2, v: 'middle' });
      body += S.text(x0 + 14, top + 152, 'Corrective measures: ' + corr, { size: 11, fill: pal.ink2, v: 'middle' });
    }

    // 4 Implement and control
    {
      const x0 = px(3);
      const log = q.rows('riskLog').filter((l) => l.date || l.change);
      const dates = log.map((l) => l.date).filter(U.isDate).sort();
      const linked = real.filter((it) => it.r.prevent && it.r.wbs).length;
      const rows = [
        [String(linked), 'measures in the WBS'],
        [String(log.length), log.length === 1 ? 'entry in the risk log' : 'entries in the risk log'],
      ];
      rows.forEach(([n, label], i) => {
        const y = top + 26 + i * 36;
        body += S.text(x0 + 14, y, n, { size: 20, weight: 700, fill: pal.ink, v: 'middle' });
        body += S.text(x0 + 50, y, label, { size: 11, fill: pal.ink2, v: 'middle' });
      });
      body += S.text(x0 + 14, top + 102, dates.length ? 'Last review: ' + q.date(dates[dates.length - 1]) : 'No review recorded yet', { size: 11, fill: dates.length ? pal.ink2 : pal.muted, v: 'middle', italic: !dates.length });
      const st = STATUS.map((s) => s + ' ' + real.filter((it) => it.status === s).length);
      body += S.text(x0 + 14, top + 132, S.fit(st.slice(0, 2).join(' · '), pw - 28, 10.5), { size: 10.5, fill: pal.muted, v: 'middle' });
      body += S.text(x0 + 14, top + 150, S.fit(st.slice(2).join(' · '), pw - 28, 10.5), { size: 10.5, fill: pal.muted, v: 'middle' });
    }

    return S.svg(W, top + PH + 8, body, { pal, label: 'Risk management in four steps' });
  }

  // =====================================================================================
  // Graphic: risk matrix (probability × risk cost) with priority zones
  // =====================================================================================
  function matrixSvg(q, pal) {
    const t = thr(q);
    const items = riskList(q);
    const pts = items.filter((it) => !it.ph && it.cost > 0 && it.prob != null);
    const costs = pts.map((it) => it.cost);
    const lo = floor125(Math.min(t.M, ...costs) * 0.95);
    const hi = ceil125(Math.max(t.H * 4, ...costs.map((c) => c * 1.2)));
    const x0 = 78;
    const x1 = 590;
    const yTop = 44;
    const yBot = 384;
    const PMAX = 80;
    const R = 10;
    const X = (p) => x0 + (Math.max(0, Math.min(PMAX, p)) / PMAX) * (x1 - x0);
    const lnLo = Math.log(lo);
    const lnSpan = Math.log(hi) - lnLo;
    const Y = (c) => yBot - ((Math.log(Math.max(lo, Math.min(hi, c))) - lnLo) / lnSpan) * (yBot - yTop);

    let body = '';
    // zones: everything is Low, then the areas where the risk value reaches the thresholds
    body += S.rect(x0, yTop, x1 - x0, yBot - yTop, { fill: pal.bg });
    body += S.rect(x0, yTop, x1 - x0, yBot - yTop, { fill: pal.status.good, fillOpacity: 0.1 });
    const curve = (T) => {
      const pTop = (T * 100) / hi;
      if (pTop >= PMAX) return null;
      const pa = Math.max(pTop, 0.05);
      const out = [];
      for (let i = 0; i <= 60; i++) {
        const p = pa * Math.pow(PMAX / pa, i / 60);
        out.push([X(p), Y((T * 100) / p)]);
      }
      return out;
    };
    [[t.M, pal.status.warning, 0.18], [t.H, pal.status.critical, 0.14]].forEach(([T, col, op]) => {
      const c = curve(T);
      if (!c) return;
      const area = c.concat([[X(PMAX), yTop]]);
      body += S.poly(area, { fill: pal.bg });
      body += S.poly(area, { fill: col, opacity: op });
      body += S.polyline(c, { stroke: col, sw: 1.2 });
    });

    // grid and axes
    const ticks = [];
    for (let k = Math.floor(Math.log10(lo)); k <= Math.ceil(Math.log10(hi)); k++) {
      [1, 2, 5].forEach((m) => {
        const v = m * Math.pow(10, k);
        if (v >= lo * 0.999 && v <= hi * 1.001) ticks.push({ v, m });
      });
    }
    const shown = ticks.length > 10 ? ticks.filter((tk) => tk.m === 1) : ticks;
    shown.forEach((tk) => {
      const y = Y(tk.v);
      body += S.line(x0, y, x1, y, { stroke: pal.line, sw: 0.6 });
      body += S.text(x0 - 6, y, moneyShort(q, tk.v), { size: 11, fill: pal.ink2, anchor: 'end', v: 'middle' });
    });
    for (let p = 0; p <= PMAX; p += 10) {
      body += S.line(X(p), yTop, X(p), yBot, { stroke: pal.line, sw: 0.6 });
      body += S.text(X(p), yBot + 6, p + '%', { size: 11, fill: pal.ink2, anchor: 'middle', v: 'top' });
    }
    body += S.rect(x0, yTop, x1 - x0, yBot - yTop, { stroke: pal.axis });
    [5, 70].forEach((p) => {
      body += S.line(X(p), yTop - 6, X(p), yBot, { stroke: pal.muted, sw: 1, dash: '3 3' });
    });
    body += S.text((X(5) + X(70)) / 2, yTop - 12, 'usual range of probability: 5% to 70%', { size: 10.5, fill: pal.muted, anchor: 'middle', v: 'middle' });
    body += S.text(8, 12, 'Risk cost (impact), log scale', { size: 11, weight: 600, fill: pal.ink2, v: 'middle' });
    body += S.text((x0 + x1) / 2, yBot + 26, 'Probability of occurrence', { size: 11, weight: 600, fill: pal.ink2, anchor: 'middle', v: 'top' });

    // zone labels
    const zl = (x, y, a, b, anchor) => {
      const w = Math.max(S.measure(a, 12, 700), b ? S.measure(b, 10.5) : 0) + 8;
      body += S.rect(anchor === 'end' ? x - w + 4 : x - 4, y - 3, w, b ? 32 : 18, { fill: pal.bg, fillOpacity: 0.8, rx: 3 });
      body += S.text(x, y, a, { size: 12, weight: 700, fill: pal.ink, anchor, v: 'top' });
      if (b) body += S.text(x, y + 15, b, { size: 10.5, fill: pal.ink2, anchor, v: 'top' });
    };
    if (Y((t.H * 100) / PMAX) - yTop > 40) zl(x1 - 8, yTop + 8, 'High', 'risk value from ' + q.money(t.H), 'end');
    const yM = Y((t.M * 100) / 75);
    const yH = Y((t.H * 100) / 75);
    if (yM - yH > 34) zl(x1 - 8, (yM + yH) / 2 - 14, 'Medium', q.money(t.M) + ' to ' + q.money(t.H), 'end');
    else if (yM - yH > 16) zl(x1 - 8, (yM + yH) / 2 - 7, 'Medium', '', 'end');
    zl(x0 + 8, yBot - 36, 'Low', 'below ' + q.money(t.M), 'start');

    // dots: one per risk, moved aside when they would cover each other
    const placed = [];
    const free = (x, y) => x >= x0 + R && x <= x1 - R && y >= yTop + R && y <= yBot - R && placed.every((d) => Math.hypot(d.x - x, d.y - y) >= 2 * R + 1);
    pts.forEach((it) => {
      const bx = Math.max(x0 + R, Math.min(x1 - R, X(it.prob)));
      const by = Math.max(yTop + R, Math.min(yBot - R, Y(it.cost)));
      let pos = free(bx, by) ? { x: bx, y: by } : null;
      for (let k = 1; !pos && k <= 8; k++) {
        const n = 6 * k;
        for (let j = 0; j < n && !pos; j++) {
          const a = -Math.PI / 2 + (j * 2 * Math.PI) / n;
          const x = bx + Math.cos(a) * k * (2 * R + 2);
          const y = by + Math.sin(a) * k * (2 * R + 2);
          if (free(x, y)) pos = { x, y };
        }
      }
      pos = pos || { x: bx, y: by };
      placed.push({ x: pos.x, y: pos.y, bx, by, it });
    });
    placed.forEach((d) => {
      if (Math.hypot(d.x - d.bx, d.y - d.by) > 1) {
        body += S.line(d.bx, d.by, d.x, d.y, { stroke: pal.muted, sw: 1 });
        body += S.circle(d.bx, d.by, 2.5, { fill: pal.muted });
      }
    });
    placed.forEach((d) => {
      const st = dotStyle(d.it, pal);
      body += dot(d.x, d.y, R, st);
      body += S.text(d.x, d.y, String(d.it.no), { size: d.it.no > 99 ? 8.5 : 11, weight: 700, fill: st.ink, anchor: 'middle', v: 'middle' });
    });
    if (!pts.length) {
      const msg = 'Enter the risk cost and probability to place the risks';
      const w = S.measure(msg, 12) + 24;
      const cx = (x0 + x1) / 2;
      const cy = (yTop + yBot) / 2;
      body += S.rect(cx - w / 2, cy - 15, w, 30, { fill: pal.bg, stroke: pal.boxLine, rx: 6 });
      body += S.text(cx, cy, msg, { size: 12, fill: pal.muted, anchor: 'middle', v: 'middle', italic: true });
    }

    const lg = legendRow(priorityLegend(pal, true), x0, yBot + 50, x1 - x0, pal);
    body += lg.svg;
    let h = yBot + 50 + lg.h + 8;

    // list of the risks beside the matrix
    const xl = 624;
    const xr = W - 12;
    body += S.text(xl, 22, 'No.', { size: 10.5, weight: 600, fill: pal.muted, v: 'middle' });
    body += S.text(xl + 40, 22, 'Risk', { size: 10.5, weight: 600, fill: pal.muted, v: 'middle' });
    body += S.text(xr, 22, 'Risk value', { size: 10.5, weight: 600, fill: pal.muted, anchor: 'end', v: 'middle' });
    body += S.line(xl, 32, xr, 32, { stroke: pal.line });
    const rowH = 21;
    items.forEach((it, i) => {
      const y = yTop + i * rowH + rowH / 2 - 2;
      if (!it.ph && it.value != null) body += dot(xl + 5, y, 5, dotStyle(it, pal));
      body += S.text(xl + 16, y, String(it.no), { size: 11, weight: 600, fill: it.ph ? pal.muted : pal.ink, family: 'mono', v: 'middle' });
      body += S.text(xl + 40, y, S.fit(it.title + (it.pos && !it.ph ? ' (opportunity)' : ''), xr - 76 - (xl + 40), 11.5), { size: 11.5, fill: it.ph ? pal.muted : pal.ink, italic: it.ph, v: 'middle' });
      if (!it.ph) {
        const txt = it.value != null ? q.money(it.value) : 'not assessed';
        body += S.text(xr, y, txt, { size: 11, fill: it.value != null ? pal.ink2 : pal.muted, italic: it.value == null, anchor: 'end', v: 'middle' });
      }
      body += S.line(xl, y + rowH / 2, xr, y + rowH / 2, { stroke: pal.grid, sw: 0.8 });
    });
    if (!items.length) body += S.text(xl, yTop + 8, 'No risks in the table yet.', { size: 11.5, fill: pal.muted, italic: true, v: 'middle' });
    h = Math.max(h, yTop + items.length * rowH + 10);
    return S.svg(W, h, body, { pal, label: 'Risk matrix' });
  }

  // =====================================================================================
  // Graphic: risk strategies as a waterfall
  // =====================================================================================
  function strategyModel(q) {
    const th = threats(q).filter((it) => it.value > 0);
    const total = U.sum(th, (it) => it.value);
    const part = (s) => th.filter((it) => it.r.strategy === s);
    const sum = (list) => U.sum(list, (it) => it.value);
    const none = th.filter((it) => STRATS.indexOf(it.r.strategy) < 0);
    return {
      total, th,
      avoid: part('Avoid'), reduce: part('Reduce'), transfer: part('Transfer'), accept: part('Accept'), none,
      sum,
    };
  }

  function strategiesSvg(q, pal) {
    const m = strategyModel(q);
    const total = m.total;
    const topY = 86;
    const yB = 300;
    const hMax = yB - topY;
    const BW = 24;
    const hOf = (v) => (v / total) * hMax;
    const a = m.sum(m.avoid);
    const r = m.sum(m.reduce);
    const tr = m.sum(m.transfer);
    const rem = total - a - r - tr;
    const L1 = total - a;
    const L2 = L1 - r;
    const L3 = L2 - tr;
    const cols = [
      { label: 'Initial risk', sub: plural(m.th.length, 'risk'), from: 0, to: total, fill: pal.strong, val: q.money(total) },
      { label: 'Avoided', sub: plural(m.avoid.length, 'risk'), from: L1, to: total, fill: pal.accent, val: '−' + q.money(a) },
      { label: 'Reduced', sub: plural(m.reduce.length, 'risk'), from: L2, to: L1, fill: pal.accent, val: '−' + q.money(r) },
      { label: 'Transferred', sub: plural(m.transfer.length, 'risk'), from: L3, to: L2, fill: pal.accent, val: '−' + q.money(tr) },
      { label: 'Remaining', sub: m.accept.length + ' accepted' + (m.none.length ? ', ' + m.none.length + ' open' : ''), from: 0, to: rem, fill: pal.crit, val: q.money(rem) },
    ];
    const cx = (i) => 110 + i * 120;
    const Yv = (v) => yB - hOf(v);
    let body = '';
    body += S.line(48, yB, 650, yB, { stroke: pal.axis });
    cols.forEach((c, i) => {
      const x = cx(i) - BW / 2;
      const y1 = Yv(c.to);
      const y0 = Yv(c.from);
      const hh = y0 - y1;
      if (hh >= 1) {
        if (c.from === 0) body += S.bar(x, y1, BW, hh, { fill: c.fill });
        else body += S.rect(x, y1, BW, hh, { fill: c.fill, rx: 2 });
      } else body += S.line(x - 2, y1, x + BW + 2, y1, { stroke: c.fill, sw: 2 });
      body += S.text(cx(i), y1 - 7, c.val, { size: 11.5, weight: 600, fill: pal.ink, anchor: 'middle', v: 'base' });
      if (i > 0 && i < 4 && total > 0) body += S.text(cx(i) + BW / 2 + 5, (y1 + y0) / 2, Math.round(((c.to - c.from) / total) * 100) + '%', { size: 10.5, fill: pal.muted, v: 'middle' });
      body += S.text(cx(i), yB + 8, c.label, { size: 12, weight: 600, fill: pal.ink, anchor: 'middle', v: 'top' });
      body += S.text(cx(i), yB + 24, c.sub, { size: 10.5, fill: pal.muted, anchor: 'middle', v: 'top' });
      if (i < 4) {
        const lv = i === 0 ? total : c.from;
        body += S.line(cx(i) + BW / 2 + (i > 0 && i < 4 ? 34 : 2), Yv(lv), cx(i + 1) - BW / 2 - 2, Yv(lv), { stroke: pal.muted, sw: 1, dash: '3 3' });
      }
    });
    // measures of the first three strategies go into the plan
    const bx0 = cx(1) - 44;
    const bx1 = cx(3) + 44;
    body += S.path('M' + bx0 + ',62 V54 H' + bx1 + ' V62 M' + (bx0 + bx1) / 2 + ',54 V48', { stroke: pal.ink2, sw: 1.2 });
    const prev = preventionTotal(q);
    body += S.text((bx0 + bx1) / 2, 34, 'Preventive measures go into the WBS and the cost plan' + (prev ? ' (' + q.money(prev) + ')' : ''), { size: 11, fill: pal.ink2, anchor: 'middle', v: 'middle', italic: true });

    // remaining risk leads to corrective measures
    const ay = yB - 52;
    body += S.chevron(624, ay - 26, 34, 52, { first: true, fill: pal.critSoft, stroke: pal.crit, sw: 1.2, tip: 16 });
    const corr = realRisks(q).filter((it) => it.r.correct).length;
    const b = budget(q);
    const sub = plural(corr, 'corrective measure') + ' planned. Risk budget for the open risks: ' + (b ? q.money(b) : 'not known yet') + '.';
    body += S.box(670, ay - 46, W - 12 - 670, 92, 'Planning of corrective measures', { fill: pal.box, stroke: pal.boxLine, size: 13, color: pal.ink, sub, subSize: 11, subColor: pal.ink2, subMaxLines: 3 });

    // unidentified risks
    const by = yB + 46;
    const tres = num(q.f('risk.timeReserve'));
    body += S.rect(48, by, 602, 26, { fill: pal.box, stroke: pal.boxLine, dash: '4 3', rx: 4 });
    body += S.text(349, by + 13, 'Unidentified risks: some always remain. ' + (tres ? 'Time reserve: ' + plural(tres, 'day') + '.' : 'Keep a time reserve for them.'), { size: 11, fill: pal.ink2, italic: true, anchor: 'middle', v: 'middle' });
    return S.svg(W, by + 26 + 8, body, { pal, label: 'Risk strategies' });
  }

  // =====================================================================================
  // Graphic: risk value against the cost of prevention
  // =====================================================================================
  function preventionSvg(q, pal) {
    const rows = realRisks(q).filter((it) => it.value > 0 || it.pcost > 0);
    const top = 34;
    const rowH = 32;
    const bx = 272;
    const bw = 440;
    const max = Math.max(...rows.map((it) => Math.max(it.value || 0, it.pcost || 0)));
    const nt = S.niceTicks(max, 4);
    const sx = (v) => (v / nt.max) * bw;
    let body = '';
    const lg = S.legend([{ label: 'Risk value', color: pal.series[0] }, { label: 'Cost of prevention', color: pal.series[1] }], 8, 8, pal, { maxW: 500 });
    body += lg.svg;
    const bottom = top + rows.length * rowH;
    nt.ticks.forEach((v) => {
      body += S.line(bx + sx(v), top - 4, bx + sx(v), bottom, { stroke: pal.grid });
      body += S.text(bx + sx(v), bottom + 6, moneyShort(q, v), { size: 10.5, fill: pal.muted, anchor: 'middle', v: 'top' });
    });
    let dear = 0;
    rows.forEach((it, i) => {
      const y = top + i * rowH;
      body += S.text(8, y + 12, S.fit(it.no + '  ' + it.title + (it.pos ? ' (opportunity)' : ''), bx - 18, 12), { size: 12, fill: pal.ink, v: 'middle' });
      const v = it.value || 0;
      const p = it.pcost || 0;
      if (v > 0) body += S.bar(bx, y + 1, Math.max(2, sx(v)), 10, { fill: pal.series[0], horizontal: true });
      body += S.text(bx + sx(v) + 6, y + 6, v > 0 ? q.money(v) : 'no value', { size: 10.5, fill: pal.ink2, v: 'middle', italic: !(v > 0) });
      if (p > 0) body += S.bar(bx, y + 13, Math.max(2, sx(p)), 10, { fill: pal.series[1], horizontal: true });
      body += S.text(bx + sx(p) + 6, y + 18, p > 0 ? q.money(p) : 'no prevention cost', { size: 10.5, fill: pal.ink2, v: 'middle', italic: !(p > 0) });
      if (p > 0 && v > 0 && p > v) {
        dear += 1;
        const fx = 806;
        body += S.poly([[fx, y + 18], [fx + 7, y + 5], [fx + 14, y + 18]], { fill: pal.crit });
        body += S.text(fx + 7, y + 13.5, '!', { size: 9, weight: 700, fill: pal.accentInk, anchor: 'middle', v: 'middle' });
        body += S.text(fx + 20, y + 12, 'costs more than the risk', { size: 11, fill: pal.ink, v: 'middle' });
      }
      if (i < rows.length - 1) body += S.line(8, y + rowH - 4, W - 8, y + rowH - 4, { stroke: pal.grid, sw: 0.6 });
    });
    body += S.line(bx, top - 4, bx, bottom, { stroke: pal.axis });
    const sumTxt = 'Risk value of all risks ' + q.money(valueTotal(q)) + ' · cost of prevention ' + q.money(preventionTotal(q)) + (dear ? ' · ' + plural(dear, 'measure') + ' cost more than the risk' : '');
    body += S.text(8, bottom + 30, sumTxt, { size: 11.5, weight: 600, fill: pal.ink2, v: 'middle' });
    return S.svg(W, bottom + 44, body, { pal, label: 'Risk value against the cost of prevention' });
  }

  // =====================================================================================
  // Checks (from the recommendations of the method)
  // =====================================================================================
  function runChecks(q) {
    const items = realRisks(q);
    if (!items.length) return [{ ok: null, text: 'Add risks to the risk table to run the checks.' }];
    const out = [];
    const t = thr(q);

    const withP = items.filter((it) => it.prob != null);
    const outside = withP.filter((it) => it.prob < 5 || it.prob > 70);
    if (outside.length) out.push({ ok: null, text: 'Probability outside the usual 5% to 70%: ' + names(outside) + '. Below 5% a measure rarely pays; above 70% the risk is close to certain, so plan it as work and cost.' });
    else if (withP.length) out.push({ ok: true, text: 'Every probability lies between 5% and 70%.' });
    const na = items.filter((it) => it.value == null);
    if (na.length) out.push({ ok: false, text: 'Not assessed yet (risk cost or probability missing): ' + names(na) + '.' });

    const high = items.filter((it) => !it.pos && it.pri === 'High' && it.status !== 'Closed');
    const highBad = high.filter((it) => !it.r.prevent || !it.r.owner);
    if (!high.length) out.push({ ok: null, text: 'No open High risk (High from ' + q.money(t.H) + ').' });
    else out.push(highBad.length ? { ok: false, text: 'High risks without a preventive measure or an owner: ' + names(highBad) + '.' } : { ok: true, text: 'Every High risk has a preventive measure and an owner.' });

    const noStrat = items.filter((it) => !it.pos && it.status !== 'Closed' && STRATS.indexOf(it.r.strategy) < 0);
    out.push(noStrat.length ? { ok: false, text: 'No strategy chosen yet: ' + names(noStrat) + '.' } : { ok: true, text: 'Every open risk has a strategy (avoid, reduce, transfer or accept).' });

    const meas = items.filter((it) => it.r.prevent);
    const noW = meas.filter((it) => !it.r.wbs);
    if (meas.length) out.push(noW.length ? { ok: false, text: 'Preventive measures without a WBS line: ' + names(noW) + '. Plan each measure as work in the WBS.' } : { ok: true, text: 'Every preventive measure is linked to a WBS line.' });

    const dear = items.filter((it) => it.pcost > 0 && it.value != null && it.pcost > it.value);
    out.push(dear.length ? { ok: false, text: 'Prevention costs more than the risk value: ' + names(dear) + '. Choose a cheaper measure or accept the risk.' } : { ok: true, text: 'No preventive measure costs more than its risk value.' });

    const highAll = items.filter((it) => !it.pos && it.pri === 'High');
    out.push(highAll.length <= 10 ? { ok: true, text: plural(highAll.length, 'High risk') + ': a number the team can manage.' } : { ok: null, text: highAll.length + ' High risks. Cut the list down to the critical risks you can influence.' });

    const appr = q.f('risk.budgetApproved');
    const b = budget(q);
    out.push(appr === 'Yes' ? { ok: true, text: 'The sponsor approved the risk budget' + (q.f('risk.budgetApprovedOn') ? ' on ' + q.date(q.f('risk.budgetApprovedOn')) : '') + '.' } : { ok: false, text: 'Have the sponsor approve the risk budget (' + q.money(b) + ') and the time reserve.' });

    const tc = totalCost(q);
    const inPlan = q.f('risk.inCostPlan') === 'Yes';
    out.push(inPlan ? { ok: true, text: 'The risk budget is part of the cost plan.' } : { ok: false, text: 'Include the risk budget in the cost plan.' });
    if (tc) out.push({ ok: null, text: 'Risk budget ' + q.money(b) + ' is ' + q.pct(Math.round((b / tc) * 1000) / 10) + ' of the planned cost (' + q.money(tc) + '); prevention adds ' + q.money(preventionTotal(q)) + '.' });

    if (RUNNING.indexOf(q.f('meta.status')) >= 0) {
      const dates = q.rows('riskLog').map((l) => l.date).filter(U.isDate);
      out.push(dates.length ? { ok: true, text: 'Risk controlling: ' + plural(dates.length, 'dated entry', 'dated entries') + ' in the risk log.' } : { ok: false, text: 'The project runs: record at least one risk review in the risk log.' });
    } else out.push({ ok: null, text: 'Once the project runs, review the risks regularly and record it in the risk log.' });
    return out;
  }

      ],

        { _id: 'rl1', date: '2026-03-06', risk: '', change: 'Risk review in the team meeting: all risks reassessed, no changes.', prob: null, cost: null, measure: '', by: 'p2' },

        { _id: 'rl3', date: '2026-05-20', risk: 'rk5', change: '380 registrations after the first reminder; target reached by 5 June with 430.', prob: 5, cost: null, measure: 'Second reminder through the ambassadors', by: 'p5' },
        { _id: 'rl4', date: '2026-06-09', risk: 'rk3', change: 'The authority approved the safety concept; risk closed.', prob: null, cost: null, measure: '', by: 'p4' },
        { _id: 'rl5', date: '2026-06-19', risk: 'rk1', change: 'Long-range forecast for 27 June: showers likely in the afternoon. Assessment kept at 30%.', prob: 30, cost: 12000, measure: 'Marquee confirmed, bad-weather programme sent to the artists', by: 'p2' },
      ],
    },
    x: {
      riskTerms: {
        risk: { example: 'Rain on the festival day' },
        crisis: { example: 'Losing the venue two weeks before the festival' },
        rm: { example: 'Risk table built in the follow-up workshop on 20 February, reviewed every four weeks' },
      },
    },
  });
})();

<script>
/* js/sections/formats-contract-tailoring.js */
/* Framework sections 6 (kick-off and start workshop), 7 (contract management) and 8 (tailoring), plus the method pyramid graphic. */
(function () {
  'use strict';
  const S = PM.svg;
  const U = PM.util;

  const W = 1000; // width of every drawing in this file
  const EXT = 'External (customer) project';
  const r1 = (n) => S.round(n);
  const filled = (v) => !U.isEmpty(v) && !(Array.isArray(v) && !v.length);

  // =====================================================================================
  // Shared drawing helpers
  // =====================================================================================

  /** Chevron as a path, so it can also be dashed. first: flat left edge. */
  function chev(x, y, w, h, first, tip, o) {
    const pts = first
      ? [[x, y], [x + w - tip, y], [x + w, y + h / 2], [x + w - tip, y + h], [x, y + h]]
      : [[x, y], [x + w - tip, y], [x + w, y + h / 2], [x + w - tip, y + h], [x, y + h], [x + tip, y + h / 2]];
    return S.path('M' + pts.map((p) => r1(p[0]) + ',' + r1(p[1])).join(' L') + ' Z', { fill: o.fill, stroke: o.stroke, sw: o.sw, dash: o.dash, join: 'round' });
  }

  /** Largest font size (from sizes) at which str wraps into maxLines lines no wider than maxW. */
  function fitLines(str, maxW, maxLines, sizes, weight) {
    sizes = sizes || [12, 11.5, 11, 10.5, 10];
    const words = String(str || '').split(/\s+/).filter(Boolean);
    for (const size of sizes) {
      if (words.some((w) => S.measure(w, size, weight) > maxW + 0.5)) continue;
      const lines = S.wrap(str, maxW, size, weight);
      if (lines.length <= maxLines) return { lines, size };
    }
    // fallback: wrap at word breaks only, ellipsis where it does not fit
    const size = sizes[sizes.length - 1];
    const lines = [];
    let cur = '';
    for (const w of words) {
      const t = cur ? cur + ' ' + w : w;
      if (!cur || S.measure(t, size, weight) <= maxW) cur = t;
      else {
        lines.push(cur);
        cur = w;
      }
    }
    if (cur) lines.push(cur);
    const out = lines.slice(0, maxLines);
    if (lines.length > maxLines) out[maxLines - 1] += '…';
    return { lines: out.map((l) => (S.measure(l, size, weight) > maxW ? S.fit(l, maxW, size, weight) : l)), size };
  }

  /** Lines of text, vertically centred on cy. o.anchor decides the horizontal alignment at x. */
  function linesAt(x, cy, fit, o) {
    const size = fit.size;
    const lh = size * 1.18;
    const top = cy - ((fit.lines.length - 1) * lh + size) / 2;
    return fit.lines.map((ln, i) => S.text(x, top + i * lh, ln, Object.assign({ anchor: 'middle' }, o, { size, v: 'top' }))).join('');
  }

  /** Text with a halo in the background colour, so a line passing behind it stays readable. */
  function haloText(x, y, str, o, pal) {
    return S.text(x, y, str, o).replace('<text', '<text stroke="' + pal.bg + '" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke"');
  }

  /** Text rotated around (x, y). */
  function rotText(x, y, deg, str, o) {
    return '<g transform="rotate(' + r1(deg) + ' ' + r1(x) + ' ' + r1(y) + ')">' + S.text(x, y, str, o) + '</g>';
  }

  /** Legend row with custom swatches. items: [{label, swatch(x, cy) => svg, sw}]. Returns {svg, h}. */
  function legendRow(items, x, y, maxW, pal) {
    const size = 11;
    let cx = x;
    let cy = y;
    let out = '';
    for (const it of items) {
      const sw = it.sw || 14;
      const w = sw + 6 + S.measure(it.label, size) + 18;
      if (cx + w > x + maxW && cx > x) {
        cx = x;
        cy += 18;
      }
      out += it.swatch(cx, cy + 6);
      out += S.text(cx + sw + 6, cy + 6, it.label, { size, fill: pal.ink2, v: 'middle' });
      cx += w;
    }
    return { svg: out, h: cy - y + 14 };
  }

  /** Fill, outline and text colours for a process status (step status or contract step status). */
  function statusStyle(status, pal) {
    switch (status) {
      case 'Done':
        return { fill: pal.accent, stroke: pal.accent, sw: 1, ink: pal.accentInk };
      case 'In progress':
        return { fill: pal.accentSoft, stroke: pal.accent, sw: 1.5, ink: pal.ink };
      case 'Skipped':
      case 'Not applicable':
        return { fill: pal.bg, stroke: pal.muted, sw: 1.2, dash: '4 3', ink: pal.muted };
      default:
        return { fill: pal.box, stroke: pal.boxLine, sw: 1, ink: pal.ink };
    }
  }
  function statusLegend(pal, labels) {
    return labels.map((st) => {
      const s = statusStyle(st, pal);
      return { label: st, sw: 18, swatch: (x, cy) => chev(x, cy - 6, 18, 12, true, 5, s) };

  function ownValues(rows, skip) {

  function contractHasEntries(q) {

  function contractProcess(q, pal) {
    const LBL = 126;
    const x0 = 132;
    const x1 = W - 6;
    const implW = 100;
    const stepW = (x1 - x0 - implW) / 10;

    const cs = {};
    q.rows('contractSteps').forEach((r) => (cs[r._id] = r));
    const st = {};
    q.rows('steps').forEach((r) => (st[r._id] = r.status));

    const yC = 34;
    const hC = 48;
    const yGap = yC + hC;
    const yP = yGap + 46;
    const hP = 40;
    const yT = yP + hP + 6;
    const yEnd = yT + 40;
    let body = '';

    // header and zone dividers
    [['Initiation', sx(0), sx(5)], ['Start', sx(5), sx(10)], ['Implementation', sx(10), x1]].forEach(([t, a, b]) => {
      body += S.rect(a + 1, 0, b - a - 2, 24, { fill: pal.box, rx: 4 });
      body += S.text((a + b) / 2, 12, t, { size: 13, weight: 600, fill: pal.ink, anchor: 'middle', v: 'middle' });
    });
    [sx(10)].forEach((x) => (body += S.line(x, 26, x, yEnd, { stroke: pal.line, dash: '4 3' })));

    // lane labels
    const lane = (y, h, name, sub) => {
      const nm = fitLines(name, LBL - 8, 2, [12.5, 12], 600);
      const lh = nm.size * 1.18;
      const blockH = (nm.lines.length - 1) * lh + nm.size + (sub ? 15 : 0);
      let out = linesAt(3, y + h / 2 - blockH / 2 + ((nm.lines.length - 1) * lh + nm.size) / 2, nm, { fill: pal.ink, weight: 600, anchor: 'start' });
      if (sub) out += S.text(3, y + h / 2 + blockH / 2 - 11, sub, { size: 11, fill: pal.muted, italic: true });
      return out;
    };
    body += lane(yC, hC, 'Contract process', ext ? 'sales, then PM' : kind ? 'not applicable here' : 'customer projects');
    body += lane(yP, hP, 'Project management', 'process');

    // contract lane
    const spans = [[0, 2], [2, 4], [4, 5], [5, 6], [6, 10]];
    CONTRACT_STEPS.forEach((c, i) => {
      const [a, b] = spans[i];
      const x = sx(a);
      const w = sx(b) - x;
      const s = statusStyle((cs[c._id] || {}).status, pal);
      body += chev(x + 1, yC, w - 3, hC, i === 0, tip, s);
      const fit = fitLines(c.step, w - tip - 8, 2, [11.5, 11, 10.5, 10], 600);
      body += linesAt(x + 1 + (w - 3) / 2 - (i === 0 ? tip / 2 : 0), yC + hC / 2, fit, { fill: s.ink, weight: 600 });
    });

    // project management lane
    PM.PROCESS.forEach((p, i) => {
      const x = sx(i);
      const s = statusStyle(st[p.id], pal);
      body += chev(x + 1, yP, stepW - 3, hP, i === 0, tip, s);
      body += S.text(x + 1 + (stepW - 3) / 2 + (i === 0 ? -tip / 2 : 0), yP + hP / 2, p.id, { size: 12, weight: 700, family: 'mono', fill: s.ink, anchor: 'middle', v: 'middle' });
      const fit = fitLines(p.title, stepW - 6, 3, [10.5, 10], 400);
      body += linesAt(x + stepW / 2, yT + 18, fit, { fill: pal.ink2 });
    });
    const sImpl = statusStyle('', pal);
    body += chev(sx(10) + 1, yP, x1 - sx(10) - 1, hP, false, tip, sImpl);
    body += S.text(sx(10) + (x1 - sx(10)) / 2 + 2, yP + hP / 2, 'Implementation', { size: 11.5, weight: 600, fill: pal.ink, anchor: 'middle', v: 'middle' });

    // synchronisation points
    [[3.5, 1], [5.5, 2], [6.5, 3]].forEach(([k, n]) => {
      const x = sx(k);
      body += S.line(x, yGap + 2, x, yP - 2, { stroke: pal.strong, sw: 1.5, dash: '3 3' });
      body += S.circle(x, (yGap + yP) / 2, 10, { fill: pal.bg, stroke: pal.strong, sw: 1.5 });
      body += S.text(x, (yGap + yP) / 2, String(n), { size: 11.5, weight: 700, fill: pal.ink, anchor: 'middle', v: 'middle' });
    });

    // signature and communication gap
    const xs = sx(5);
    body += S.line(xs, 26, xs, yEnd + 8, { stroke: pal.crit, sw: 2, dash: '6 4' });
    body += S.diamond(xs, yGap + 10, 6, { fill: pal.crit, stroke: pal.bg, sw: 1.5 });
    body += S.text(xs + 8, yEnd + 2, S.fit('Contract signed: communication gap, because the people change here', W - xs - 16, 11.5), { size: 11.5, fill: pal.ink2 });

    const yL = yEnd + 26;
    const key = legendRow(
      [
        { label: 'Offer rests on the high-level plan', sw: 20, swatch: (x, cy) => S.circle(x + 9, cy, 8, { fill: pal.bg, stroke: pal.strong, sw: 1.5 }) + S.text(x + 9, cy, '1', { size: 10, weight: 700, fill: pal.ink, anchor: 'middle', v: 'middle' }) },
        { label: 'Handover is the project start', sw: 20, swatch: (x, cy) => S.circle(x + 9, cy, 8, { fill: pal.bg, stroke: pal.strong, sw: 1.5 }) + S.text(x + 9, cy, '2', { size: 10, weight: 700, fill: pal.ink, anchor: 'middle', v: 'middle' }) },
        { label: 'Contract analysis feeds the detailed planning', sw: 20, swatch: (x, cy) => S.circle(x + 9, cy, 8, { fill: pal.bg, stroke: pal.strong, sw: 1.5 }) + S.text(x + 9, cy, '3', { size: 10, weight: 700, fill: pal.ink, anchor: 'middle', v: 'middle' }) },
      ],
      2, yL, W - 4, pal
    );
    body += key.svg;
    const lg = legendRow(statusLegend(pal, ['Done', 'In progress', 'Not started', 'Not applicable']), 2, yL + key.h + 6, W - 4, pal);
    body += lg.svg;
    return S.svg(W, yL + key.h + 6 + lg.h + 6, body, { pal, label: 'Contract process and project management process with their synchronisation points' });
  }

  // =====================================================================================

  const G = ['Planning situation', 'Project features', 'Project organisation', 'Environment'];
  const EXP = ['good', 'fairly good', 'less experienced', 'inexperienced'];
  const REL = ['good', 'fairly good', 'not very good', 'bad'];
  const CRIT4 = ['non-critical', 'rather non-critical', 'rather critical', 'critical'];
  const SIT = [
    [G[0], 'sClarity', 'Clarity of order or contract', ['clear and good', 'satisfactory', 'unclear', 'critical']],
    [G[0], 'sPlanning', 'General planning situation', ['good', 'sufficient', 'little', 'very little']],
    [G[0], 'sBudget', 'Budget situation', CRIT4],
    [G[0], 'sDeadline', 'Deadline situation', CRIT4],
    [G[1], 'sRoom', 'Room for manoeuvre', ['high flexibility', 'medium flexibility', 'low flexibility', 'no flexibility']],
    [G[1], 'sChanges', 'Probable need for changes', ['small', 'lower', 'higher', 'high']],
    [G[1], 'sInnovation', 'Level of innovation', ['small', 'lower', 'higher', 'high']],
    [G[1], 'sTechnique', 'Technique or content', ['known', 'probably known', 'probably unknown', 'unknown']],
    [G[2], 'sInternal', 'Internal participants', ['0–3', '4–7', '8–12', 'more than 12']],
    [G[2], 'sExternal', 'External participants', ['0', '1–3', '4–6', 'more than 6']],
    [G[2], 'sLocation', 'Location of the team', ['on site', 'same country', 'within the EU', 'rest of the world']],
    [G[2], 'sContentExp', 'Content experience of the team', EXP],
    [G[2], 'sPmExp', 'PM experience of the team', EXP],
    [G[3], 'sStakeholders', 'Relation to stakeholders', REL],
    [G[3], 'sCustomer', 'Relation to the customer', REL],
  ].map(([group, _id, criterion, opts]) => ({ _id, group, criterion, opts }));
  const SIT_HEAD = ['Uncritical', 'Rather uncritical', 'Rather critical', 'Critical'];

  function sitStats(q) {
    const rows = q.rows('tailorSituation');
    const rated = rows.filter((r) => Number(r.rating) >= 1);
    const crit = rated.filter((r) => Number(r.rating) >= 3);
    const avg = rated.length ? U.sum(rated, (r) => Number(r.rating)) / rated.length : null;
    return { rows, rated, crit, avg };
  }
  function profileText(q) {
    const s = sitStats(q);
    if (!s.rated.length) return '';
    let t = s.avg <= 1.75 ? 'Mostly uncritical' : s.avg <= 2.5 ? 'Mixed' : s.avg <= 3.25 ? 'Rather critical' : 'Critical';
    t += ' (average ' + q.num(s.avg, 1) + ' on a scale of 1 to 4)';
    if (s.crit.length) t += '. Watch: ' + s.crit.map((r) => r.criterion.toLowerCase()).join(', ');
    if (s.rated.length < s.rows.length) t += '. ' + (s.rows.length - s.rated.length) + ' of ' + s.rows.length + ' criteria not rated yet';
    return t;
  }

  function situationProfile(q, pal) {
    const rows = q.rows('tailorSituation');
    const GW = 112;
    const CX = 122;
    const CW = 246;
    const AX = CX + CW + 6;
    const AW = (W - 6 - AX) / 4;
    const y0 = 52;
    const rh = 28;
    const grad = S.uid('sg');
    let body = '<defs><linearGradient id="' + grad + '" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="' + pal.good + '"/><stop offset="0.5" stop-color="' + pal.warn + '"/><stop offset="1" stop-color="' + pal.crit + '"/></linearGradient></defs>';
    // header
    body += S.rect(AX, 4, AW * 4, 32, { fill: 'url(#' + grad + ')', fillOpacity: 0.16, rx: 4 });
    body += S.rect(AX, 38, AW * 4, 5, { fill: 'url(#' + grad + ')', rx: 2.5 });
    SIT_HEAD.forEach((h, j) => (body += S.text(AX + AW * (j + 0.5), 20, h, { size: 12, weight: 600, fill: pal.ink, anchor: 'middle', v: 'middle' })));
    body += S.text(GW / 2, 20, 'Group', { size: 12, weight: 600, fill: pal.ink2, anchor: 'middle', v: 'middle' });
    body += S.text(CX + 4, 20, 'Criterion', { size: 12, weight: 600, fill: pal.ink2, v: 'middle' });
    const yEnd = y0 + rows.length * rh;
    for (let j = 1; j < 4; j++) body += S.line(AX + AW * j, y0, AX + AW * j, yEnd, { stroke: pal.grid });

    // group bands and rows
    let i = 0;
    while (i < rows.length) {
      let k = i;
      while (k < rows.length && rows[k].group === rows[i].group) k++;
      const gy = y0 + i * rh;
      const gh = (k - i) * rh;
      body += S.rect(0, gy + 2, GW, gh - 4, { fill: pal.box, rx: 4 });
      body += linesAt(GW / 2, gy + gh / 2, fitLines(rows[i].group, GW - 12, 3, [12, 11.5, 11], 600), { fill: pal.ink, weight: 600 });
      if (i > 0) body += S.line(CX, gy, W - 6, gy, { stroke: pal.line });
      i = k;
    }
    rows.forEach((r, ri) => {
      const y = y0 + ri * rh;
      if (ri > 0 && rows[ri - 1].group === r.group) body += S.line(CX, y, W - 6, y, { stroke: pal.grid });
      body += linesAt(CX + 4, y + rh / 2, fitLines(r.criterion, CW - 8, 2, [12, 11.5, 11, 10.5], 400), { fill: pal.ink, anchor: 'start' });
    });
    body += S.line(CX, yEnd, W - 6, yEnd, { stroke: pal.line });

    // profile line, broken at unrated rows
    const segs = [];
    let cur = [];
    rows.forEach((r, ri) => {
      const v = Number(r.rating);
      if (v >= 1 && v <= 4) cur.push([AX + AW * (v - 0.5), y0 + ri * rh + rh / 2]);
      else {
        if (cur.length) segs.push(cur);
        cur = [];
      }
    });
    if (cur.length) segs.push(cur);
    segs.filter((sg) => sg.length > 1).forEach((sg) => (body += S.polyline(sg, { stroke: pal.accent, sw: 2 })));

    // answers
    rows.forEach((r, ri) => {
      const cy = y0 + ri * rh + rh / 2;
      const v = Number(r.rating);
      (r.opts || []).forEach((label, j) => {
        const cx = AX + AW * (j + 0.5);
        if (v === j + 1) {
          const tw = Math.min(AW - 8, S.measure(label, 11.5, 600) + 30);
          body += S.rect(cx - tw / 2, cy - 10, tw, 20, { fill: pal.accent, rx: 10 });
          body += S.circle(cx - tw / 2 + 10, cy, 3.5, { fill: pal.accentInk });
          body += S.text(cx + 5, cy, S.fit(label, tw - 26, 11.5, 600), { size: 11.5, weight: 600, fill: pal.accentInk, anchor: 'middle', v: 'middle' });
        } else {
          body += haloText(cx, cy, S.fit(label, AW - 10, 11), { size: 11, fill: pal.muted, anchor: 'middle', v: 'middle' }, pal);
        }
      });
    });

    const s = sitStats(q);
    const foot = s.rated.length
      ? 'Rated: ' + s.rated.length + ' of ' + rows.length + '. Critical answers: ' + s.crit.length + '. ' + profileText(q).split('. ')[0] + '.'
      : 'Rate each criterion in the table above to draw the profile.';
    const fb = S.textBlock(CX, yEnd + 10, foot, { maxW: W - CX - 8, size: 11.5, fill: pal.ink2, maxLines: 2 });
    body += fb.svg;
    return S.svg(W, yEnd + 10 + fb.h + 8, body, { pal, label: 'Situation analysis profile' });
  }

  // ---------- method check and pyramid ----------
  const LEVELS = {
    F: { name: 'Foundation', desc: 'boundaries and context' },
    C: { name: 'Compulsory high-level plan', desc: '"base camp" of every project' },
    O: { name: 'Establishing the organisation', desc: 'roles and how the team works' },
    P: { name: 'Optional detailed planning', desc: 'for complex projects' },
  };
  const METHODS = [
    ['mAssign', 'Project assignment (charter)', 'Project assignment', 'F', 'Foundation', 'Initiation, finalised in the start process', '3.3'],
    ['mStake', 'Stakeholder analysis', 'Stakeholder analysis', 'F', 'Foundation', 'Initiation', '3.4'],
    ['mResults', 'List of deliverables, results plan', 'Results plan', 'C', 'Compulsory (base camp)', 'Initiation', '3.5'],
    ['mWbs', 'Work breakdown structure', 'WBS', 'C', 'Compulsory (base camp)', 'Initiation', '3.5'],
    ['mMiles', 'Milestone plan', 'Milestone plan', 'C', 'Compulsory (base camp)', 'Initiation', '3.5'],
    ['mRes', 'Resource plan', 'Resource plan', 'C', 'Compulsory (base camp)', 'Initiation, detailed in the start process', '3.5, 4.2'],
    ['mCost', 'Cost plan', 'Cost plan', 'C', 'Compulsory (base camp)', 'Initiation, detailed in the start process', '3.5, 4.2'],
    ['mOrg', 'Organisation chart', 'Organisation chart', 'O', 'Organisation', 'Start process', '4.1'],
    ['mRoles', 'Definition of roles', 'Roles', 'O', 'Organisation', 'Start process', '4.1'],

    ['mBar', 'Linked bar chart or network plan', 'Bar chart, network plan', 'P', 'Optional (detailed)', 'Start process', '4.2'],
    ['mRisk', 'Risk analysis, qualitative or quantitative', 'Risk management', 'R', 'All levels, grows with complexity', 'First assessment in initiation, full analysis in the start process', '5'],
    ['mContract', 'Contract analysis', 'Contract analysis', 'X', 'External projects', 'After the project handover', '7'],
    ['mCR', 'Change request process', 'Change request process', 'X', 'Additional', 'Start process', '7'],
    ['mMarketing', 'Project marketing', 'Project marketing', 'X', 'Additional', 'Start process', ''],
  ].map(([_id, method, short, lvl, level, timing, section]) => ({ _id, method, short, lvl, level, timing, section }));
  const DECISIONS = ['Already exists', 'Initiation process', 'Start process', 'Not required'];
  const TAGS = { 'Already exists': 'E', 'Initiation process': 'I', 'Start process': 'S' };

  function decisionStyle(dec, pal) {
    if (dec === 'Not required') return { fill: pal.bg, stroke: pal.muted, dash: '3 3', ink: pal.muted, strike: true };
    if (TAGS[dec]) return { fill: pal.accent, stroke: pal.accent, ink: pal.accentInk, tag: TAGS[dec] };
    return { fill: pal.bg, stroke: pal.accent, sw: 1.3, ink: pal.ink };
  }
  const CHIP_H = 22;
  const chipW = (label) => S.measure(label, 11.5, 600) + 34;
  function chip(x, y, label, st) {
    const w = chipW(label);
    let out = S.rect(x, y, w, CHIP_H, { fill: st.fill, stroke: st.stroke, sw: st.sw || 1, dash: st.dash, rx: CHIP_H / 2 });
    const tx = x + 10 + (w - 34) / 2;
    out += S.text(tx, y + CHIP_H / 2, label, { size: 11.5, weight: 600, fill: st.ink, anchor: 'middle', v: 'middle' });
    if (st.strike) out += S.line(x + 8, y + CHIP_H / 2, x + w - 22, y + CHIP_H / 2, { stroke: st.ink, sw: 1.2 });
    if (st.tag) out += S.text(x + w - 13, y + CHIP_H / 2, st.tag, { size: 9.5, weight: 700, family: 'mono', fill: st.ink, anchor: 'middle', v: 'middle' });
    return out;
  }

  function methodPyramid(q, pal) {
    const dec = {};
    q.rows('methodCheck').forEach((r) => (dec[r._id] = r.decision));
    const cx = 380;
    const HT = 84;
    const HB = 330;
    const TOP = 40;
    const bands = [['P', 72], ['O', 100], ['C', 76], ['F', 62]];
    const H = bands.reduce((a, b) => a + b[1], 0);
    const base = TOP + H;
    const hw = (y) => HT + ((HB - HT) * (y - TOP)) / H;
    const inset = 12;
    let body = '';

    // risk band along the left side
    const risk = METHODS.find((m) => m.lvl === 'R');
    const rs = decisionStyle(dec[risk._id], pal);
    const A = [cx - HB, base];
    const B = [cx - HT, TOP];
    const len = Math.hypot(B[0] - A[0], B[1] - A[1]);
    const n = [-(A[1] - B[1]) / len, -(B[0] - A[0]) / len];
    const off = (p, d) => [p[0] + n[0] * d, p[1] + n[1] * d];
    const g = 8;
    const bw = 24;
    body += S.path('M' + [off(A, g), off(B, g), off(B, g + bw), off(A, g + bw)].map((p) => r1(p[0]) + ',' + r1(p[1])).join(' L') + ' Z', { fill: rs.fill, stroke: rs.stroke, sw: rs.sw || 1, dash: rs.dash, join: 'round' });
    const mid = off([(A[0] + B[0]) / 2, (A[1] + B[1]) / 2], g + bw / 2);
    const ang = (Math.atan2(B[1] - A[1], B[0] - A[0]) * 180) / Math.PI;
    const rLabel = 'Risk management grows with complexity' + (rs.tag ? ' · ' + rs.tag : '');
    body += rotText(mid[0], mid[1], ang, rLabel, { size: 11.5, weight: 600, fill: rs.ink, anchor: 'middle', v: 'middle' });
    if (rs.strike) {
      const half = S.measure(rLabel, 11.5, 600) / 2;
      body += '<g transform="rotate(' + r1(ang) + ' ' + r1(mid[0]) + ' ' + r1(mid[1]) + ')">' + S.line(mid[0] - half, mid[1], mid[0] + half, mid[1], { stroke: rs.ink, sw: 1.2 }) + '</g>';
    }

    // summit flag
    body += S.line(cx, TOP, cx, TOP - 30, { stroke: pal.ink2, sw: 1.5 });
    body += S.poly([[cx, TOP - 30], [cx + 20, TOP - 24], [cx, TOP - 18]], { fill: pal.accent });

    // levels
    let y = TOP;
    bands.forEach(([lv, bh]) => {
      const y1 = y + bh;
      body += S.poly([[cx - hw(y), y], [cx + hw(y), y], [cx + hw(y1), y1], [cx - hw(y1), y1]], { fill: pal.box, stroke: pal.boxLine });
      const items = METHODS.filter((m) => m.lvl === lv);
      // lay out chips in rows; the band is narrowest at the top, so each row is checked at its top edge
      const layout = (pad) => {
        const rows = [];
        let ry = y + pad;
        let row = [];
        let rowW = 0;
        items.forEach((m) => {
          const w = chipW(m.short);
          const avail = 2 * (hw(ry) - inset);
          if (row.length && rowW + 8 + w > avail) {
            rows.push({ y: ry, items: row, w: rowW });
            ry += CHIP_H + 6;
            row = [];
            rowW = 0;
          }
          rowW += (row.length ? 8 : 0) + w;
          row.push(m);
        });
        if (row.length) rows.push({ y: ry, items: row, w: rowW });
        return rows;
      };
      let rows = layout(8);
      const blockH = rows.length * CHIP_H + (rows.length - 1) * 6;
      rows = layout(Math.max(6, (bh - blockH) / 2));
      rows.forEach((rw) => {
        let x = cx - rw.w / 2;
        rw.items.forEach((m) => {
          body += chip(x, rw.y, m.short, decisionStyle(dec[m._id], pal));
          x += chipW(m.short) + 8;
        });
      });
      // level label on the right
      const ym = y + bh / 2;
      const used = items.filter((m) => TAGS[dec[m._id]]).length;
      const no = items.filter((m) => dec[m._id] === 'Not required').length;
      const count = used + ' of ' + items.length + ' used' + (no ? ', ' + no + ' not required' : '');
      body += S.line(cx + hw(ym) + 6, ym, 726, ym, { stroke: pal.line, dash: '2 3' });
      body += S.text(734, ym - 19, LEVELS[lv].name, { size: 12.5, weight: 600, fill: pal.ink });
      body += S.text(734, ym - 2, LEVELS[lv].desc, { size: 11, fill: pal.muted });
      body += S.text(734, ym + 13, count, { size: 11, fill: pal.ink2 });
      y = y1;
    });

    // additional methods
    const yA = base + 18;
    body += S.text(50, yA + CHIP_H / 2, 'Additional methods', { size: 12, weight: 600, fill: pal.ink2, v: 'middle' });
    let ax = 50 + S.measure('Additional methods', 12, 600) + 14;
    METHODS.filter((m) => m.lvl === 'X').forEach((m) => {
      body += chip(ax, yA, m.short, decisionStyle(dec[m._id], pal));
      ax += chipW(m.short) + 8;
    });

    const sw = (st) => (x, cy) => S.rect(x, cy - 7, 26, 14, { fill: st.fill, stroke: st.stroke, sw: st.sw || 1, dash: st.dash, rx: 7 }) + (st.strike ? S.line(x + 5, cy, x + 21, cy, { stroke: st.ink, sw: 1.2 }) : '');
    const lg = legendRow(
      [
        { label: 'Used (I initiation, S start, E already exists)', sw: 26, swatch: sw(decisionStyle('Start process', pal)) },
        { label: 'Not decided yet', sw: 26, swatch: sw(decisionStyle('', pal)) },
        { label: 'Not required', sw: 26, swatch: sw(decisionStyle('Not required', pal)) },
      ],
      50, yA + CHIP_H + 14, W - 60, pal
    );
    body += lg.svg;
    return S.svg(W, yA + CHIP_H + 14 + lg.h + 8, body, { pal, label: 'Method pyramid' });
  }
  PM.graphics.methodPyramid = methodPyramid;

  // ---------- planning navigator ----------
  const NAV_ROWS = [
    { _id: 'ini', phase: 'Initiation' },

  const NAV_PH = {
    ini: { steps: 'e.g. I1–I3 in one-to-one talks, I4 in a planning workshop, I5 in a PO meeting', content: 'e.g. none, or 1.2 Analysis', deliverables: 'e.g. preliminary charter, milestone plan, rough budget', methods: 'e.g. stakeholder analysis, WBS, milestone plan' },
    start: { steps: 'e.g. kick-off and start workshop (S1–S2), follow-up workshop (S3), PO meeting (S5)', content: 'e.g. 1.2 Concept', deliverables: 'e.g. final charter, PM plan 1.0, project organisation', methods: 'e.g. RACI chart, WP specifications, risk analysis' },
  };

  function phaseZone(q) {
    const nav = {};
    q.rows('tailorNavigator').forEach((r) => (nav[r._id] = String(r.content || '').toLowerCase()));
    const hit = (t, p) => {
      if (!t) return false;
      const code = String(p.code || '').trim();
      const name = String(p.name || '').trim().toLowerCase();
      if (code && new RegExp('(^|[^\\d.])' + code.replace(/\./g, '\\.') + '(?!\\.?\\d)').test(t)) return true;
      return name.length > 2 && t.includes(name);
    };
    return q
      .phases()
      .filter((p) => p.kind !== 'PM phase')
      .map((p) => ({ p, zone: hit(nav.ini, p) ? 'I' : hit(nav.start, p) ? 'S' : 'M' }));
  }

  function navigator(q, pal) {
    const LBL = 148;
    const X0 = 158;
    const X1 = W - 8;
    const Z = { I: [X0, X0 + 250], S: [X0 + 250, X0 + 500], M: [X0 + 500, X1] };
    const tip = 8;
    const kind = q.f('meta.kind');
    const st = {};
    q.rows('steps').forEach((r) => (st[r._id] = r.status));
    const cs = {};
    q.rows('contractSteps').forEach((r) => (cs[r._id] = r.status));
    let body = '';

    [['Initiation', 'I'], ['Start', 'S'], ['Implementation', 'M']].forEach(([t, z]) => {
      body += S.rect(Z[z][0] + 1, 0, Z[z][1] - Z[z][0] - 2, 26, { fill: pal.box, rx: 4 });
      body += S.text((Z[z][0] + Z[z][1]) / 2, 13, t, { size: 13, weight: 600, fill: pal.ink, anchor: 'middle', v: 'middle' });
    });

    const lanes = [
      { key: 'pm', name: 'Project management', sub: 'process', h: 34 },
      { key: 'plan', name: 'Planning process', sub: 'the ten steps', h: 34 },
      { key: 'content', name: 'Content process', sub: 'phases of the project', h: 56 },
      { key: 'contract', name: 'Contract process', sub: 'customer projects', h: 40 },
      { key: 'team', name: 'Team process', sub: 'how the team grows', h: 34 },
    ];
    let y = 38;
    const box = (x, yy, w, h, label, o) => {
      o = o || {};
      const s = o.style || { fill: pal.box, stroke: pal.boxLine, ink: pal.ink };
      let out = chev(x + 1, yy, w - 3, h, !!o.first, tip, s);
      if (label) {
        const fit = fitLines(label, w - tip - 8, o.lines || 2, [11, 10.5, 10], 600);
        out += linesAt(x + 1 + (w - 3) / 2 - (o.first ? tip / 2 : 0), yy + h / 2, fit, { fill: s.ink, weight: 600, italic: o.italic });
      }
      return out;
    };
    const note = (z, yy, h, text) => S.text(Z[z][0] + 10, yy + h / 2, S.fit(text, Z[z][1] - Z[z][0] - 20, 11), { size: 11, fill: pal.muted, italic: true, v: 'middle' });
    const splitZone = (z, parts) => {
      const [a, b] = Z[z];
      const tot = parts.reduce((s, p) => s + p, 0);
      let x = a;
      return parts.map((p) => {
        const w = ((b - a) * p) / tot;
        const out = [x, w];
        x += w;
        return out;
      });
    };

    lanes.forEach((ln, li) => {
      const h = ln.h;
      if (li > 0) body += S.line(0, y - 6, X1, y - 6, { stroke: pal.grid });
      body += S.text(0, y + h / 2 - 7, ln.name, { size: 12, weight: 600, fill: pal.ink, v: 'middle' });
      body += S.text(0, y + h / 2 + 8, ln.sub, { size: 10.5, fill: pal.muted, v: 'middle' });
      if (ln.key === 'pm') {
        const acc = { fill: pal.accent, stroke: pal.accent, ink: pal.accentInk };
        body += box(Z.I[0], y, Z.I[1] - Z.I[0], h, 'Initiation', { first: true, style: acc });
        body += box(Z.S[0], y, Z.S[1] - Z.S[0], h, 'Start', { style: acc });
        body += box(Z.M[0], y, Z.M[1] - Z.M[0], h, 'Implementation and control', { style: acc });
        [Z.S[0], Z.M[0]].forEach((x) => (body += S.diamond(x, y + h / 2, 8, { fill: pal.mile, stroke: pal.bg, sw: 1.5 })));
      } else if (ln.key === 'plan') {
        PM.PROCESS.forEach((p, i) => {
          const z = i < 5 ? 'I' : 'S';
          const w = (Z[z][1] - Z[z][0]) / 5;
          const x = Z[z][0] + (i % 5) * w;
          const s = statusStyle(st[p.id], pal);
          body += chev(x + 1, y, w - 3, h, i === 0, tip, s);
          body += S.text(x + 1 + (w - 3) / 2 - (i === 0 ? tip / 2 : 0), y + h / 2, p.id, { size: 11.5, weight: 700, family: 'mono', fill: s.ink, anchor: 'middle', v: 'middle' });
        });
        body += note('M', y, h, 'Plans kept up to date while controlling');
      } else if (ln.key === 'content') {
        const pz = phaseZone(q);
        ['I', 'S', 'M'].forEach((z) => {
          const list = pz.filter((e) => e.zone === z);
          if (!list.length) {
            body += note(z, y, h, z === 'M' ? 'Add phases to the WBS' : 'No content work yet');
            return;
          }
          const parts = splitZone(z, list.map(() => 1));
          list.forEach((e, k) => {
            const [x, w] = parts[k];
            const ph = q.isPlaceholder(e.p, 'name');
            const nm = q.label(e.p, 'name');
            const s = { fill: pal.box, stroke: pal.boxLine, ink: ph ? pal.muted : pal.ink };
            body += chev(x + 1, y, w - 3, h, false, tip, s);
            const cxm = x + 1 + (w - 3) / 2;
            if (w < 64 || !nm) {
              body += S.text(cxm, y + h / 2, e.p.code, { size: 11, weight: 700, family: 'mono', fill: s.ink, anchor: 'middle', v: 'middle' });
            } else {
              body += S.text(cxm, y + 5, e.p.code, { size: 10.5, weight: 700, family: 'mono', fill: s.ink, anchor: 'middle', v: 'top' });
              const fit = fitLines(nm, w - tip - 6, 3, [10.5, 10, 9.5], 400);
              body += linesAt(cxm, y + 17 + (h - 17) / 2, fit, { fill: s.ink, italic: ph });
            }
          });
        });
      } else if (ln.key === 'contract') {
        if (kind && kind !== EXT) {
          body += S.rect(X0 + 1, y, X1 - X0 - 2, h, { fill: 'none', stroke: pal.boxLine, dash: '4 3', rx: 6 });
          body += S.text((X0 + X1) / 2, y + h / 2, 'Not applicable: ' + kind.toLowerCase() + ', no customer contract', { size: 11.5, fill: pal.muted, italic: true, anchor: 'middle', v: 'middle' });
        } else {
          const ext = kind === EXT;
          const sty = (id) => (ext ? statusStyle(cs[id], pal) : { fill: pal.bg, stroke: pal.boxLine, ink: pal.muted, dash: '4 3' });
          const ip = splitZone('I', [1, 1, 1]);
          const sp = splitZone('S', [1.2, 2.8]);
          [['acq', 'Acquisition'], ['offer', 'Offer'], ['nego', 'Negotiation']].forEach(([id, t], k) => (body += box(ip[k][0], y, ip[k][1], h, t, { first: k === 0, style: sty(id) })));
          [['handover', 'Handover'], ['analysis', 'Contract analysis and detailed planning']].forEach(([id, t], k) => (body += box(sp[k][0], y, sp[k][1], h, t, { style: sty(id) })));
          body += box(Z.M[0], y, Z.M[1] - Z.M[0], h, 'Change requests and claims', { style: ext ? statusStyle('', pal) : sty('') });
        }
      } else if (ln.key === 'team') {
        body += note('I', y, h, 'PO, PM and designated core team');
        const sp = splitZone('S', [1, 1]);
        const mp = splitZone('M', [1, 1, 1]);
        [['Forming', sp[0]], ['Storming', sp[1]], ['Norming', mp[0]], ['Performing', mp[1]], ['Adjourning', mp[2]]].forEach(([t, [x, w]]) => (body += box(x, y, w, h, t)));
      }
      y += h + 12;
    });
    // zone dividers on top of the lanes, between the chevrons
    [Z.S[0], Z.M[0]].forEach((x) => (body += S.line(x, 28, x, 36, { stroke: pal.line })));

    const lg = legendRow(
      statusLegend(pal, ['Done', 'In progress', 'Not started', 'Skipped']).concat([
        { label: 'Approval: charter released, PM plan approved', swatch: (x, cy) => S.diamond(x + 7, cy, 7, { fill: pal.mile }) },
      ]),
      0, y, W, pal
    );
    body += lg.svg;
    return S.svg(W, y + lg.h + 6, body, { pal, label: 'Planning navigator' });
  }

<script>
/* js/zip.js */
/* PM Steps Workbook: minimal ZIP writer for the Word and Excel export.
 *
 *   PMZip.zip([[name, Uint8Array | string], ...], {store}) -> Uint8Array
 *
 * Strings are written as UTF-8. Names are UTF-8 (general purpose flag bit 11). Each entry is
 * compressed with raw DEFLATE (fixed Huffman codes, LZ77 with a 32 KB window) when that makes it
 * smaller, otherwise stored. Already compressed data (PNG, JPEG, ZIP) is always stored.
 * `{store: true}` stores every entry. No ZIP64: the export stays far below 4 GB.
 * Runs in the browser and in Node (no DOM or Node APIs used).

(function (root) {
  'use strict';

  // ---------- CRC-32 (IEEE 802.3, reflected, polynomial 0xEDB88320) ----------
  const CRC_TABLE = (function () {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;

  const DIST_BASE = [1, 2, 3, 4, 5, 7, 9, 13, 17, 25, 33, 49, 65, 97, 129, 193, 257, 385, 513, 769, 1025, 1537, 2049, 3073, 4097, 6145, 8193, 12289, 16385, 24577];

      let bestLen = 0;
      let bestDist = 0;

        let cand = head[hash(i)];
        let chain = MAX_CHAIN;
        const maxLen = Math.min(258, n - i);

            let l = 0;

              bestDist = i - cand;
              if (l >= NICE || l === maxLen) break;

          const p = prev[cand & (WSIZE - 1)];
          if (p >= cand) break;

        const di = distIndex(bestDist);
        bits(DIST_CODE[di], 5);
        if (DIST_EXTRA[di]) bits(bestDist - DIST_BASE[di], DIST_EXTRA[di]);

        for (; i < end; i++) if (i + 2 < n) insert(i);

        lit(src[i]);

      u16(20); // version needed: 2.0
      u16(FLAGS);
      u16(e.method);
      u16(when.time);
      u16(when.date);
      u32(e.crc);
      u32(e.data.length);
      u32(e.size);
      u16(e.nameBytes.length);

      u16(20); // version needed
      u16(FLAGS);
      u16(e.method);
      u16(when.time);
      u16(when.date);
      u32(e.crc);
      u32(e.data.length);
      u32(e.size);
      u16(e.nameBytes.length);

      u16(0); // comment
      u16(0); // disk number start
      u16(0); // internal attributes

/* PM Steps Workbook: Word (.docx) writer.
 *
 *   PMDocx.build(blocks, {title, author}) -> Uint8Array
 *
 * Turns the neutral block list from PM.export.model() (see docs/EXPORT-MODEL.md) into a WordprocessingML
 * package: A4 pages with 2 cm margins, Calibri 10 pt, teal headings with outline levels (so the
 * table of contents works), tables with a repeated shaded header row, inline PNG graphics scaled to the
 * text width, bullet and numbered lists, a real TOC field, portrait/landscape sections, the project
 * title in the header and "Page X of Y" in the footer. Needs js/zip.js (window.PMZip).
 */
(function (root) {
  'use strict';

  const NS_R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const NS_WP = 'http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing';
  const NS_A = 'http://schemas.openxmlformats.org/drawingml/2006/main';
  const NS_PIC = 'http://schemas.openxmlformats.org/drawingml/2006/picture';
  const REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';

  // Page geometry in twips (dxa). A4, 2 cm margins.
  const PAGE = { portrait: { w: 11906, h: 16838 }, landscape: { w: 16838, h: 11906 } };
  const MAR = { top: 1134, right: 1134, bottom: 1134, left: 1134, header: 567, footer: 567 };
  const EMU_PER_DXA = 635;
  const textWidth = (o) => PAGE[o].w - MAR.left - MAR.right;
  const textHeight = (o) => PAGE[o].h - MAR.top - MAR.bottom;

  const C = {
    teal: '0B6E63',
    ink: '1F2A2E',
    ink2: '33474B',
    muted: '5B6B70',
    line: 'B4C2C0',
    lineStrong: '7F9C98',
    head: 'DCEEEB',
    kv: 'EEF3F2',
    foot: 'EEF2F1',
    note: 'A9D4CE',

  const MONO = 'Consolas';

      .filter((k) => o[k] != null)

  /** Run properties in schema order (rStyle, rFonts, b, bCs, i, iCs, color, sz, szCs). */

    if (o.tabs) x += '<w:tabs>' + o.tabs.map((t) => '<w:tab w:val="' + (t.val || 'left') + '" w:pos="' + t.pos + '"/>').join('') + '</w:tabs>';
    if (o.spacing) x += '<w:spacing' + attrs(o.spacing) + '/>';
    if (o.ind) x += '<w:ind' + attrs(o.ind) + '/>';
    if (o.jc) x += '<w:jc w:val="' + o.jc + '"/>';
    if (o.markSize) x += '<w:rPr><w:sz w:val="' + o.markSize + '"/><w:szCs w:val="' + o.markSize + '"/></w:rPr>';
    return x;
  }
  const serP = (p) => '<w:p>' + (p.ppr || p.sect ? '<w:pPr>' + p.ppr + (p.sect || '') + '</w:pPr>' : '') + p.body + '</w:p>';

  // ---------- helpers ----------
  function toBytes(v) {
    if (!v) return null;
    if (v instanceof Uint8Array) return v;
    if (v instanceof ArrayBuffer) return new Uint8Array(v);
    if (ArrayBuffer.isView(v)) return new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
    if (Array.isArray(v)) return Uint8Array.from(v);
