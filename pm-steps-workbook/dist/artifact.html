          const early = res.order.filter((x) => x.gap != null && x.gap < 0);
          out.push(early.length
            ? { ok: false, text: 'Planned to start before the earliest possible start: ' + list(early.map((x) => x.code + ' (' + Math.abs(x.gap) + ' d early)')) + '.' }
            : { ok: true, text: 'No work package is planned to start before its predecessors allow.' });
          const missed = res.order.filter((x) => x.fixed && x.driven > U.diffDays(res.start0, x.fixed));
          if (missed.length) out.push({ ok: false, text: 'Fixed start cannot be met: ' + list(missed.map((x) => x.code + ' (earliest ' + short(U.addDays(res.start0, x.driven)) + ')')) + '.' });
          const endB = q.f('time.endDate');
          const cp = res.order.filter((x) => x.critical).map((x) => x.code);
          if (res.endDate && U.isDate(endB)) {
            const diff = U.diffDays(res.endDate, endB);
            out.push(diff >= 0
              ? { ok: true, text: 'Critical path ' + res.end + ' days (' + list(cp, 14) + '), ends ' + short(res.endDate) + ': ' + diff + ' days before the end date.' }
              : { ok: false, text: 'Critical path ' + res.end + ' days ends ' + short(res.endDate) + ', ' + -diff + ' days after the end date (' + short(endB) + '). Shorten it or move the end date.' });
          } else {
            out.push({ ok: null, text: 'Critical path: ' + res.end + ' days. Set an end date in the time boundaries to compare.' });
          }
          const ongoing = res.order.filter((x) => x.critical && res.end > 20 && x.dur >= 0.6 * res.end);
          if (ongoing.length) out.push({ ok: null, text: list(ongoing.map((x) => x.code)) + ' run for most of the project and set its end. Ongoing work like coordinating or controlling is usually left out of the network (field above).' });
          return out;
        },
      },
      {
        type: 'graphic',
        title: 'Linked bar chart',
        caption: 'Bars at the planned dates. Each arrow runs from the end (FS, FF) or start (SS, SF) of the predecessor to the start (FS, SS) or end (FF, SF) of the successor. The critical path and its links are drawn in red.',
        empty: (q) => {
          const res = cpm(q);
          return res.order.some((x) => U.isDate(x.d.start) || x.esDate) ? null : 'Add dates or duration estimates to the work packages to see the linked bar chart.';
        },
        render: drawLinked,
      },
      {
        type: 'graphic',
        title: 'Network diagram',
        caption: 'Work packages in columns by their position in the chain. Each box: WBS code and responsible person, name, duration with the earliest dates, then the six values. Red boxes and arrows form the critical path. Wide diagrams scroll sideways.',
        empty: (q) => (cpm(q).order.length ? null : 'Add dates or duration estimates and predecessors to the work packages to see the network diagram.'),
        render: drawNetwork,
      },
    ],
  });

  // =====================================================================================
  // Metrics
  // =====================================================================================
  PM.metric('milestones', {
    label: 'Milestones',
    kind: 'number',
    section: 'schedule',
    fn: (q) => q.rows('milestones').filter((m) => !U.isEmpty(m.name) || U.isDate(m.baseline)).length,
  });
  PM.metric('criticalPathDays', {
    label: 'Critical path',
    kind: 'number',
    unit: 'days',
    section: 'network',
    fn: (q) => {
      const res = cpm(q);
      return res.order.length ? res.end : null;
    },
  });

  // =====================================================================================
  // Example: Summer Festival 2026
  // =====================================================================================
  const E = (method, opt, real, pess, basis, amount, prod) => ({ method, opt, real, pess, basis, amount: amount || null, prod: prod || null });
  PM.example({
    f: { 'sched.cpmExclude': '1.1.2, 1.1.3' },
    x: {
      schedTools: {
        ms: { used: 'Yes', readers: 'Sponsor, steering committee, whole team' },
        list: { used: 'Yes', readers: 'Core team (weekly meeting)' },
        bar: { used: 'Yes', readers: 'Core team, work package owners' },
        linked: { used: 'Yes', readers: 'Project manager, core team' },
        net: { used: 'Later', readers: 'Project manager (critical path check)' },
      },
      schedDependencyTypes: { FS: { used: true }, SS: { used: true }, FF: { used: false }, SF: { used: false } },
      schedEstimates: {
        w111: E('Intuitive', 8, 12, 16, 'Charter, kick-off and start workshop in the first two weeks'),
        w112: E('Analogous', 140, 152, 160, 'Runs alongside the project until the evaluation'),
        w113: E('Analogous', 140, 152, 160, 'Reports every four weeks until the evaluation'),
        w114: E('Analogous', 10, 12, 20, 'Closure report and lessons learned, as for the 2024 event'),
        w121: E('Analogous', 10, 12, 18, 'Online survey open for 10 days, as for the last staff survey'),
        w122: E('Intuitive', 14, 19, 28, 'Two concept workshops plus write-up; depends on the survey results'),
        w123: E('Intuitive', 3, 5, 10, 'One sponsor meeting; a second one if changes are needed'),
        w131: E('Analogous', 10, 12, 21, 'Three venue visits and contract; 2024 took 12 days'),
        w132: E('Analogous', 20, 26, 35, 'Tender to three caterers, tasting, contract'),
        w133: E('Intuitive', 35, 47, 60, 'Artists book 6 to 8 weeks ahead'),
        w134: E('Analogous', 45, 54, 70, 'Authority needs about 6 weeks for the safety approval'),
        w135: E('Intuitive', 45, 60, 75, 'Talks with five possible sponsors'),
        w141: E('Analogous', 10, 12, 15, 'Agency briefing, two design rounds'),
        w142: E('Analogous', 40, 47, 55, 'Invitation, two reminders, intranet posts'),
        w143: E('Analytical', 45, 54, 60, '400 guests, about 8 registrations handled per day', 400, 8),
        w151: E('Analytical', 4, 5, 7, '40 stands and tents, a crew of four sets up about 8 per day', 40, 8),
        w152: E('Intuitive', 1, 1, 1, 'The festival day itself'),
        w153: E('Analytical', 2, 3, 4, '40 stands and tents, about 15 taken down per day', 40, 15),
        w161: E('Analogous', 10, 12, 14, 'Online feedback survey open for 10 days'),
        w162: E('Intuitive', 8, 12, 18, 'Report starts while the survey is still open'),
        w163: E('Analytical', 12, 17, 24, 'About 60 invoices, 4 checked and paid per day', 60, 4),
      },
    },
  });
})();

</script>
<script>
/* js/sections/resources-costs.js */
/* Framework 3.5 (resources and costs) and 4.2 (detailed resources and costs over time): one cost plan, its summaries, histograms, cost curve and payments. */
(function () {
  'use strict';
  const S = PM.svg;
  const U = PM.util;

  const W = 960; // width of the drawings in section 3.5
  const WL = 1000; // width of the drawings in section 4.2 (landscape)
  const PAD = 16;

  const COST_TYPES = ['Staff', 'External labour', 'Material or investment', 'Other'];
  const UNITS = ['PD', 'hours', 'pieces', 't', 'other'];
  const PD_PER = { PD: 1, hours: 1 / 8 };
  const RUNNING = ['Implementation', 'Closing', 'Closed'];

  // =====================================================================================
  // Helpers
  // =====================================================================================
  function num(v) {
    const x = U.num(v);
    return x == null || !isFinite(x) ? null : x;
  }
  const lc = (s) => String(s || '').trim().toLowerCase();
  const pdText = (v) => (v == null ? '—' : U.fmtNum(Math.round(v * 10) / 10, Math.abs(v - Math.round(v)) < 0.05 ? 0 : 1));
  const moneyText = (q, v) => (v == null ? '—' : q.money(Math.round(v)));
  const pctText = (d) => (d >= 0 ? '+' : '−') + U.fmtNum(Math.abs(d), 0) + '%';
  const nsum = (a, b) => (a == null ? b : b == null ? a : a + b);

  /** Resource types by lower-case name, memoized per q. */
  const RT_MEMO = new WeakMap();
  function rtMap(q) {
    let m = RT_MEMO.get(q);
    if (m) return m;
    m = new Map();
    q.rows('resTypes').forEach((r, i) => {
      const name = String(r.name || '').trim();
      if (!name || m.has(lc(name))) return;
      const unit = r.unit || 'PD';
      m.set(lc(name), { id: r._id, idx: i, name, unit, rate: num(r.rate), cap: num(r.capacity), from: r.from || 'Internal', pdu: PD_PER[unit] || 0 });
    });
    RT_MEMO.set(q, m);
    return m;
  }
  const rtOf = (row, q) => (row && row.res ? rtMap(q).get(lc(row.res)) || null : null);
  const isCostType = (res) => COST_TYPES.indexOf(String(res || '').trim()) >= 0;

  /** Project cost type of a cost plan line. */
  function lineCostType(row, q) {
    const rt = rtOf(row, q);
    if (rt) return rt.pdu ? (rt.from === 'External' ? 'External labour' : 'Staff') : 'Material or investment';
    const t = String(row.res || '').trim();
    return isCostType(t) ? t : '';
  }

  function planOf(r, q) {
    const rate = r.rateEff;
    const qty = num(r.qty);
    if (rate == null) return null;
    if (rtOf(r, q)) return qty == null ? null : qty * rate;
    return (qty == null ? 1 : qty) * rate;
  }
  function forecastOf(r) {
    const a = num(r.actual);
    const rem = num(r.remaining);
    if (a == null && rem == null) return r.plan;
    return (a || 0) + (rem || 0);
  }

  /** The level-2 line (phase) a WBS line belongs to; the line itself for phases and the project. */
  function phaseOf(q, w) {
    if (!w || !w.code) return w || null;
    if (U.codeLevel(w.code) <= 2) return w;
    const parts = String(w.code).split('.');
    return q.wbsByCode(parts.slice(0, 2).join('.')) || w;
  }

  // =====================================================================================
  // Model: one memoized view of the cost plan per q
  // =====================================================================================
  const MEMO = new WeakMap();
  function model(q) {
    let m = MEMO.get(q);
    if (!m) {
      m = buildModel(q);
      MEMO.set(q, m);
    }
    return m;
  }

  function buildModel(q) {
    const rts = Array.from(rtMap(q).values());
    const pdTypes = rts.filter((t) => t.pdu);
    const lines = q.rows('costPlan').map((r) => {
      const rt = rtOf(r, q);
      const w = r.wbs ? q.wbsRow(r.wbs) : null;
      const plan = r.plan || 0;
      const actual = num(r.actual);
      const remaining = num(r.remaining);
      const L = { row: r, rt, w, ctype: r.ctype || '', plan, actual, remaining, forecast: r.forecast == null ? plan : r.forecast, dev: r.dev || 0, pd: null };
      if (rt && rt.pdu) {
        const qty = num(r.qty);
        const rate = r.rateEff;
        const toPd = (v) => (v == null || !rate ? null : (v / rate) * rt.pdu);
        const pPlan = qty == null ? 0 : qty * rt.pdu;
        const pFc = actual == null && remaining == null ? pPlan : rate ? (((actual || 0) + (remaining || 0)) / rate) * rt.pdu : null;
        L.pd = { plan: pPlan, actual: toPd(actual), remaining: toPd(remaining), forecast: pFc, dev: pFc == null ? null : pFc - pPlan };
      }
      const d = w ? q.dates(w._id) : null;
      L.start = d && U.isDate(d.start) ? d.start : '';
      L.end = d && U.isDate(d.end) ? d.end : '';
      L.dated = !!(L.start && L.end && L.end >= L.start);
      L.active = !!(L.ctype && (plan || actual || remaining || (L.pd && L.pd.plan)));
      return L;
    });
    const active = lines.filter((l) => l.active);
    const byType = {};
    COST_TYPES.forEach((t) => (byType[t] = 0));
    active.forEach((l) => (byType[l.ctype] += l.plan));
    const totalPlan = U.sum(active, (l) => l.plan);
    const totalPD = U.sum(active, (l) => (l.pd ? l.pd.plan : 0));

    // spread over the months of the schedule
    const pd0 = q.projectDates();
    const dated = active.filter((l) => l.dated);
    const start = U.minDate(dated.map((l) => l.start).concat([pd0.start || '']));
    const end = U.maxDate(dated.map((l) => l.end).concat([pd0.end || '']));
    const months = start && end && end >= start ? U.months(start, end) : [];
    const zeros = () => months.map(() => 0);
    const cost = {};
    const costND = {};
    COST_TYPES.forEach((t) => {
      cost[t] = zeros();
      costND[t] = 0;
    });
    const pd = {};
    const pdND = {};
    pdTypes.forEach((t) => {
      pd[t.name] = zeros();
      pdND[t.name] = 0;
    });
    for (const l of active) {
      if (!l.dated || !months.length) {
        costND[l.ctype] += l.plan;
        if (l.pd) pdND[l.rt.name] += l.pd.plan;
        continue;
      }
      const n = U.diffDays(l.start, l.end) + 1;
      months.forEach((ym, i) => {
        const od = U.overlapDays(l.start, l.end, U.monthStart(ym), U.monthEnd(ym));
        if (!od) return;
        const share = od / n;
        cost[l.ctype][i] += l.plan * share;
        if (l.pd) pd[l.rt.name][i] += l.pd.plan * share;
      });
    }
    return { rts, pdTypes, lines, active, byType, totalPlan, totalPD, start, end, months, cost, costND, pd, pdND };
  }

  /** Colour slots for the resource types with a time unit (fixed order, at most 8). */
  function pdSlots(m, pal) {
    const many = m.pdTypes.length > 8;
    const slots = [];
    const idx = new Map();
    m.pdTypes.forEach((t, i) => {
      const s = many && i >= 7 ? 7 : i;
      if (!slots[s]) slots[s] = { label: many && i >= 7 ? 'Other types' : t.name, color: pal.series[s] };
      idx.set(t.name, s);
    });
    return { slots, idx };
  }
  const costSlots = (pal) => COST_TYPES.map((t, i) => ({ label: t, color: pal.series[i] }));

  /**
   * Group lines by phase (or by their own WBS line) and colour slot.
   * Returns rows [{w, vals, total, head, indent, sub}] sorted by WBS code; in WBS mode a head row per phase.
   */
  function groupRows(q, lines, nSlots, slotOf, valOf, byWp) {
    const groups = new Map();
    for (const l of lines) {
      const v = valOf(l);
      if (!v) continue;
      const s = slotOf(l);
      if (s == null || s < 0) continue;
      const w = byWp ? l.w : phaseOf(q, l.w);
      const k = w ? w._id : '_none';
      if (!groups.has(k)) groups.set(k, { w, vals: new Array(nSlots).fill(0), total: 0 });
      const g = groups.get(k);
      g.vals[s] += v;
      g.total += v;
    }
    const list = Array.from(groups.values()).sort((a, b) => (a.w ? 0 : 1) - (b.w ? 0 : 1) || U.codeCmp(a.w ? a.w.code : '', b.w ? b.w.code : ''));
    if (!byWp) return list;
    const out = [];
    let cur = null;
    for (const g of list) {
      const ph = g.w ? phaseOf(q, g.w) : null;
      const inPhase = ph && U.codeLevel(ph.code) === 2;
      if (inPhase && (!cur || cur.w !== ph)) {
        cur = { head: true, w: ph, total: 0 };
        out.push(cur);
      } else if (!inPhase) cur = null;
      if (inPhase) cur.total += g.total;
      out.push(Object.assign({}, g, { indent: !!inPhase, onPhase: inPhase && g.w === ph }));
    }
    return out;
  }

  // =====================================================================================
  // Drawing helpers
  // =====================================================================================
  /** Row label: WBS code (mono, muted) and name; template names muted and italic. */
  function rowLabel(q, pal, r, x, y, maxX, o) {
    o = o || {};
    if (!r.w) return S.text(x, y, 'No WBS line', { size: 12, fill: pal.muted, italic: true, v: 'middle' });
    const code = r.w.code || '';
    const name = r.onPhase ? 'Booked on the phase' : q.label(r.w, 'name') || 'Unnamed';
    const ph = r.onPhase || q.isPlaceholder(r.w, 'name');
    const nx = x + Math.max(34, S.measure(code, 11, 400, 'mono') + 8);
    return (
      S.text(x, y, code, { size: 11, family: 'mono', fill: pal.muted, v: 'middle' }) +
      S.text(nx, y, S.fit(name, maxX - nx, 12, o.weight), { size: 12, weight: o.weight, fill: ph ? pal.muted : pal.ink, italic: ph, v: 'middle' })
    );
  }

  /** Stacked segments from x0 to the right, 2px gaps between touching segments. */
  function hSegments(x0, y, h, vals, k, colors) {
    let out = '';
    let x = x0;
    const idx = vals.map((v, i) => i).filter((i) => vals[i] > 0);
    idx.forEach((i, j) => {
      const w = vals[i] * k;
      if (j === idx.length - 1) out += S.bar(x, y, Math.max(w, 1), h, { fill: colors[i], horizontal: true });
      else out += S.rect(x, y, Math.max(w - 2, 1), h, { fill: colors[i] });
      x += w;
    });
    return out;
  }

  /** Horizontal stacked bars with labels at the left and values at the bar ends. */
  function hStack(q, pal, o) {
    const leg = S.legend(o.slots.map((s) => ({ label: s.label, color: s.color })), PAD, PAD, pal, { maxW: W - 2 * PAD });
    const x0 = PAD + 300;
    const x1 = W - PAD - o.valueW;
    const bars = o.rows.filter((r) => !r.head);
    const t = S.niceTicks(Math.max(...bars.map((r) => r.total), 0) || 1, 5);
    const k = (x1 - x0) / t.max;
    const axisY = PAD + leg.h + 10;
    const top = axisY + 20;
    const RH = 24;
    const BH = 14;
    let body = leg.svg;
    let y = top;
    const colors = o.slots.map((s) => s.color);
    let rowsSvg = '';
    for (const r of o.rows) {
      const cy = y + RH / 2;
      if (r.head) {
        rowsSvg += rowLabel(q, pal, r, PAD, cy, x0 - 10, { weight: 600 });
        rowsSvg += S.text(x1 + 8, cy, o.fmt(r.total), { size: 11, weight: 600, fill: pal.ink2, v: 'middle' });
      } else {
        rowsSvg += rowLabel(q, pal, r, PAD + (r.indent ? 14 : 0), cy, x0 - 10);
        rowsSvg += hSegments(x0, cy - BH / 2, BH, r.vals, k, colors);
        rowsSvg += S.text(x0 + r.total * k + 6, cy, o.fmt(r.total), { size: 11, fill: pal.ink2, v: 'middle' });
      }
      y += RH;
    }
    const bottom = y;
    t.ticks.forEach((v) => {
      const x = x0 + v * k;
      body += S.line(x, top - 4, x, bottom, { stroke: v === 0 ? pal.axis : pal.grid, sw: 1 });
      body += S.text(x, axisY, o.tick(v), { size: 11, fill: pal.muted, anchor: 'middle' });
    });
    body += rowsSvg;
    let h = bottom + 8;
    if (o.note) {
      body += S.text(PAD, h + 6, o.note, { size: 11, fill: pal.muted, italic: true });
      h += 22;
    }
    return S.svg(W, h + PAD, body, { pal, label: o.label });
  }

  /**
   * Monthly stacked columns. o: {months, slots: [{label, color, vals}], tick, fmt, labelAll, extraMax,
   * overlay(ctx) => svg, legendExtra, note, label}
   */
  function vStack(q, pal, o) {
    const items = o.slots.map((s) => ({ label: s.label, color: s.color })).concat(o.legendExtra || []);
    const leg = S.legend(items, PAD, PAD, pal, { maxW: WL - 2 * PAD });
    const yT = PAD + leg.h + 22;
    const PH = 240;
    const yB = yT + PH;
    const x0 = PAD + 50;
    const x1 = WL - PAD - 120;
    const n = o.months.length;
    const bw = (x1 - x0) / n;
    const cw = Math.min(44, bw * 0.62);
    const totals = o.months.map((ym, i) => U.sum(o.slots, (s) => s.vals[i]));
    const t = S.niceTicks(Math.max(Math.max(...totals, 0), o.extraMax || 0) || 1, 5);
    const Y = (v) => yB - (v / t.max) * PH;
    const cx = (i) => x0 + bw * (i + 0.5);
    let body = leg.svg;
    t.ticks.forEach((v) => {
      body += S.line(x0, Y(v), x1, Y(v), { stroke: v === 0 ? pal.axis : pal.grid, sw: 1 });
      body += S.text(x0 - 8, Y(v), o.tick(v), { size: 11, fill: pal.muted, anchor: 'end', v: 'middle' });
    });
    const maxI = totals.indexOf(Math.max(...totals));
    let labels = ''; // drawn last, on a background patch, so lines do not run through them
    o.months.forEach((ym, i) => {
      let base = 0;
      const segs = o.slots.map((s, j) => j).filter((j) => o.slots[j].vals[i] > 1e-9);
      segs.forEach((j, z) => {
        const v = o.slots[j].vals[i];
        const yt = Y(base + v);
        const hh = Y(base) - yt;
        if (z === segs.length - 1) body += S.bar(cx(i) - cw / 2, yt, cw, Math.max(hh, 1), { fill: o.slots[j].color });
        else if (hh > 2) body += S.rect(cx(i) - cw / 2, yt + 2, cw, hh - 2, { fill: o.slots[j].color });
        base += v;
      });
      if (totals[i] > 1e-9 && (o.labelAll ? n <= 14 || i === maxI : i === maxI)) {
        const lbl = o.fmt(totals[i]);
        const lw = S.measure(lbl, 11) + 6;
        labels += S.rect(cx(i) - lw / 2, Y(totals[i]) - 17, lw, 14, { fill: pal.bg, rx: 2 });
        labels += S.text(cx(i), Y(totals[i]) - 5, lbl, { size: 11, fill: pal.ink2, anchor: 'middle', v: 'base' });
      }
      if (n <= 14 || i % 2 === 0) body += S.text(cx(i), yB + 8, U.monthShort(ym), { size: 11, fill: pal.ink2, anchor: 'middle' });
    });
    if (o.overlay) body += o.overlay({ x0, x1, yT, yB, Y, cx, bw, cw, n, totals });
    body += labels;
    let h = yB + 30;
    if (o.note) {
      body += S.text(PAD, h + 4, o.note, { size: 11, fill: pal.muted, italic: true });
      h += 22;
    }
    return S.svg(WL, h + PAD - 4, body, { pal, label: o.label });
  }

  // =====================================================================================
  // Graphics of section 3.5
  // =====================================================================================
  function staffPlacement(q, pal) {
    const m = model(q);
    const { slots, idx } = pdSlots(m, pal);
    const byWp = q.f('res.depth') === 'Work package';
    const rows = groupRows(q, m.active.filter((l) => l.pd), slots.length, (l) => idx.get(l.rt.name), (l) => l.pd.plan, byWp);
    return hStack(q, pal, {
      rows, slots, valueW: 70, label: 'Staff placement: person-days per ' + (byWp ? 'work package' : 'phase') + ' by resource type',
      fmt: (v) => pdText(v) + ' PD', tick: (v) => U.fmtNum(v),
      note: 'Total ' + pdText(m.totalPD) + ' person-days' + (byWp ? '; phase totals on the phase lines.' : '.'),
    });
  }

  function costsByPhase(q, pal) {
    const m = model(q);
    const slots = costSlots(pal);
    const rows = groupRows(q, m.active, 4, (l) => COST_TYPES.indexOf(l.ctype), (l) => l.plan, false);
    return hStack(q, pal, {
      rows, slots, valueW: 90, label: 'Planned costs per phase by cost type',
      fmt: (v) => moneyText(q, v), tick: (v) => (v ? q.cur() + S.compact(v) : '0'),
      note: 'Total plan ' + moneyText(q, m.totalPlan) + ': ' + COST_TYPES.filter((t) => m.byType[t]).map((t) => t.toLowerCase() + ' ' + moneyText(q, m.byType[t])).join(', ') + '.',
    });
  }

  function availabilityRows(q) {
    const m = model(q);
    return m.pdTypes
      .map((t) => ({ t, need: U.sum(m.active.filter((l) => l.rt === t), (l) => l.pd.plan), cap: t.cap == null ? null : t.cap * t.pdu }))
      .filter((r) => r.need > 0 || r.cap > 0);
  }

  function availability(q, pal) {
    const m = model(q);
    const rows = availabilityRows(q);
    const items = [
      { label: 'Needed (plan)', color: pal.accent },
      { label: 'Needed beyond capacity', color: pal.crit },
      { label: 'Available capacity', color: pal.accentSoft, stroke: pal.boxLine },
    ];
    const leg = S.legend(items, PAD, PAD, pal, { maxW: W - 2 * PAD });
    const x0 = PAD + 230;
    const x1 = W - PAD - 200;
    const t = S.niceTicks(Math.max(...rows.map((r) => Math.max(r.need, r.cap || 0)), 0) || 1, 5);
    const k = (x1 - x0) / t.max;
    const axisY = PAD + leg.h + 10;
    const top = axisY + 20;
    const RH = 32;
    let body = leg.svg;
    let rowsSvg = '';
    rows.forEach((r, i) => {
      const cy = top + i * RH + RH / 2;
      rowsSvg += S.text(PAD, cy - 6, S.fit(r.t.name, x0 - PAD - 12, 12), { size: 12, fill: pal.ink, v: 'middle' });
      rowsSvg += S.text(PAD, cy + 8, r.t.from + (r.t.unit === 'hours' ? ', hours ÷ 8' : ''), { size: 10.5, fill: pal.muted, v: 'middle' });
      if (r.cap > 0) rowsSvg += S.rect(x0, cy - 10, r.cap * k, 20, { fill: pal.accentSoft, stroke: pal.boxLine, sw: 1, rx: 2 });
      const inCap = r.cap == null ? r.need : Math.min(r.need, r.cap);
      const over = r.cap == null ? 0 : Math.max(0, r.need - r.cap);
      if (over > 0) {
        rowsSvg += S.rect(x0, cy - 5, Math.max(inCap * k - 1, 0), 10, { fill: pal.accent });
        rowsSvg += S.bar(x0 + inCap * k + 1, cy - 5, Math.max(over * k - 1, 2), 10, { fill: pal.crit, horizontal: true });
      } else if (r.need > 0) rowsSvg += S.bar(x0, cy - 5, r.need * k, 10, { fill: pal.accent, horizontal: true });
      if (r.cap > 0) rowsSvg += S.line(x0 + r.cap * k, cy - 14, x0 + r.cap * k, cy + 14, { stroke: pal.ink, sw: 2 });
      const lx = x0 + Math.max(r.need, r.cap || 0) * k + 10;
      if (r.cap == null) rowsSvg += S.text(lx, cy, pdText(r.need) + ' PD, capacity not given', { size: 11, fill: pal.muted, v: 'middle' });
      else if (over > 0.05) rowsSvg += S.text(lx, cy, pdText(r.need) + ' of ' + pdText(r.cap) + ' PD, over by ' + pdText(over), { size: 11, weight: 600, fill: pal.crit, v: 'middle' });
      else rowsSvg += S.text(lx, cy, pdText(r.need) + ' of ' + pdText(r.cap) + ' PD', { size: 11, fill: pal.ink2, v: 'middle' });
    });
    const bottom = top + rows.length * RH;
    t.ticks.forEach((v) => {
      const x = x0 + v * k;
      body += S.line(x, top - 4, x, bottom, { stroke: v === 0 ? pal.axis : pal.grid, sw: 1 });
      body += S.text(x, axisY, U.fmtNum(v), { size: 11, fill: pal.muted, anchor: 'middle' });
    });
    body += rowsSvg;
    let h = bottom + 8;
    const others = m.rts.filter((rt) => !rt.pdu).map((rt) => rt.name);
    if (others.length) {
      body += S.text(PAD, h + 6, S.fit('Not compared here (other units): ' + others.join(', '), W - 2 * PAD, 11), { size: 11, fill: pal.muted, italic: true });
      h += 22;
    }
    return S.svg(W, h + PAD, body, { pal, label: 'Availability check: person-days needed against available capacity per resource type' });
  }

  // =====================================================================================
  // Graphics of section 4.2
  // =====================================================================================
  function resourceHistogram(q, pal) {
    const m = model(q);
    const { slots, idx } = pdSlots(m, pal);
    const vals = slots.map(() => m.months.map(() => 0));
    m.pdTypes.forEach((t) => m.pd[t.name].forEach((v, i) => (vals[idx.get(t.name)][i] += v)));
    const capSum = U.sum(m.pdTypes, (t) => (t.cap || 0) * t.pdu);
    const capM = capSum > 0 && m.months.length ? capSum / m.months.length : 0;
    const nd = U.sum(m.pdTypes, (t) => m.pdND[t.name]);
    return vStack(q, pal, {
      months: m.months,
      slots: slots.map((s, i) => Object.assign({}, s, { vals: vals[i] })),
      tick: (v) => U.fmtNum(v), fmt: (v) => pdText(v), labelAll: true, extraMax: capM,
      legendExtra: capM ? [{ label: 'Average capacity per month', color: pal.ink2, shape: 'dash' }] : [],
      overlay: (c) => {
        if (!capM) return '';
        const y = c.Y(capM);
        return (
          S.line(c.x0, y, c.x1, y, { stroke: pal.ink2, sw: 2, dash: '6 4' }) +
          S.text(c.x1 + 8, y - 7, 'Capacity', { size: 11, fill: pal.ink2, v: 'middle' }) +
          S.text(c.x1 + 8, y + 8, 'about ' + pdText(capM) + ' PD/month', { size: 11, fill: pal.ink2, v: 'middle' })
        );
      },
      note: nd > 0.05 ? 'Not shown: ' + pdText(nd) + ' PD on lines without dates.' : 'Person-days per month (PD); each line is spread evenly over the days of its WBS line.',
      label: 'Resource histogram: person-days per month by resource type',
    });
  }

  function costHistogram(q, pal) {
    const m = model(q);
    const slots = costSlots(pal).map((s) => Object.assign({}, s, { vals: m.cost[s.label] }));
    const totals = m.months.map((ym, i) => U.sum(slots, (s) => s.vals[i]));
    const cum = [];
    totals.reduce((a, v, i) => (cum[i] = a + v), 0);
    const total = cum.length ? cum[cum.length - 1] : 0;
    const nd = U.sum(COST_TYPES, (t) => m.costND[t]);
    return vStack(q, pal, {
      months: m.months, slots,
      tick: (v) => (v ? q.cur() + S.compact(v) : '0'), fmt: (v) => moneyText(q, v), extraMax: total,
      legendExtra: [{ label: 'Cumulative cost (cost baseline)', color: pal.strong, shape: 'line' }],
      overlay: (c) => {
        if (!cum.length) return '';
        const pts = cum.map((v, i) => [c.cx(i), c.Y(v)]);
        let out = S.polyline(pts, { stroke: pal.strong, sw: 2 });
        pts.forEach((p) => (out += S.circle(p[0], p[1], 4, { fill: pal.strong, stroke: pal.bg, sw: 1.5 })));
        const last = pts[pts.length - 1];
        const lx = last[0] + Math.max(c.cw / 2, 8) + 6;
        out += S.text(lx, last[1] - 2, 'Cumulative', { size: 11, fill: pal.ink2, v: 'middle' });
        out += S.text(lx, last[1] + 13, moneyText(q, total), { size: 11, weight: 600, fill: pal.ink, v: 'middle' });
        return out;
      },
      note: nd > 0.5 ? 'Not shown: ' + moneyText(q, nd) + ' on lines without dates.' : 'Columns: planned cost per month. Line: cumulative cost to the end of each month.',
      label: 'Cost histogram and cumulative cost curve',
    });
  }

  function payList(q) {
    return q.rows('costPayments').filter((p) => U.isDate(p.date) && num(p.amount)).map((p) => ({ date: p.date, amount: num(p.amount) }));
  }

  function costsAndPayments(q, pal) {
    const m = model(q);
    const pays = payList(q);
    const start = U.minDate([m.start].concat(pays.map((p) => p.date)));
    const end = U.maxDate([m.end].concat(pays.map((p) => p.date)));
    const items = [
      { label: 'Cost baseline (cumulative plan)', color: pal.accent, shape: 'line' },
      { label: 'Payments (cumulative)', color: pal.strong, shape: 'line' },
      { label: 'Costs ahead of payments', color: pal.critSoft, stroke: pal.crit },
      { label: 'Payments ahead of costs', color: pal.goodSoft, stroke: pal.good },
    ];
    const leg = S.legend(items, PAD, PAD, pal, { maxW: WL - 2 * PAD });
    const axT = PAD + leg.h + 8;
    const x0 = PAD + 52;
    const x1 = WL - PAD - 150;
    const sc = S.timeScale(start, end, x0, x1);
    const yT = axT + 22 + 14;
    const PH = 230;
    const yB = yT + PH;
    // daily cost accrual and cumulative values at day boundaries
    const a = S.dayNum(start);
    const n = S.dayNum(end) - a + 1;
    const daily = new Array(n).fill(0);
    m.active.filter((l) => l.dated).forEach((l) => {
      const s = Math.max(0, S.dayNum(l.start) - a);
      const e = Math.min(n - 1, S.dayNum(l.end) - a);
      const per = l.plan / (S.dayNum(l.end) - S.dayNum(l.start) + 1);
      for (let d = s; d <= e; d++) daily[d] += per;
    });
    const C = [0];
    for (let i = 0; i < n; i++) C.push(C[i] + daily[i]);
    const Pb = new Array(n + 1).fill(0);
    const Pa = new Array(n + 1).fill(0);
    const jumps = new Array(n + 1).fill(0);
    pays.forEach((p) => (jumps[Math.min(n - 1, Math.max(0, S.dayNum(p.date) - a))] += p.amount));
    for (let i = 0; i <= n; i++) {
      Pb[i] = i ? Pa[i - 1] : 0;
      Pa[i] = Pb[i] + jumps[i];
    }
    const pTot = Pa[n];
    const cTot = C[n];
    const t = S.niceTicks(Math.max(cTot, pTot) || 1, 5);
    const X = (i) => x0 + i * sc.k;
    const Y = (v) => yB - (v / t.max) * PH;
    let body = leg.svg + S.timeAxis(sc, axT, 22, yB, pal);
    t.ticks.forEach((v) => {
      body += S.line(x0, Y(v), x1, Y(v), { stroke: v === 0 ? pal.axis : pal.grid, sw: 1 });
      body += S.text(x0 - 8, Y(v), v ? q.cur() + S.compact(v) : '0', { size: 11, fill: pal.muted, anchor: 'end', v: 'middle' });
    });
    // shaded areas between the two curves
    const polys = { 1: [], '-1': [] };
    let run = null;
    const flush = () => {
      if (run && run.top.length > 1) polys[run.s].push(run.top.concat(run.bot.slice().reverse()));
      run = null;
    };
    const seg = (xa, xb, ca, cb, p, s) => {
      if (!s) return flush();
      if (!run || run.s !== s) {
        flush();
        run = { s, top: [[xa, Y(ca)]], bot: [[xa, Y(p)]], p };
      } else if (run.p !== p) run.bot.push([xa, Y(p)]);
      run.top.push([xb, Y(cb)]);
      run.bot.push([xb, Y(p)]);
      run.p = p;
    };
    const eps = 1e-6;
    for (let i = 0; i < n; i++) {
      const p = Pa[i];
      const dA = C[i] - p;
      const dB = C[i + 1] - p;
      if (dA * dB < 0) {
        const f = dA / (dA - dB);
        const xm = X(i) + f * (X(i + 1) - X(i));
        seg(X(i), xm, C[i], p, p, Math.sign(dA));
        seg(xm, X(i + 1), p, C[i + 1], p, Math.sign(dB));
      } else {
        const s = dA > eps || dB > eps ? 1 : dA < -eps || dB < -eps ? -1 : 0;
        seg(X(i), X(i + 1), C[i], C[i + 1], p, s);
      }
    }
    flush();
    polys[1].forEach((pts) => (body += S.poly(pts, { fill: pal.critSoft })));
    polys['-1'].forEach((pts) => (body += S.poly(pts, { fill: pal.goodSoft })));
    // cost baseline and payment steps
    body += S.polyline(C.map((v, i) => [X(i), Y(v)]), { stroke: pal.accent, sw: 2 });
    const pp = [[X(0), Y(Pb[0])]];
    const marks = [];
    for (let i = 0; i < n; i++) {
      if (jumps[i]) {
        pp.push([X(i), Y(Pb[i])], [X(i), Y(Pa[i])]);
        marks.push([X(i), Y(Pa[i])]);
      }
    }
    pp.push([X(n), Y(pTot)]);
    body += S.polyline(pp, { stroke: pal.strong, sw: 2 });
    marks.forEach((p) => (body += S.circle(p[0], p[1], 4, { fill: pal.strong, stroke: pal.bg, sw: 1.5 })));
    // end labels and gross margin
    let yc = Y(cTot);
    let yp = Y(pTot);
    if (Math.abs(yc - yp) < 16) {
      const mid = (yc + yp) / 2;
      const up = yc <= yp;
      yc = mid + (up ? -8 : 8);
      yp = mid + (up ? 8 : -8);
    }
    const lx = x1 + 18;
    body += S.line(x1 + 6, Y(cTot), x1 + 6, Y(pTot), { stroke: pal.ink2, sw: 1 });
    body += S.line(x1 + 2, Y(cTot), x1 + 10, Y(cTot), { stroke: pal.ink2, sw: 1 });
    body += S.line(x1 + 2, Y(pTot), x1 + 10, Y(pTot), { stroke: pal.ink2, sw: 1 });
    body += S.text(lx, yc, 'Costs ' + moneyText(q, cTot), { size: 11, fill: pal.ink, v: 'middle' });
    body += S.text(lx, yp, 'Payments ' + moneyText(q, pTot), { size: 11, fill: pal.ink, v: 'middle' });
    const gm = q.f('cost.grossMargin');
    let my = (Y(cTot) + Y(pTot)) / 2;
    if (Math.abs(Y(cTot) - Y(pTot)) < 64) my = Math.max(yc, yp) + 22;
    // a gross margin only means something when a customer pays; internal projects fund the gap themselves
    const external = q.f('meta.kind') === 'External (customer) project';
    const margin = typeof gm === 'number' ? gm : pTot - m.totalPlan;
    body += S.text(lx, my - 7, external ? 'Gross margin' : 'Own funding needed', { size: 11, fill: pal.ink2, v: 'middle' });
    body += S.text(lx, my + 8, moneyText(q, external ? margin : Math.max(0, -margin)), { size: 12, weight: 600, fill: pal.ink, v: 'middle' });
    const h = Math.max(yB + 14, my + 22);
    let foot = '';
    const undated = m.active.filter((l) => !l.dated);
    if (undated.length) foot = S.text(PAD, h + 4, 'Not in the cost line: ' + moneyText(q, U.sum(undated, (l) => l.plan)) + ' on lines without dates.', { size: 11, fill: pal.muted, italic: true });
    return S.svg(WL, h + (foot ? 26 : 0) + PAD, body + foot, { pal, label: 'Cumulative cost baseline against cumulative payments' });
  }

  // =====================================================================================
  // Read-only summary tables (HTML and Word export)
  // =====================================================================================
  function tableHtml(t) {
    const esc = U.esc;
    let h = '<div class="tbl-head"><h3 class="blk-t">' + esc(t.title) + '</h3></div>';
    if (t.hint) h += '<p class="hint">' + esc(t.hint) + '</p>';
    h += '<div class="tbl-scroll"><table class="grid compact"><thead><tr>';
    t.cols.forEach((c) => {
      h += '<th scope="col" class="k-' + (c.num ? 'number' : 'text') + '"' + (c.w ? ' style="min-width:' + c.w + 'ch"' : '') + '>' + esc(c.label) + (c.sub ? '<small>' + esc(c.sub) + '</small>' : '') + '</th>';
    });
    h += '</tr></thead><tbody>';
    if (!t.rows.length) h += '<tr class="empty"><td colspan="' + t.cols.length + '">' + esc(t.empty) + '</td></tr>';
    t.rows.forEach((r) => {
      h += '<tr' + (r.sub ? ' data-level="2"' : '') + '>';
      r.cells.forEach((v, i) => {
        const c = t.cols[i];
        h += '<td class="ro k-' + (c.num ? 'number' : 'text') + (c.mono ? ' mono' : '') + (r.ph && i === 1 ? ' ph' : '') + '">' + esc(v) + '</td>';
      });
      h += '</tr>';
    });
    h += '</tbody>';
    if (t.foot && t.rows.length) {
      h += '<tfoot><tr>';
      t.foot.forEach((v, i) => {
        h += i === 0 ? '<td class="tot-l">' + esc(v) + '</td>' : '<td class="tot k-' + (t.cols[i].num ? 'number' : 'text') + '">' + esc(v) + '</td>';
      });
      h += '</tr></tfoot>';
    }
    return h + '</table></div>';
  }

  function summaryBlock(build) {
    return {
      type: 'custom',
      render(el, q) {
        el.innerHTML = tableHtml(build(q));
      },
      update(el, q) {
        el.innerHTML = tableHtml(build(q));
      },
      exportBlocks(q, opts) {
        const t = build(q);
        if (!t.rows.length && !(opts && opts.empty)) return [];
        const out = [{ type: 'h3', text: t.title }];
        if (t.hint) out.push({ type: 'p', text: t.hint, style: 'note' });
        out.push({
          type: 'table',
          columns: t.cols.map((c) => ({ label: c.label + (c.sub ? ' (' + c.sub + ')' : ''), width: c.ew || (c.num ? 1 : 2), align: c.num ? 'right' : undefined })),
          rows: t.rows.map((r) => r.cells),
          footer: t.foot && t.rows.length ? t.foot : null,
          emptyRows: t.rows.length ? 0 : 4,
          fontSize: 8,
        });
        return out;
      },
    };
  }

  /** Plan / actual / remaining / forecast / deviation per WBS line and type. */
  function fiveValueTable(q, o) {
    const m = model(q);
    const groups = new Map();
    for (const l of m.active) {
      const v = o.val(l);
      if (!v) continue;
      const k = (l.w ? l.w._id : '_none') + '|' + o.type(l);
      if (!groups.has(k)) groups.set(k, { w: l.w, type: o.type(l), order: o.order(l), plan: 0, actual: null, remaining: null, forecast: 0, dev: 0 });
      const g = groups.get(k);
      g.plan += v.plan;
      g.actual = nsum(g.actual, v.actual);
      g.remaining = nsum(g.remaining, v.remaining);
      g.forecast = nsum(g.forecast, v.forecast);
      g.dev = nsum(g.dev, v.dev);
    }
    const list = Array.from(groups.values()).sort((a, b) => (a.w ? 0 : 1) - (b.w ? 0 : 1) || U.codeCmp(a.w ? a.w.code : '', b.w ? b.w.code : '') || a.order - b.order);
    const rows = [];
    const F = ['plan', 'actual', 'remaining', 'forecast', 'dev'];
    const tot = { plan: 0, actual: null, remaining: null, forecast: 0, dev: 0 };
    let i = 0;
    while (i < list.length) {
      const w = list[i].w;
      const block = [];
      while (i < list.length && list[i].w === w) block.push(list[i++]);
      block.forEach((g, j) => {
        rows.push({ cells: [j ? '' : w ? w.code : '', j ? '' : w ? q.label(w, 'name') : 'No WBS line', g.type].concat(F.map((f) => o.fmt(g[f]))), ph: !j && w && q.isPlaceholder(w, 'name') });
        F.forEach((f) => (tot[f] = nsum(tot[f], g[f])));
      });
      if (block.length > 1) {
        const s = {};
        F.forEach((f) => (s[f] = block.reduce((acc, g) => nsum(acc, g[f]), null)));
        rows.push({ cells: ['', '', 'Sum'].concat(F.map((f) => o.fmt(s[f]))), sub: true });
      }
    }
    return {
      title: o.title, hint: o.hint, empty: o.empty, rows,
      cols: [
        { label: 'WBS', w: 6, mono: true, ew: 0.8 },
        { label: 'Phase / WP', w: 20, ew: 2.4 },
        { label: o.typeLabel, w: 16, ew: 1.8 },
        { label: 'Plan', sub: o.unit, num: true, w: 8 },
        { label: 'Actual', sub: o.unit, num: true, w: 8 },
        { label: 'Remaining', sub: o.unit, num: true, w: 8 },
        { label: 'Forecast', sub: o.unit, num: true, w: 8 },
        { label: 'Deviation', sub: o.unit, num: true, w: 8 },
      ],
      foot: ['Total', '', ''].concat(F.map((f) => o.fmt(tot[f]))),
    };
  }

  const staffTable = summaryBlock((q) => {
    const m = model(q);
    return fiveValueTable(q, {
      title: 'Staff placement table',
      hint: 'Built from the cost plan: person-days per WBS line and resource type. Actual and remaining are converted from money with the rate of the line.',
      empty: 'Lines appear here once the cost plan has person-days for a resource type.',
      typeLabel: 'Resource type', unit: 'PD',
      type: (l) => l.rt.name, order: (l) => l.rt.idx,
      val: (l) => (l.pd && l.pd.plan ? l.pd : null),
      fmt: (v) => pdText(v),
      m,
    });
  });

  const costTable = summaryBlock((q) =>
    fiveValueTable(q, {
      title: 'Cost table',
      hint: 'Built from the cost plan: costs per WBS line and project cost type.',
      empty: 'Lines appear here once the cost plan has amounts.',
      typeLabel: 'Cost type', unit: q.cur(),
      type: (l) => l.ctype, order: (l) => COST_TYPES.indexOf(l.ctype),
      val: (l) => (l.plan || l.actual || l.remaining ? { plan: l.plan, actual: l.actual, remaining: l.remaining, forecast: l.forecast, dev: l.dev } : null),
      fmt: (v) => moneyText(q, v),
    })
  );

  /** Rows = types, columns = months (+ no dates) + total. */
  function monthTable(q, o) {
    const m = model(q);
    const showND = o.types.some((t) => o.nd[t] > 1e-9);
    const cols = [{ label: o.typeLabel, w: 18, ew: 2.2 }]
      .concat(m.months.map((ym) => ({ label: U.monthShort(ym), num: true, w: 7 })))
      .concat(showND ? [{ label: 'No dates', num: true, w: 7 }] : [])
      .concat([{ label: 'Total', num: true, w: 8 }]);
    const colTot = m.months.map(() => 0);
    let ndTot = 0;
    let all = 0;
    const rows = o.types.map((t) => {
      const vals = o.vals[t] || [];
      vals.forEach((v, i) => (colTot[i] += v));
      ndTot += o.nd[t] || 0;
      const tot = U.sum(vals, (v) => v) + (o.nd[t] || 0);
      all += tot;
      return { cells: [t].concat(vals.map((v) => (v > 1e-9 ? o.fmt(v) : '–'))).concat(showND ? [o.nd[t] ? o.fmt(o.nd[t]) : '–'] : []).concat([o.fmt(tot)]) };
    });
    return {
      title: o.title, hint: o.hint, cols,
      rows: m.months.length || all ? rows : [],
      empty: 'Add dates to the work packages (schedule) and lines to the cost plan to fill this table.',
      foot: ['Total'].concat(colTot.map((v) => o.fmt(v))).concat(showND ? [o.fmt(ndTot)] : []).concat([o.fmt(all)]),
    };
  }

  function compareRef(q, m, label, ref) {
    const ext = m.totalPlan - m.byType.Staff;
    const dt = ((m.totalPlan - ref) / ref) * 100;
    const de = ((ext - ref) / ref) * 100;
    const best = ext > 0 && Math.abs(de) < Math.abs(dt) ? { v: ext, d: de, what: 'without staff' } : { v: m.totalPlan, d: dt, what: 'in total' };
    const ok = Math.abs(best.d) <= 10;
    return {
      ok,
      text: label + ' ' + q.money(ref) + '; cost plan ' + moneyText(q, best.v) + ' ' + best.what + ' (' + pctText(best.d) + ').' + (ok ? '' : ' Explain the difference or update the plan.'),
    };
  }

  function budgetChecks(q) {
    const m = model(q);
    const act = m.active;
    if (!act.length) return [{ ok: null, text: 'Add lines with quantities or amounts to the cost plan to run the checks.' }];
    const out = [];
    const untyped = m.lines.filter((l) => !l.ctype && (l.plan || l.actual || l.remaining));
    if (untyped.length) out.push({ ok: false, text: untyped.length + ' line(s) with amounts have no known resource or cost type.' });
    const noWbs = act.filter((l) => !l.w);
    const noDates = act.filter((l) => l.w && !l.dated);
    if (noWbs.length || noDates.length) {
      const parts = [];
      if (noWbs.length) parts.push(noWbs.length + ' line(s) without a WBS line');
      if (noDates.length) parts.push('no dates for ' + Array.from(new Set(noDates.map((l) => l.w.code))).sort(U.codeCmp).join(', '));
      out.push({ ok: false, text: 'Resource plan against the schedule: ' + parts.join('; ') + '.' });
    } else out.push({ ok: true, text: 'Resource plan against the schedule: every line sits on a WBS line with dates.' });
    const covered = new Set(act.map((l) => phaseOf(q, l.w)).filter(Boolean).map((w) => w._id));
    const missing = q.phases().filter((p) => !covered.has(p._id));
    out.push(missing.length ? { ok: false, text: 'Phases without any line: ' + missing.map((p) => p.code + ' ' + q.label(p, 'name')).join(', ') + '.' } : { ok: true, text: 'Every phase has at least one line.' });
    if (PM.tables.ideaBusinessCase) {
      const bc = U.sum(q.rows('ideaBusinessCase').filter((r) => r.type === 'Cost'), (r) => num(r.amount) || 0);
      out.push(bc > 0 ? compareRef(q, m, 'Business case costs', bc) : { ok: null, text: 'No costs in the business case (section 3.1) to compare with.' });
    }
    const rb = num(q.f('content.budget'));
    out.push(rb ? compareRef(q, m, 'Rough budget', rb) : { ok: null, text: 'No rough budget in the content boundaries to compare with.' });
    if (PM.metrics.riskBudget) {
      let rv = null;
      try {
        rv = PM.metrics.riskBudget.fn(q);
      } catch (e) {
        rv = null;
      }
      if (typeof rv === 'number' && rv > 0) {
        const found = act.some((l) => l.ctype === 'Other' && /risk|reserve|contingenc/i.test((l.row.res || '') + ' ' + (l.row.note || '')));
        out.push(found ? { ok: true, text: 'The risk budget (' + q.money(rv) + ') has its own line in the cost plan.' } : { ok: null, text: 'Risk budget ' + q.money(rv) + ': add it as a line of type Other (for example "Risk reserve") so it is part of the plan.' });
      }
    }
    const withAct = act.filter((l) => l.actual != null).length;
    if (RUNNING.indexOf(q.f('meta.status')) >= 0) out.push({ ok: withAct === act.length ? true : null, text: withAct ? 'Actual values entered for ' + withAct + ' of ' + act.length + ' lines.' : 'The project is running: enter actual and remaining values to see the forecast.' });
    else out.push({ ok: null, text: 'Enter actual and remaining values once the project runs.' });
    return out;
  }

  function detailChecks(q) {
    const m = model(q);
    const act = m.active;
    if (!act.length) return [{ ok: null, text: 'Add lines to the cost plan (section 3.5) to run the checks.' }];
    const out = [];
    const undated = act.filter((l) => !l.dated);
    out.push(undated.length
      ? { ok: false, text: 'Not in the monthly view: ' + undated.length + ' line(s) without dates (' + moneyText(q, U.sum(undated, (l) => l.plan)) + '). Add dates to their work packages.' }
      : { ok: true, text: 'Every line has dates and appears in the monthly view.' });
    const capTypes = m.pdTypes.filter((t) => t.cap > 0);
    if (!capTypes.length || !m.months.length) out.push({ ok: null, text: 'Enter the available capacity of the resource types (section 3.5) to check the monthly peaks.' });
    else {
      const capM = U.sum(capTypes, (t) => t.cap * t.pdu) / m.months.length;
      const over = [];
      m.months.forEach((ym, i) => {
        const need = U.sum(capTypes, (t) => m.pd[t.name][i]);
        if (need > capM + 0.05) over.push(U.monthShort(ym) + ' (' + pdText(need) + ' PD)');
      });
      out.push(over.length
        ? { ok: false, text: 'Capacity exceeded: about ' + pdText(capM) + ' PD per month available, more needed in ' + over.join(', ') + '. Agree the peaks with the line managers.' }
        : { ok: true, text: 'The monthly need stays within the average capacity of about ' + pdText(capM) + ' PD per month.' });
    }
    const pays = payList(q);
    if (pays.length) {
      const late = pays.filter((p) => m.end && p.date > m.end).length;
      if (late) out.push({ ok: null, text: late + ' payment(s) fall after the end of the schedule.' });
    }
    return out;
  }

        { _id: 'pay2', date: '2026-07-10', desc: 'Main sponsor, second instalment after the festival', amount: 3000, received: true },

<script>
/* js/sections/approvals.js */
/* Framework sections 3.6 (project approval), 4.3 (consolidate and coordinate), 4.4 (finalise the PM plan) and 4.5 (approve the PM plan). */
(function () {
  'use strict';
  const S = PM.svg;
  const U = PM.util;

  const r1 = (n) => S.round(n);
  const PAD = 16;

  // =====================================================================================
  // Shared helpers
  // =====================================================================================

  /** Section numbers of the given section ids in this workbook ("3.5, 4.2"), else the fallback. */
  function secNum(ids, fb) {
    const nums = [];
    (ids || []).forEach((id) => {
      const s = (PM.sections || []).find((x) => x.id === id);
      if (s && s.num && nums.indexOf(s.num) < 0) nums.push(s.num);
    });
    return nums.length ? nums.join(', ') : fb || '';
  }

  /** Polygon as a path, so it can be dashed. */
  function shape(points, o) {
    return S.path('M' + points.map((p) => r1(p[0]) + ',' + r1(p[1])).join(' L') + ' Z', o);
  }

  function chev(x, y, w, h, first, o) {
    const t = 14;
    const pts = first
      ? [[x, y], [x + w - t, y], [x + w, y + h / 2], [x + w - t, y + h], [x, y + h]]
      : [[x, y], [x + w - t, y], [x + w, y + h / 2], [x + w - t, y + h], [x, y + h], [x + t, y + h / 2]];
    return shape(pts, o);
  }

  /** Folder icon, 16 x 12, top-left at (x, y). */
  function folder(x, y, o) {
    return shape([[x, y + 1], [x + 5.5, y + 1], [x + 7, y + 3], [x + 16, y + 3], [x + 16, y + 12], [x, y + 12]], Object.assign({ sw: 1.2, join: 'round' }, o));
  }

  function names(q, ids, short) {
    const list = Array.isArray(ids) ? ids : ids ? [ids] : [];
    return list.map((id) => (short ? q.initials(id) : q.name(id))).filter(Boolean).join(', ');
  }

  function safeRows(q, key) {
    try {
      return q.rows(key) || [];
    } catch (e) {
      return [];
    }
  }

  const filled = (v) => !U.isEmpty(v) && !(Array.isArray(v) && !v.length);

  // =====================================================================================
  // Reference lists
  // =====================================================================================

  /** The plans that are checked in the follow-up workshop (S3). */
  const CHECKS = [
    { _id: 'ck1', plan: 'Linked bar chart / schedule', short: 'Linked bar chart', ids: ['network'], fb: '4.2' },
    { _id: 'ck2', plan: 'Staff deployment (resource plan)', short: 'Staff deployment', ids: ['detailcost'], fb: '4.2' },
    { _id: 'ck3', plan: 'Cost plan', short: 'Cost plan', ids: ['detailcost'], fb: '4.2' },
    { _id: 'ck4', plan: 'Risk analysis', short: 'Risk analysis', ids: ['risk'], fb: '5' },
    { _id: 'ck5', plan: 'RACI chart', short: 'RACI chart', ids: ['raci'], fb: '4.2' },
    { _id: 'ck6', plan: 'WP specifications', short: 'WP specifications', ids: ['wpspecs'], fb: '4.2' },
    { _id: 'ck7', plan: 'Communication plan', short: 'Communication plan', ids: ['communication'], fb: '4.1' },
    { _id: 'ck8', plan: 'Project marketing', short: 'Project marketing', ids: ['consolidate'], fb: '4.3' },
  ];
  const CHECK_STATUS = ['Validated', 'Changed', 'Open'];

  /** The documents of a PM plan, in order, with the workbook sections that hold them. */
  const DOCS = [
    { _id: 'pc1', doc: 'Project Charter', ids: ['charter'], fb: '3.3' },
    { _id: 'pc2', doc: 'Stakeholder analysis', ids: ['stakeholders'], fb: '3.4' },
    { _id: 'pc3', doc: 'Results plan', ids: ['scope'], fb: '3.5' },
    { _id: 'pc4', doc: 'Work breakdown structure (WBS)', short: 'WBS', ids: ['scope'], fb: '3.5' },
    { _id: 'pc5', doc: 'WP specifications', ids: ['wpspecs'], fb: '4.2' },
    { _id: 'pc6', doc: 'Milestone plan', ids: ['schedule'], fb: '3.5' },
    { _id: 'pc7', doc: 'Bar chart / schedule', ids: ['schedule', 'network'], fb: '3.5, 4.2' },
    { _id: 'pc8', doc: 'Network analysis', ids: ['network'], fb: '4.2' },
    { _id: 'pc9', doc: 'Resource plan', ids: ['budget', 'detailcost'], fb: '3.5, 4.2' },
    { _id: 'pc10', doc: 'Cost plan', ids: ['budget', 'detailcost'], fb: '3.5, 4.2' },
    { _id: 'pc11', doc: 'Organisation chart', ids: ['organisation'], fb: '4.1' },
    { _id: 'pc12', doc: 'Role descriptions', ids: ['organisation'], fb: '4.1' },
    { _id: 'pc13', doc: 'Communication plan', ids: ['communication'], fb: '4.1' },
    { _id: 'pc14', doc: 'Ground rules and project culture', short: 'Ground rules and culture', ids: ['communication'], fb: '4.1' },
    { _id: 'pc15', doc: 'RACI chart', ids: ['raci'], fb: '4.2' },
    { _id: 'pc16', doc: 'Risk table', ids: ['risk'], fb: '5' },
    { _id: 'pc17', doc: 'Change request process', ids: ['contract'], fb: '7' },
    { _id: 'pc18', doc: 'Project marketing plan', ids: ['consolidate'], fb: '4.3' },
    { _id: 'pc19', doc: 'Situational analysis and method check', short: 'Situational analysis, method check', ids: ['tailoring'], fb: '8' },
  ];

  const BASELINES = [
    { _id: 'bl1', item: 'Milestone baseline' },
    { _id: 'bl2', item: 'Schedule baseline' },
    { _id: 'bl3', item: 'Cost baseline (S-curve)' },
    { _id: 'bl4', item: 'Scope baseline (WBS)' },
    { _id: 'bl5', item: 'Risk budget' },
  ];

  const AGENDA = [
    { id: 'authorise', text: 'Authorise the current planning' },
    { id: 'forward', text: 'Decide how to go forward' },
    { id: 'appraisal', text: 'Verify the investment appraisal (business case)' },
    { id: 'approve', text: 'Approve the project and the further planning process' },
    { id: 'pmplan', text: 'Agree the PM plan draft' },
  ];

  const AGREED = [
    { id: 'roles', text: 'Roles agreed' },
    { id: 'comm', text: 'Communication structures agreed' },
    { id: 'report', text: 'Reporting rhythm agreed' },
    { id: 'changes', text: 'How changes are handled (change request process) agreed' },
    { id: 'baseline', text: 'Baseline saved' },
  ];

  /** Days from the project approval (I5) to the PM plan approval (S5), or null. */
  function startDays(q) {
    const a = q.f('appr.date');
    const b = q.f('plan.approvalDate');
    return U.isDate(a) && U.isDate(b) ? U.diffDays(a, b) : null;
  }

  /** Latest PM plan version: the last dated row of the version history, else the approved version field. */
  function currentVersion(q) {
    const rows = q.rows('planVersions').filter((r) => filled(r.version));
    if (rows.length) {
      const dated = rows.filter((r) => U.isDate(r.date)).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
      return (dated.length ? dated[dated.length - 1] : rows[rows.length - 1]).version;
    }
    return q.f('plan.version') || '';
  }

  // =====================================================================================
  // Graphic: Approval path (I5 and S5 gates)
  // =====================================================================================

  function gateState(which, q) {
    if (which === 'I5') {
      const st = q.f('appr.charterStatus');
      if (st === 'Released' || st === 'Preliminarily released') return 'passed';
      if (st === 'Rejected') return 'rejected';
      if (st === 'To be revised') return 'open';
      return q.f('appr.date') ? 'open' : 'empty';
    }
    const st = q.f('plan.approved');
    if (st === 'Approved' || st === 'Approved with changes') return 'passed';
    if (st === 'Not approved') return 'rejected';
    return q.f('plan.approvalDate') ? 'open' : 'empty';
  }

  function gateStyle(state, pal) {
    if (state === 'passed') return { fill: pal.mile, stroke: pal.mile, ink: pal.accentInk };
    if (state === 'rejected') return { fill: pal.crit, stroke: pal.crit, ink: pal.accentInk };
    if (state === 'open') return { fill: pal.mileSoft, stroke: pal.mile, ink: pal.ink };
    return { fill: pal.bg, stroke: pal.muted, dash: '4 3', ink: pal.muted };
  }

  function phaseStyle(state, pal) {
    if (state === 'done') return { fill: pal.accent, stroke: pal.accent, sw: 1, ink: pal.accentInk, sub: pal.accentInk };
    if (state === 'current') return { fill: pal.accentSoft, stroke: pal.accent, sw: 1.5, ink: pal.ink, sub: pal.ink2 };
    return { fill: pal.box, stroke: pal.boxLine, sw: 1, ink: pal.ink2, sub: pal.muted };
  }

  function renderApprovalPath(q, pal) {
    const W = 960;
    const g1 = gateState('I5', q);
    const g2 = gateState('S5', q);
    const p1 = g1 === 'passed' ? 'done' : 'current';
    const p2 = g2 === 'passed' ? 'done' : g1 === 'passed' ? 'current' : 'next';
    const p3 = g2 === 'passed' ? 'current' : 'next';
    const days = startDays(q);
    const ver = q.f('plan.version') || '1.0';

    const slot = 80;
    const cw = (W - PAD * 2 - slot * 2) / 3;
    const by = 14;
    const bh = 50;
    const cy = by + bh / 2;
    const xs = [PAD, PAD + cw + slot, PAD + (cw + slot) * 2];
    const gx = [PAD + cw + slot / 2, PAD + cw * 2 + slot * 1.5];
    const phases = [
      { label: 'Idea and initiation', sub: 'Steps I1–I4', st: p1 },
      { label: 'Project start process', sub: 'Steps S1–S4' + (days === null ? '' : days < 0 ? ' · check the dates' : ' · ' + days + ' days'), st: p2 },
      { label: 'Implementation', sub: 'Controlling against the baseline', st: p3 },
    ];
    let body = '';
    // connector line behind the gates
    body += S.line(xs[0] + cw - 2, cy, xs[1] + 8, cy, { stroke: pal.axis, sw: 2 });
    body += S.line(xs[1] + cw - 2, cy, xs[2] + 8, cy, { stroke: pal.axis, sw: 2 });
    phases.forEach((p, i) => {
      const st = phaseStyle(p.st, pal);
      body += chev(xs[i], by, cw, bh, i === 0, { fill: st.fill, stroke: st.stroke, sw: st.sw });
      const tx = xs[i] + cw / 2 - (i === 0 ? 7 : 0);
      body += S.text(tx, cy - 8, S.fit(p.label, cw - 40, 13, 600), { size: 13, weight: 600, fill: st.ink, anchor: 'middle', v: 'middle' });
      body += S.text(tx, cy + 10, S.fit(p.sub, cw - 40, 11), { size: 11, fill: st.sub, anchor: 'middle', v: 'middle' });
    });

    // gate cards
    const v = (val, ph) => (filled(val) ? { t: String(val), ph: false } : { t: ph, ph: true });
    const bc = q.f('appr.businessCaseVerified');
    const fc = q.f('plan.finalCharter');
    const cards = [
      {
        code: 'I5', title: 'Project approval', state: g1,
        meta: [q.f('appr.format'), q.f('appr.place')].filter(filled).join(' · '),
        rows: [
          ['Meeting', v(q.f('appr.date') && q.date(q.f('appr.date')), 'date not set')],
          ['Project Charter', v(q.f('appr.charterStatus'), 'status not set')],
          ['Business case', v(bc === 'Yes' ? 'Verified' : bc === 'With changes' ? 'Verified with changes' : bc === 'No' ? 'Not verified' : '', 'not checked yet')],
          ['Participants', v(names(q, q.f('appr.participants'), true), 'not set')],
        ],
        out: 'Result: Project Charter (preliminarily) released',
      },
      {
        code: 'S5', title: 'PM plan approval', state: g2,
        meta: [q.f('plan.approvalFormat')].filter(filled).join(' · '),
        rows: [
          ['Meeting', v(q.f('plan.approvalDate') && q.date(q.f('plan.approvalDate')), 'date not set')],
          ['PM plan ' + ver, v(q.f('plan.approved'), 'decision not set')],
          ['Final charter', v(fc === 'Yes' ? 'Approved' : fc === 'No' ? 'Not approved yet' : '', 'not set')],
          ['Baseline saved', v(q.f('plan.baselineDate') && q.date(q.f('plan.baselineDate')), 'date not set')],
          ['Participants', v(names(q, q.f('plan.approvalParticipants'), true), 'not set')],
        ],
        out: 'Result: final charter, PM plan ' + ver + ', baseline',
      },
    ];
    const cardW = 300;
    const cardY = by + bh + 26;
    const rowH = 19;
    const maxRows = Math.max(...cards.map((c) => c.rows.length));
    const cardH = 52 + maxRows * rowH + 34;
    cards.forEach((c, i) => {
      const gs = gateStyle(c.state, pal);
      const x = gx[i] - cardW / 2;
      body += S.line(gx[i], cy + 19, gx[i], cardY, { stroke: gs.stroke, sw: 1.5, dash: gs.dash });
      body += S.rect(x, cardY, cardW, cardH, { fill: pal.bg, stroke: c.state === 'empty' ? pal.boxLine : gs.stroke, sw: 1.2, rx: 8, dash: c.state === 'empty' ? '4 3' : null });
      body += S.text(x + 14, cardY + 12, c.code + '  ' + c.title, { size: 13, weight: 600, fill: pal.ink });
      body += S.text(x + 14, cardY + 32, S.fit(c.meta || 'Format and place not set', cardW - 28, 11), { size: 11, fill: pal.muted, italic: !c.meta });
      c.rows.forEach((r, j) => {
        const y = cardY + 52 + j * rowH;
        body += S.text(x + 14, y, r[0], { size: 11, fill: pal.muted });
        body += S.text(x + 118, y - 1, S.fit(r[1].t, cardW - 132, 12, r[1].ph ? 400 : 500), { size: 12, weight: r[1].ph ? 400 : 500, fill: r[1].ph ? pal.muted : pal.ink, italic: r[1].ph });
      });
      const fy = cardY + cardH - 26;
      body += S.line(x + 12, fy, x + cardW - 12, fy, { stroke: pal.line });
      body += S.text(x + 14, fy + 8, S.fit(c.out, cardW - 28, 11), { size: 11, fill: pal.ink2 });
    });
    // gate diamonds on top of the connectors
    cards.forEach((c, i) => {
      const gs = gateStyle(c.state, pal);
      body += shape([[gx[i], cy - 19], [gx[i] + 19, cy], [gx[i], cy + 19], [gx[i] - 19, cy]], { fill: gs.fill, stroke: gs.stroke, sw: 1.5, dash: gs.dash });
      body += S.text(gx[i], cy, c.code, { size: 11, weight: 700, fill: gs.ink, anchor: 'middle', v: 'middle' });
    });

    // legend
    const ly = cardY + cardH + 18;
    const items = [
      { label: 'Phase done', sw: 18, sym: (x, yy) => chev(x, yy - 6, 18, 12, true, { fill: pal.accent, stroke: pal.accent }) },
      { label: 'Current phase', sw: 18, sym: (x, yy) => chev(x, yy - 6, 18, 12, true, { fill: pal.accentSoft, stroke: pal.accent, sw: 1.5 }) },
      { label: 'Gate passed', sw: 12, sym: (x, yy) => S.diamond(x + 6, yy, 6, { fill: pal.mile, stroke: pal.mile }) },
      { label: 'Gate open or to be revised', sw: 12, sym: (x, yy) => S.diamond(x + 6, yy, 6, { fill: pal.mileSoft, stroke: pal.mile }) },
      { label: 'Rejected', sw: 12, sym: (x, yy) => S.diamond(x + 6, yy, 6, { fill: pal.crit, stroke: pal.crit }) },
      { label: 'Not held yet', sw: 12, sym: (x, yy) => shape([[x + 6, yy - 6], [x + 12, yy], [x + 6, yy + 6], [x, yy]], { stroke: pal.muted, dash: '2 2' }) },
    ];
    let lx = PAD;
    let lyy = ly;
    items.forEach((it) => {
      const w = it.sw + 6 + S.measure(it.label, 11) + 20;
      if (lx + w > W - PAD) {
        lx = PAD;
        lyy += 20;
      }
      body += it.sym(lx, lyy + 6);
      body += S.text(lx + it.sw + 6, lyy + 6, it.label, { size: 11, fill: pal.ink2, v: 'middle' });
      lx += w;
    });
    return S.svg(W, lyy + 22, body, { pal, label: 'Approval path from the idea through project approval and PM plan approval to implementation' });
  }

  // =====================================================================================
  // Graphic: Consolidation status (S3)
  // =====================================================================================

  function checkStyle(st, pal) {
    if (st === 'Validated') return { fill: pal.goodSoft, stroke: pal.good, sw: 1.2 };
    if (st === 'Changed') return { fill: pal.mileSoft, stroke: pal.mile, sw: 1.2 };
    if (st === 'Open') return { fill: pal.box, stroke: pal.muted, sw: 1.2 };
    return { fill: pal.bg, stroke: pal.boxLine, sw: 1, dash: '4 3' };
  }

  function statusIcon(st, cx, cy, pal) {
    if (st === 'Validated') {
      return S.circle(cx, cy, 7, { fill: pal.good }) + S.path('M' + (cx - 3.4) + ',' + cy + ' L' + (cx - 1) + ',' + (cy + 2.6) + ' L' + (cx + 3.6) + ',' + (cy - 2.6), { stroke: pal.bg, sw: 1.8 });
    }
    if (st === 'Changed') {
      return S.circle(cx, cy, 7, { fill: pal.mile }) + S.poly([[cx, cy - 3.6], [cx + 3.6, cy + 2.8], [cx - 3.6, cy + 2.8]], { fill: pal.bg });
    }
    if (st === 'Open') return S.circle(cx, cy, 6.5, { stroke: pal.muted, sw: 1.6 });
    return S.circle(cx, cy, 6.5, { stroke: pal.boxLine, sw: 1.2, dash: '2 2' });
  }

  function consolidationCounts(q) {
    const rows = q.rows('planCheck');
    const c = { Validated: 0, Changed: 0, Open: 0, none: 0, total: rows.length };
    rows.forEach((r) => {
      if (CHECK_STATUS.indexOf(r.status) >= 0) c[r.status] += 1;
      else c.none += 1;
    });
    return c;
  }

  function renderConsolidation(q, pal) {
    const W = 1000;
    const rows = q.rows('planCheck');
    const n = Math.max(1, rows.length);
    const gap = 10;
    const tw = (W - PAD * 2 - gap * (n - 1)) / n;
    const c = consolidationCounts(q);
    let body = '';
    const head = c.none === c.total
      ? c.total + ' plans, none checked yet'
      : c.total + ' plans: ' + c.Validated + ' validated, ' + c.Changed + ' changed, ' + c.Open + ' open' + (c.none ? ', ' + c.none + ' without status' : '');
    body += S.text(PAD, 12, head, { size: 13, weight: 600, fill: pal.ink });

    const top = 38;
    const inner = tw - 20;
    // measure every tile first so all tiles share one height
    const tiles = rows.map((r) => {
      const def = CHECKS.find((d) => d._id === r._id) || {};
      const name = S.textBlock(0, 0, def.short || r.plan || '', { size: 12, weight: 600, maxW: inner, maxLines: 2 });
      const note = filled(r.what) ? S.textBlock(0, 0, r.what, { size: 11, maxW: inner, maxLines: 6, lineH: 1.3 }) : { h: 0, lines: [] };
      const link = filled(r.links) ? r.links : secNum(def.ids, def.fb);
      const foot = [r.by ? q.initials(r.by) : '', link ? 'see ' + link : ''].filter(Boolean).join(' · ');
      return { r, def, name, note, foot, linkPh: !filled(r.links) };
    });
    const nameH = 32;
    const noteH = Math.max(0, ...tiles.map((t) => t.note.h));
    const th = Math.max(112, 36 + nameH + (noteH ? noteH + 8 : 0) + 26);
    tiles.forEach((t, i) => {
      const x = PAD + i * (tw + gap);
      const st = t.r.status;
      const cs = checkStyle(st, pal);
      body += S.rect(x, top, tw, th, { fill: cs.fill, stroke: cs.stroke, sw: cs.sw, dash: cs.dash, rx: 8 });
      body += statusIcon(st, x + 17, top + 17, pal);
      body += S.text(x + 30, top + 17, CHECK_STATUS.indexOf(st) >= 0 ? st : 'No status', { size: 11, weight: 600, fill: CHECK_STATUS.indexOf(st) >= 0 ? pal.ink : pal.muted, v: 'middle', italic: CHECK_STATUS.indexOf(st) < 0 });
      body += S.textBlock(x + 10, top + 34, (t.def.short || t.r.plan || ''), { size: 12, weight: 600, maxW: inner, maxLines: 2, fill: pal.ink }).svg;
      if (t.note.h) body += S.textBlock(x + 10, top + 34 + nameH + 4, t.r.what, { size: 11, maxW: inner, maxLines: 6, lineH: 1.3, fill: pal.ink2 }).svg;
      if (t.foot) body += S.text(x + 10, top + th - 14, S.fit(t.foot, inner, 11), { size: 11, fill: pal.muted, v: 'middle', italic: t.linkPh && !t.r.by });
    });
    const lg = S.legend(
      [
        { label: 'Validated', color: pal.goodSoft, stroke: pal.good },
        { label: 'Changed in the workshop', color: pal.mileSoft, stroke: pal.mile },
        { label: 'Open', color: pal.box, stroke: pal.muted },
      ],
      PAD, top + th + 16, pal, { maxW: W - PAD * 2 }
    );
    body += lg.svg;
    return S.svg(W, top + th + 16 + lg.h + 8, body, { pal, label: 'Consolidation status of the eight plans' });
  }

  // =====================================================================================
  // Graphic: Filing structure (WBS as folder tree)
  // =====================================================================================

  function filingItems(q) {
    const wbs = q.wbs();
    const root = wbs.find((r) => r.level === 1);
    const pm = wbs.find((r) => r.kind === 'PM phase') || wbs.find((r) => r.code === '1.1');
    const fromWbs = (r, depth, kind) => ({ depth, kind, code: r.code, name: q.label(r, 'name') || '(no name)', ph: q.isPlaceholder(r, 'name') || !r.name });
    const segs = [];

    // project management: the PM plan and its documents
    const pmItem = pm ? fromWbs(pm, 1, 'phase') : { depth: 1, kind: 'phase', code: '1.1', name: 'Project management', ph: true };
    const ver = currentVersion(q);
    const plan = { depth: 2, kind: 'plan', name: 'PM plan', extra: ver ? 'v' + ver : '', anc: [pmItem] };
    pmItem.anc = [];
    const docs = q.rows('planContents');
    const inc = docs.filter((r) => r.included);
    const docItems = (inc.length ? inc : docs).map((r) => {
      const def = DOCS.find((d) => d._id === r._id) || {};
      return { depth: 3, kind: 'doc', name: def.short || r.doc, extra: inc.length && filled(r.version) ? 'v' + r.version : '', ph: !inc.length, anc: [pmItem, plan] };
    });
    segs.push([pmItem, plan].concat(docItems));

    // other phases: one folder per work package for the result documentation
    wbs.filter((r) => r.level === 2 && r !== pm).forEach((ph) => {
      const head = fromWbs(ph, 1, 'phase');
      head.anc = [];
      const seg = [head];
      const stack = [head];
      wbs.filter((r) => r.level >= 3 && r.code.indexOf(ph.code + '.') === 0).forEach((r) => {
        const depth = r.level - 1;
        const it = fromWbs(r, depth, r.kind === 'Work package' ? 'wp' : 'group');
        stack.length = depth - 1;
        it.anc = stack.slice().filter(Boolean);
        stack[depth - 1] = it;
        seg.push(it);
      });
      segs.push(seg);
    });
    const rootItem = root ? fromWbs(root, 0, 'root') : { depth: 0, kind: 'root', code: '1', name: 'Project folder', ph: true };
    return { root: rootItem, segs };
  }

  function renderFiling(q, pal) {
    const W = 1000;
    const { root, segs } = filingItems(q);
    const total = segs.reduce((s, g) => s + g.length, 0);
    const ncols = total <= 24 ? 1 : total <= 52 ? 2 : 3;
    const target = Math.ceil(total / ncols);
    const limit = Math.max(target + 3, Math.ceil(target * 1.2));
    const cols = [[]];
    segs.forEach((seg) => {
      let cur = cols[cols.length - 1];
      if (cur.length && cur.length + seg.length > limit) {
        cur = [];
        cols.push(cur);
      }
      seg.forEach((it, i) => {
        if (cur.length >= limit && i > 0) {
          cur = (it.anc || []).map((a) => Object.assign({}, a, { cont: true }));
          cols.push(cur);
        }
        cur.push(it);
      });
    });
    const nc = cols.length;
    const cgap = 24;
    const colW = (W - PAD * 2 - cgap * (nc - 1)) / nc;
    const IND = 18;
    const rowH = 20;
    const rootY = 10;
    const busY = rootY + 28;
    const y0 = busY + 8;
    const maxRows = Math.max(...cols.map((c) => c.length));

    const iconStyle = (it) => {
      if (it.ph) return { fill: 'none', stroke: pal.muted, dash: '2.5 2' };
      if (it.kind === 'root') return { fill: pal.strong, stroke: pal.strong };
      if (it.kind === 'plan') return { fill: pal.accent, stroke: pal.accent };
      if (it.kind === 'phase') return { fill: pal.accentSoft, stroke: pal.accent };
      if (it.kind === 'doc') return { fill: pal.bg, stroke: pal.accent };
      return { fill: pal.box, stroke: pal.muted };
    };

    let lines = '';
    let marks = '';
    // root folder and the bus to every column
    marks += folder(PAD, rootY + 4, iconStyle(root));
    let rx = PAD + 24;
    if (root.code) {
      marks += S.text(rx, rootY + 10, root.code, { size: 12, family: 'mono', fill: pal.muted, v: 'middle' });
      rx += S.measure(root.code, 12, 400, 'mono') + 8;
    }
    marks += S.text(rx, rootY + 10, S.fit(root.name, W - rx - 160, 13, 600), { size: 13, weight: 600, fill: root.ph ? pal.muted : pal.ink, italic: root.ph, v: 'middle' });
    marks += S.text(W - PAD, rootY + 10, 'Project folder', { size: 11, fill: pal.muted, anchor: 'end', v: 'middle' });
    const colX = (ci) => PAD + ci * (colW + cgap);
    lines += S.line(PAD + 8, rootY + 16, PAD + 8, busY, { stroke: pal.axis });
    if (nc > 1) lines += S.line(PAD + 8, busY, colX(nc - 1) + 8, busY, { stroke: pal.axis });

    cols.forEach((col, ci) => {
      const cx0 = colX(ci);
      const centre = (i) => y0 + i * rowH + rowH / 2;
      const lastAt = [];
      const lastChild = {};
      col.forEach((it, i) => {
        const d = it.depth;
        const parent = d >= 2 ? lastAt[d - 1] : -1;
        const key = d + ':' + (parent === undefined ? 'top' : parent);
        lastChild[key] = { i, d, parent };
        lastAt[d] = i;
        lastAt.length = d + 1;
      });
      Object.keys(lastChild).forEach((k) => {
        const lc = lastChild[k];
        const gx = cx0 + (lc.d - 1) * IND + 8;
        const fromY = lc.parent === -1 || lc.parent === undefined ? (lc.d === 1 ? busY : y0) : centre(lc.parent) + 6;
        lines += S.line(gx, fromY, gx, centre(lc.i), { stroke: pal.axis });
      });
      col.forEach((it, i) => {
        const cy = centre(i);
        const ix = cx0 + it.depth * IND;
        lines += S.line(cx0 + (it.depth - 1) * IND + 8, cy, ix - 1, cy, { stroke: pal.axis });
        marks += folder(ix, cy - 6, iconStyle(it));
        let tx = ix + 22;
        const right = cx0 + colW;
        if (it.code && it.kind !== 'plan' && it.kind !== 'doc') {
          marks += S.text(tx, cy, it.code, { size: 11, family: 'mono', fill: pal.muted, v: 'middle' });
          tx += S.measure(it.code, 11, 400, 'mono') + 6;
        }
        let extraW = 0;
        if (it.extra && !it.cont) {
          marks += S.text(right, cy, it.extra, { size: 11, family: 'mono', fill: pal.muted, anchor: 'end', v: 'middle' });
          extraW = S.measure(it.extra, 11, 400, 'mono') + 8;
        }
        const strong = it.kind === 'phase' || it.kind === 'plan';
        const label = it.name + (it.cont ? ' (cont.)' : '');
        marks += S.text(tx, cy, S.fit(label, Math.max(20, right - tx - extraW), 12, strong ? 600 : 400), {
          size: 12, weight: strong ? 600 : 400, fill: it.ph || it.cont ? pal.muted : it.kind === 'doc' ? pal.ink2 : pal.ink, italic: it.ph, v: 'middle',
        });
      });
    });

    // legend
    const ly = y0 + maxRows * rowH + 18;
    const items = [
      { label: 'Project and phases', st: { fill: pal.accentSoft, stroke: pal.accent } },
      { label: 'PM plan', st: { fill: pal.accent, stroke: pal.accent } },
      { label: 'PM plan documents', st: { fill: pal.bg, stroke: pal.accent } },
      { label: 'Work package results', st: { fill: pal.box, stroke: pal.muted } },
      { label: 'Not filled in yet', st: { fill: 'none', stroke: pal.muted, dash: '2.5 2' } },
    ];
    let lx = PAD;
    let lyy = ly;
    items.forEach((it) => {
      const w = 22 + S.measure(it.label, 11) + 20;
      if (lx + w > W - PAD) {
        lx = PAD;
        lyy += 20;
      }
      marks += folder(lx, lyy, it.st);
      marks += S.text(lx + 22, lyy + 7, it.label, { size: 11, fill: pal.ink2, v: 'middle' });
      lx += w;
    });
    return S.svg(W, lyy + 22, lines + marks, { pal, label: 'Filing structure: the WBS as a folder tree' });
  }
